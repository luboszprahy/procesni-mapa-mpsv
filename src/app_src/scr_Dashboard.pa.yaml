      # --- sloupec 4: aktivity ---
      - rec_SloupecAktivity:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylKarta
            Height: =Parent.Height - 240
            Width: =Parent.Width - 1058
            X: =1018
            Y: =216
      - lbl_h_SlAktivity:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =10
            Text: ="AKTIVITA"
            VerticalAlign: =VerticalAlign.Middle
            Width: =200
            X: =1034
            Y: =222
      - lbl_SlAktivityPrazdno:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =60
            Size: =11
            Text: |-
              =If(
                  IsBlank(varDashDp),
                  "Vyber dílčí proces vlevo",
                  "K tomuhle dílčímu procesu zatím žádná aktivita není"
              )
            Visible: |-
              =IsBlank(varDashDp) || IsEmpty(Filter(colAkt, dilci_proces_kod = varDashDp))
            VerticalAlign: =VerticalAlign.Middle
            Width: =Parent.Width - 1058
            X: =1018
            Y: =300
      - gal_SlAktivity:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextOneImageVariant_ver5.0
          Properties:
            Height: =Parent.Height - 296
            Items: |-
              =Sort(Filter(colAkt, dilci_proces_kod = varDashDp), Title, SortOrder.Ascending)
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =56
            Visible: =!IsBlank(varDashDp)
            Width: =Parent.Width - 1058
            X: =1018
            Y: =252
          Children:
            # Aktivita je koncová úroveň — klik nevybírá, ale otevírá detail.
            # varAktivita se plní z listu, ne z colAkt: kolekce nese jen část
            # sloupců a detail potřebuje celý záznam.
            - rec_AkPozadi:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =stylKarta
                  Height: =Parent.TemplateHeight - 1
                  HoverFill: =stylRadekHover
                  OnSelect: |-
                    =Set(varNova, false);
                    Set(varAktivita, LookUp(Aktivity, Title = ThisItem.Title));
                    Navigate(scr_Detail, ScreenTransition.Cover)
                  PressedFill: =stylRadekVybrany
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - lbl_AkKod:
                Control: Label@2.5.1
                Properties:
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =18
                  Size: =9
                  Text: =ThisItem.Title
                  Width: =120
                  X: =16
                  Y: =8
            - lbl_AkStav:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: |-
                    =If(ThisItem.stav.Value = "schváleno", stylUspech, stylPozor)
                  Font: =Font.'Open Sans'
                  Height: =18
                  Size: =9
                  Text: =ThisItem.stav.Value
                  Width: =100
                  X: =Parent.TemplateWidth - 116
                  Y: =8
            - lbl_AkNazev:
                Control: Label@2.5.1
                Properties:
                  Color: =stylText
                  Font: =Font.'Open Sans'
                  Height: =28
                  Size: =11
                  Text: =ThisItem.nazev_kratky
                  Tooltip: |-
                    =ThisItem.Title & " · " & ThisItem.nazev_kratky &
                    If(IsBlank(ThisItem.vykonava), "", Char(10) & "Vykonává: " & ThisItem.vykonava) &
                    Char(10) & "Klikni pro detail"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.TemplateWidth - 32
                  X: =16
                  Y: =24
            - rec_AkLinka:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =stylOkraj
                  Height: =1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =Parent.TemplateHeight - 1
