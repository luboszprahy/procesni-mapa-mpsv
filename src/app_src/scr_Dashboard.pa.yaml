      - gal_Strom:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextOneImageVariant_ver5.0
          Properties:
            Height: =Parent.Height - 296
            Items: |-
              =Sort(
                  Filter(
                      colStrom,
                      uroven = 1
                      || (uroven = 2 && !IsBlank(LookUp(colOtevrene, Kod = rodic)))
                      || (
                          uroven = 3
                          && !IsBlank(LookUp(colOtevrene, Kod = rodic))
                          && !IsBlank(LookUp(colOtevrene, Kod = Left(kod, 2)))
                      )
                      || (
                          uroven = 4
                          && !IsBlank(LookUp(colOtevrene, Kod = rodic))
                          && !IsBlank(LookUp(colOtevrene, Kod = Left(kod, 5)))
                          && !IsBlank(LookUp(colOtevrene, Kod = Left(kod, 2)))
                      )
                  ),
                  kod,
                  SortOrder.Ascending
              )
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =40
            Width: =Parent.Width - 80
            X: =40
            Y: =252
          Children:
            # Podklad nese i klik: u větve rozbaluje, u aktivity otevírá detail.
            # varDashUroven = 0 znamená „ručně rozbalené", aby zvýrazněné
            # tlačítko netvrdilo něco, co už neplatí.
            - rec_StromPozadi:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =Switch(
                        ThisItem.uroven,
                        1, RGBA(231, 239, 247, 1),
                        2, RGBA(238, 245, 251, 1),
                        3, RGBA(238, 247, 242, 1),
                        stylKarta
                    )
                  Height: =Parent.TemplateHeight - 1
                  HoverFill: =stylRadekHover
                  OnSelect: |-
                    =If(
                        ThisItem.uroven = 4,
                        Set(varNova, false);
                        Set(varAktivita, LookUp(Aktivity, Title = ThisItem.kod));
                        Navigate(scr_Detail, ScreenTransition.Cover),
                        If(
                            IsBlank(LookUp(colOtevrene, Kod = ThisItem.kod)),
                            Collect(colOtevrene, { Kod: ThisItem.kod }),
                            RemoveIf(colOtevrene, Kod = ThisItem.kod)
                        );
                        Set(varDashUroven, 0)
                    )
                  PressedFill: =stylRadekVybrany
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - rec_StromPruh:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =Switch(
                        ThisItem.uroven,
                        1, stylPrimarni,
                        2, stylAkce,
                        3, stylUspech,
                        stylOkraj
                    )
                  Height: =Parent.TemplateHeight - 1
                  Width: =3
                  X: =16 + (ThisItem.uroven - 1) * 28
                  Y: =0
            - lbl_StromSipka:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =11
                  Text: |-
                    =If(
                        ThisItem.pocet = 0,
                        "",
                        If(IsBlank(LookUp(colOtevrene, Kod = ThisItem.kod)), "▸", "▾")
                    )
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =20
                  X: =27 + (ThisItem.uroven - 1) * 28
                  Y: =0
            - lbl_StromKod:
                Control: Label@2.5.1
                Properties:
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =10
                  Text: =ThisItem.kod
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =varZobrazitKod
                  Width: =130
                  X: =51 + (ThisItem.uroven - 1) * 28
                  Y: =0
            - lbl_StromNazev:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =Switch(
                        ThisItem.uroven,
                        1, stylPrimarni,
                        2, stylAkce,
                        3, stylUspech,
                        stylText
                    )
                  Font: =Font.'Open Sans'
                  FontWeight: |-
                    =If(ThisItem.uroven <= 2, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Parent.TemplateHeight - 1
                  Size: =11
                  Text: =ThisItem.nazev
                  Tooltip: |-
                    =Switch(ThisItem.uroven, 1, "Agenda ", 2, "Proces ", 3, "Dílčí proces ", "Aktivita ") &
                    ThisItem.kod & Char(10) & ThisItem.nazev & Char(10) &
                    If(
                        ThisItem.uroven = 4,
                        "Klikni pro detail",
                        "Obsahuje " & ThisItem.pocet & " položek na další úrovni - klikni pro rozbalení"
                    )
                  VerticalAlign: =VerticalAlign.Middle
                  Width: |-
                    =Parent.TemplateWidth - 240 - If(varZobrazitKod, 140, 10) - (ThisItem.uroven - 1) * 28
                  X: |-
                    =If(varZobrazitKod, 191, 51) + (ThisItem.uroven - 1) * 28
                  Y: =0
            - lbl_StromUtvar:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =10
                  Text: =ThisItem.utvar
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =160
                  X: =Parent.TemplateWidth - 360
                  Y: =0
            # Nula je u dílčího procesu důležitá informace (v rejstříku je,
            # ale nikdo k němu ještě nepopsal činnosti), proto se vypisuje.
            - lbl_StromPocet:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: |-
                    =If(ThisItem.uroven = 3 && ThisItem.pocet = 0, stylTextSlaby, stylAkce)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight - 1
                  Size: =10
                  Text: |-
                    =If(ThisItem.uroven = 4, "", Text(ThisItem.pocet))
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =120
                  X: =Parent.TemplateWidth - 160
                  Y: =0
            - rec_StromLinka:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =stylOkraj
                  Height: =1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =Parent.TemplateHeight - 1
