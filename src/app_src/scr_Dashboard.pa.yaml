            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylAkceStisk
            Size: =10
            Text: ="Export  ▾"
            Tooltip: '="Uloží to, co je právě vidět ve stromu - po filtru stavu, hledání i chipu osiřelých - jako dokument pro Word nebo tabulku pro Excel. Neexportuje celý rejstřík, ale momentální pohled. Soubor vzniká v knihovně Site Assets a rovnou se stáhne."'
