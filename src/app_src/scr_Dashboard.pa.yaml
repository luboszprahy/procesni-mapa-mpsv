            Size: =11
            Text: ="Do Excelu (.xls)"
            Tooltip: '="Uloží momentální pohled jako tabulku se sloupci úroveň, kód, název, vlastník a stav. Kódy zůstávají textem - v .csv je Excel převáděl na data (01-01 na 01.I). Formát .xls místo .xlsx schválně: .xlsx by vyžadoval placený konektor, který v tomhle prostředí není povolený, takže je to HTML tabulka s excelovým formátováním. Excel při otevření jednou upozorní, že přípona neodpovídá obsahu - potvrď Ano."'
