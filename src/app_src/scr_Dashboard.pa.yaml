            PressedColor: =RGBA(255, 255, 255, 1)
            Size: =13
            Text: ="Seznam aktivit"
            Tooltip: '="Přepne na seznam aktivit, kde se pořizuje a edituje."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =160
            X: =428
