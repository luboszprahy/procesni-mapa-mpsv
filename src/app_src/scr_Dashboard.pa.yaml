      # Přejmenováno z „Obnovit mapu" na „Obnovit HTML" (23.08.2026): mapa
      # se v appce nemění, mění se ta publikovaná HTML stránka.
      - btn_ObnovitHtml:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =stylAkce
            DisplayMode: =If(varPublikuji, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =stylKarta
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =stylAkce
            HoverFill: =stylRadekHover
            OnSelect: |-
              =Set(varMenuMapa, false);
              Set(varPublikuji, true);
              IfError(
                  MapaPublishFlow.Run();
                  Notify("Publikace spuštěna. Přegenerování chvíli trvá - pak stránku otevři volbou Zobrazit v HTML.", NotificationType.Information),
                  Notify("Publikace selhala: " & FirstError.Message, NotificationType.Error)
              );
              Set(varPublikuji, false)
            PaddingLeft: =12
            PressedColor: =stylAkceStisk
            PressedFill: =stylRadekVybrany
            Size: =11
            Text: ="Obnovit HTML"
            Tooltip: '="Přegeneruje publikovanou HTML stránku z dnešního obsahu rejstříku. Stránka data nečte živě - ukazuje stav k okamžiku poslední publikace, takže po každé dávce úprav ji je potřeba obnovit. Běh trvá několik sekund a probíhá na pozadí; hlášení potvrzuje spuštění, ne dokončení. Kromě toho se stránka obnovuje sama každý den v 7:00."'
            Visible: =varMenuMapa
            Width: =212
            X: =858
            Y: =212
      # ---------- potvrzení smazání ----------
      # Power Apps nemá nativní confirm(), takže dialog je vrstva nad
      # obrazovkou. Souřadnice jsou vzorce, takže kontrola překryvu je
      # přeskočí — u překryvné vrstvy je to správně.
      - rec_ModalStinD:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            OnSelect: =Set(varSmazatD, Blank())
            Visible: =!IsBlank(varSmazatD)
            Width: =Parent.Width
            X: =0
            Y: =0
      - rec_ModalKartaD:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylKarta
            Height: =360
            Visible: =!IsBlank(varSmazatD)
            Width: =640
            X: =Parent.Width / 2 - 320
            Y: =Parent.Height / 2 - 180
      - rec_ModalPruhD:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylNebezpeci
            Height: =4
            Visible: =!IsBlank(varSmazatD)
            Width: =640
            X: =Parent.Width / 2 - 320
            Y: =Parent.Height / 2 - 180
      - lbl_ModalNadpisD:
          Control: Label@2.5.1
          Properties:
            Color: =stylText
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =15
            Text: |-
              =Switch(
                  varSmazatD.uroven,
                  1, "Smazat agendu?",
                  2, "Smazat proces?",
                  3, "Smazat dílčí proces?",
                  "Smazat aktivitu?"
              )
            Visible: =!IsBlank(varSmazatD)
            Width: =576
            X: =Parent.Width / 2 - 288
            Y: =Parent.Height / 2 - 148
      - lbl_ModalTextD:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =200
            Size: =12
            Text: |-
              =varSmazatD.kod & " — " & varSmazatD.nazev & Char(10) & Char(10) &
              Switch(
                  varSmazatD.uroven,
                  1,
                  "Pod touto agendou je " & varSmazatD.pocet &
                  " procesů. Smazáním agendy nezmizí — zůstanou bez nadřazené položky a najdeš je přepínačem „osiřelé“ nad stromem.",
                  2,
                  "Pod tímto procesem je " & varSmazatD.pocet &
                  " dílčích procesů. Smazáním procesu nezmizí — zůstanou bez nadřazené položky a najdeš je přepínačem „osiřelé“ nad stromem.",
                  3,
                  "Pod tímto dílčím procesem je " & varSmazatD.pocet &
                  " aktivit. Smazáním dílčího procesu nezmizí — zůstanou bez nadřazené položky a najdeš je přepínačem „osiřelé“ nad stromem.",
                  "Smaže se aktivita i všechna její zařazení do dílčích procesů. Nic pod ní není, takže nic neosiří; číselník agend, procesů a dílčích procesů zůstane nedotčený."
              ) & Char(10) & Char(10) &
              "Vrátit to zpět nejde."
            Visible: =!IsBlank(varSmazatD)
            Width: =576
            X: =Parent.Width / 2 - 288
            Y: =Parent.Height / 2 - 112
      - btn_ModalZrusitD:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =stylText
            Fill: =stylKarta
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =40
            HoverFill: =stylRadekHover
            OnSelect: =Set(varSmazatD, Blank())
            PressedFill: =stylRadekVybrany
            Size: =13
            Text: ="Zrušit"
            Visible: =!IsBlank(varSmazatD)
            Width: =140
            X: =Parent.Width / 2 - 288
            Y: =Parent.Height / 2 + 108
      # Po smazání se colStrom přestaví celá: příznak osiřelosti se mění
      # i řádkům, kterých se mazání přímo netýká, a přepisovat je jeden po
      # druhém by bylo křehčí než nechat OnVisible přepočítat všechno.
      - btn_ModalSmazatD:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =stylNebezpeci
            FocusedBorderColor: =stylNebezpeci
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =40
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =stylNebezpeci
            OnSelect: |-
              =IfError(
                  If(
                      varSmazatD.uroven = 1,
                      Remove(Agendy, LookUp(Agendy, Title = varSmazatD.kod));
                      RemoveIf(colAgendy, Title = varSmazatD.kod),
                      varSmazatD.uroven = 2,
                      Remove(Procesy, LookUp(Procesy, Title = varSmazatD.kod));
                      RemoveIf(colProcesy, Title = varSmazatD.kod),
                      varSmazatD.uroven = 3,
                      Remove('Dílčí procesy', LookUp('Dílčí procesy', Title = varSmazatD.kod));
                      RemoveIf(colDilci, Title = varSmazatD.kod);
                      RemoveIf(
                          'Vazba aktivita–dílčí proces',
                          dilci_proces_kod = varSmazatD.kod
                      ),
                      RemoveIf('Vazba aktivita–dílčí proces', aktivita_kod = varSmazatD.kod);
                      Remove(Aktivity, LookUp(Aktivity, Title = varSmazatD.kod))
                  );
                  Notify("Smazáno: " & varSmazatD.kod & ".", NotificationType.Success);
                  Set(varSmazatD, Blank());
                  Set(varAktStale, true);
                  Navigate(scr_Dashboard, ScreenTransition.None),
                  Notify("Smazání selhalo: " & FirstError.Message, NotificationType.Error);
                  Set(varSmazatD, Blank())
              )
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylNebezpeci
            Size: =13
            Text: ="Smazat"
            Tooltip: |-
              =If(
                  varSmazatD.uroven = 4,
                  "Nevratné. Smaže aktivitu i všechna její zařazení do dílčích procesů.",
                  "Nevratné. Smaže jen tuto položku číselníku; podřízené záznamy zůstanou a stanou se z nich osiřelé položky."
              )
            Visible: =!IsBlank(varSmazatD)
            Width: =160
            X: =Parent.Width / 2 + 128
            Y: =Parent.Height / 2 + 108
