            Height: =36
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.26)
            OnSelect: |-
              =Set(varUrovenTyp, "agenda");
              Set(varCiselnikNova, true);
              Set(varCiselnikKod, "");
              Navigate(scr_Ciselnik, ScreenTransition.Cover)
