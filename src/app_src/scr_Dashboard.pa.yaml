# Obrazovka 0 — přehled (úvodní obrazovka appky).
#
# Rozvržení podle vzoru powerApps-MessageCenterDashboard: tmavý navbar se
# záložkami → řada karet s čísly → pod nimi plocha s rozpadem.
#
# ROZPAD je čtyři sloupce vedle sebe (agendy → procesy → dílčí procesy →
# aktivity). Klik v levějším sloupci zúží ten napravo; sloupce vpravo od
# posledního výběru zůstanou prázdné s výzvou, aby bylo poznat, že se čeká
# na volbu, ne že tam nic není. Klik na aktivitu otevře její detail.
#
# POČTY se počítají z kolekcí, ne z listu: CountRows nad SharePointem se
# nedeleguje. colAgendy/colProcesy/colDilci plní App.OnStart (číselníky jsou
# malé a načtou se celé), aktivity se načítají tady do colAkt — a jen když
# je potřeba, tedy při prvním zobrazení nebo po zápisu (varAktStale).
# Nad 2 000 aktivitami je colAkt první okno dat, na což upozorňuje popisek
# karty; totéž omezení má dnes i seznam aktivit.
#
# FILTR STAVU (varDashStav) se neopírá o přepočet při každém překreslení:
# každý uzel si při stavbě colStrom nese aktC (kolik aktivit je v jeho
# podstromu) a aktS (kolik z nich je schválených). Filtrování i číslo ve
# sloupci jsou pak jen porovnání nad hotovou kolekcí, takže přepnutí stavu
# nesahá na data. Pracovních je aktC - aktS, druhý počet se neukládá.
#
# Sloupec aktivit ukazuje PRIMÁRNÍ zařazení (Aktivity.dilci_proces_kod).
# Aktivita zařazená do dalších dílčích procesů se v mapě objeví ve všech,
# ale tady je jen pod tím svým hlavním — vazební tabulka by znamenala
# dohledávání názvu ke každému řádku zvlášť. Kde všude aktivita je, ukazuje
# její detail.
Screens:
  scr_Dashboard:
    Properties:
      Fill: =stylPlocha
      LoadingSpinnerColor: =stylAkce
      OnVisible: |-
        =If(
            IsEmpty(colAgendy) || IsEmpty(colProcesy) || IsEmpty(colDilci),
            ClearCollect(colAgendy, ShowColumns(Agendy, Title, nazev, vlastnik));
            ClearCollect(colProcesy, ShowColumns(Procesy, Title, nazev, agenda_kod, vlastnik));
            ClearCollect(colDilci, ShowColumns('Dílčí procesy', Title, nazev, proces_kod, vlastnik))
        );
        If(
            IsEmpty(colAkt) || varAktStale,
            ClearCollect(
                colAkt,
                ShowColumns(Aktivity, Title, nazev, nazev_kratky, dilci_proces_kod, vykonava, sekce, stav)
            );
            ClearCollect(
                colStrom,
                ForAll(
                    colAgendy As a,
                    {
                        kod: a.Title,
                        nazev: a.nazev,
                        nazevPlny: a.nazev,
                        utvar: a.vlastnik,
                        uroven: 1,
                        rodic: "",
                        pocet: CountRows(Filter(colProcesy, agenda_kod = a.Title)),
                        osirely: CountRows(Filter(colProcesy, agenda_kod = a.Title)) = 0,
                        aktC: CountRows(Filter(colAkt, Left(dilci_proces_kod, 2) = a.Title)),
                        aktS: CountRows(
                            Filter(colAkt, Left(dilci_proces_kod, 2) = a.Title, stav.Value = "schváleno")
                        )
                    }
                )
            );
            Collect(
                colStrom,
                ForAll(
                    colProcesy As p,
                    {
                        kod: p.Title,
                        nazev: p.nazev,
                        nazevPlny: p.nazev,
                        utvar: p.vlastnik,
                        uroven: 2,
                        rodic: p.agenda_kod,
                        osirely: IsBlank(p.agenda_kod) || IsBlank(LookUp(colAgendy, Title = p.agenda_kod)),
                        pocet: CountRows(Filter(colDilci, proces_kod = p.Title)),
                        aktC: CountRows(Filter(colAkt, Left(dilci_proces_kod, 5) = p.Title)),
                        aktS: CountRows(
                            Filter(colAkt, Left(dilci_proces_kod, 5) = p.Title, stav.Value = "schváleno")
                        )
                    }
                )
            );
            Collect(
                colStrom,
                ForAll(
                    colDilci As d,
                    {
                        kod: d.Title,
                        nazev: d.nazev,
                        nazevPlny: d.nazev,
                        utvar: d.vlastnik,
                        uroven: 3,
                        rodic: d.proces_kod,
                        osirely: IsBlank(d.proces_kod) || IsBlank(LookUp(colProcesy, Title = d.proces_kod)),
                        pocet: CountRows(Filter(colAkt, dilci_proces_kod = d.Title)),
                        aktC: CountRows(Filter(colAkt, dilci_proces_kod = d.Title)),
                        aktS: CountRows(
                            Filter(colAkt, dilci_proces_kod = d.Title, stav.Value = "schváleno")
                        )
                    }
                )
            );
            Collect(
                colStrom,
                ForAll(
                    colAkt As k,
                    {
                        kod: k.Title,
                        nazev: k.nazev_kratky,
                        nazevPlny: k.nazev,
                        utvar: k.vykonava,
                        uroven: 4,
                        rodic: k.dilci_proces_kod,
                        osirely: IsBlank(k.dilci_proces_kod) || IsBlank(LookUp(colDilci, Title = k.dilci_proces_kod)),
                        pocet: 0,
                        aktC: 1,
                        aktS: If(k.stav.Value = "schváleno", 1, 0)
                    }
                )
            );
            Set(
                varZmapovanoDp,
                CountRows(Filter(colStrom, uroven = 3, pocet > 0))
            );
            Set(varAktStale, false)
        );
        If(
            IsEmpty(colOtevrene),
            ClearCollect(colOtevrene, { Kod: "" });
            Collect(colOtevrene, ForAll(colAgendy As a, { Kod: a.Title }));
            Set(varDashUroven, 2)
        )
    Children:
      # ---------- navbar ----------
