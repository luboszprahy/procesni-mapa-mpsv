# Obrazovka 0 — přehled (úvodní obrazovka appky).
#
# Rozvržení podle vzoru powerApps-MessageCenterDashboard: tmavý navbar se
# záložkami → řada karet s čísly → pod nimi plocha s rozpadem.
#
# ROZPAD je čtyři sloupce vedle sebe (agendy → procesy → dílčí procesy →
# aktivity). Klik v levějším sloupci zúží ten napravo; sloupce vpravo od
# posledního výběru zůstanou prázdné s výzvou, aby bylo poznat, že se čeká
# na volbu, ne že tam nic není. Klik na aktivitu otevře její detail.
#
# POČTY se počítají z kolekcí, ne z listu: CountRows nad SharePointem se
# nedeleguje. colAgendy/colProcesy/colDilci plní App.OnStart (číselníky jsou
# malé a načtou se celé), aktivity se načítají tady do colAkt — a jen když
# je potřeba, tedy při prvním zobrazení nebo po zápisu (varAktStale).
# Nad 2 000 aktivitami je colAkt první okno dat, na což upozorňuje popisek
# karty; totéž omezení má dnes i seznam aktivit.
#
# Sloupec aktivit ukazuje PRIMÁRNÍ zařazení (Aktivity.dilci_proces_kod).
# Aktivita zařazená do dalších dílčích procesů se v mapě objeví ve všech,
# ale tady je jen pod tím svým hlavním — vazební tabulka by znamenala
# dohledávání názvu ke každému řádku zvlášť. Kde všude aktivita je, ukazuje
# její detail.
Screens:
  scr_Dashboard:
    Properties:
      Fill: =stylPlocha
      LoadingSpinnerColor: =stylAkce
      OnVisible: |-
        =If(
            IsEmpty(colAkt) || varAktStale,
            ClearCollect(
                colAkt,
                ShowColumns(Aktivity, Title, nazev_kratky, dilci_proces_kod, vykonava, stav)
            );
            Set(varAktStale, false)
        );
        Set(
            varZmapovanoDp,
            CountRows(Filter(colDilci As dp, CountRows(Filter(colAkt, dilci_proces_kod = dp.Title)) > 0))
        )
    Children:
      # ---------- navbar ----------
      - rec_NavbarD:
