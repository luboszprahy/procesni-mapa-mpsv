      - lbl_h_StromPocet:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =10 + varFs
            Text: |-
              =If(varDashStav = "", "POLOŽEK UVNITŘ", "AKTIVIT " & Upper(varDashStav))
            Tooltip: '="Bez filtru stavu je to počet položek o úroveň níž: u agendy procesy, u procesu dílčí procesy, u dílčího procesu aktivity. U aktivity zůstává prázdné - nižší úroveň už nemá. Nula u dílčího procesu znamená, že v rejstříku je, ale žádná aktivita k němu zatím není popsaná. Se zapnutým filtrem stavu se číslo přepne na počet aktivit toho stavu v celé větvi."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =180
            X: =Parent.Width - 314
            Y: =222
      - gal_Strom:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextOneImageVariant_ver5.0
          Properties:
            Height: =Parent.Height - 296
            Items: |-
              =Sort(
                  Filter(
                      colStrom,
                      uroven = 1
                      || (uroven = 2 && !IsBlank(LookUp(colOtevrene, Kod = rodic)))
                      || (
                          uroven = 3
                          && !IsBlank(LookUp(colOtevrene, Kod = rodic))
                          && !IsBlank(LookUp(colOtevrene, Kod = Left(kod, 2)))
                      )
                      || (
                          uroven = 4
                          && !IsBlank(LookUp(colOtevrene, Kod = rodic))
                          && !IsBlank(LookUp(colOtevrene, Kod = Left(kod, 5)))
                          && !IsBlank(LookUp(colOtevrene, Kod = Left(kod, 2)))
                      ),
                      varDashStav = ""
                      || If(varDashStav = "schváleno", aktS > 0, aktC - aktS > 0)
                  ),
                  kod,
                  SortOrder.Ascending
              )
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =40 + varFs * 4
            Width: =Parent.Width - 80
            X: =40
            Y: =252
          Children:
            # Podklad jen barví vrstvu. Klik i hover nese lbl_StromPrekryv
            # jako poslední prvek řádku — popisky nad podkladem by jinak
            # kliknutí spolkly a řádek by reagoval jen na mezerách mezi nimi
            # (hlášeno z provozu 21.08.2026: „klikání na řádky nefunguje").
            - rec_StromPozadi:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =Switch(
                        ThisItem.uroven,
                        1, RGBA(231, 239, 247, 1),
                        2, RGBA(238, 245, 251, 1),
                        3, RGBA(238, 247, 242, 1),
                        stylKarta
                    )
                  Height: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - rec_StromPruh:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =Switch(
                        ThisItem.uroven,
                        1, stylPrimarni,
                        2, stylAkce,
                        3, stylUspech,
                        stylOkraj
                    )
                  Height: =Parent.TemplateHeight - 1
                  Width: =3
                  X: =16 + (ThisItem.uroven - 1) * 28
                  Y: =0
            - lbl_StromSipka:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =11 + varFs
                  Text: |-
                    =If(
                        ThisItem.pocet = 0,
                        "",
                        If(IsBlank(LookUp(colOtevrene, Kod = ThisItem.kod)), "▸", "▾")
                    )
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =20
                  X: =27 + (ThisItem.uroven - 1) * 28
                  Y: =0
            - lbl_StromKod:
                Control: Label@2.5.1
                Properties:
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =10 + varFs
                  Text: =ThisItem.kod
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =varZobrazitKod
                  Width: =130 + varFs * 12
                  X: =51 + (ThisItem.uroven - 1) * 28
                  Y: =0
            - lbl_StromNazev:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =Switch(
                        ThisItem.uroven,
                        1, stylPrimarni,
                        2, stylAkce,
                        3, stylUspech,
                        stylText
                    )
                  Font: =Font.'Open Sans'
                  FontWeight: |-
                    =If(ThisItem.uroven <= 2, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Parent.TemplateHeight - 1
                  Size: =11 + varFs
                  Text: =ThisItem.nazev
                  VerticalAlign: =VerticalAlign.Middle
                  # Šířka se počítá zpětně od vlastního X, ne od šířky řádku:
                  # při odsazení hlubší úrovně by pevná šířka podlezla sloupec
                  # útvaru (ten začíná na TemplateWidth - 360).
                  Width: =Parent.TemplateWidth - 400 - Self.X
                  X: |-
                    =If(varZobrazitKod, 191 + varFs * 12, 51) + (ThisItem.uroven - 1) * 28
                  Y: =0
            - lbl_StromUtvar:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =10 + varFs
                  Text: =ThisItem.utvar
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =160
                  X: =Parent.TemplateWidth - 380
                  Y: =0
            # Nula je u dílčího procesu důležitá informace (v rejstříku je,
            # ale nikdo k němu ještě nepopsal činnosti), proto se vypisuje.
            - lbl_StromPocet:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: |-
                    =If(
                        ThisItem.uroven = 3 && ThisItem.pocet = 0,
                        stylTextSlaby,
                        stylAkce
                    )
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight - 1
                  Size: =10 + varFs
                  Text: |-
                    =If(
                        ThisItem.uroven = 4,
                        "",
                        Text(
                            If(
                                varDashStav = "",
                                ThisItem.pocet,
                                If(varDashStav = "schváleno", ThisItem.aktS, ThisItem.aktC - ThisItem.aktS)
                            )
                        )
                    )
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =110
                  X: =Parent.TemplateWidth - 204
                  Y: =0
            - rec_StromLinka:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =stylOkraj
                  Height: =1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =Parent.TemplateHeight - 1
            # Průhledná vrstva přes celý řádek: nese klik i podbarvení při
            # najetí. Musí být POSLEDNÍ, aby ležela nad popisky. Stejný vzor
            # jako lbl_RadekPrekryv v seznamu aktivit; check_app.py má obojí
            # v PREKRYV_POVOLEN, protože překryv je tady záměr.
            - lbl_StromPrekryv:
                Control: Label@2.5.1
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight - 1
                  HoverFill: =RGBA(0, 90, 181, 0.14)
                  # Klik do řádku POUZE rozbaluje. Detail otevírá jedině tužka
                  # vpravo — dokud detail otevíral i celý řádek, nebylo poznat,
                  # co která akce udělá.
                  OnSelect: |-
                    =If(
                        ThisItem.uroven <> 4,
                        If(
                            IsBlank(LookUp(colOtevrene, Kod = ThisItem.kod)),
                            Collect(colOtevrene, { Kod: ThisItem.kod }),
                            RemoveIf(colOtevrene, Kod = ThisItem.kod)
                        );
                        Set(varDashUroven, 0)
                    )
                  PressedFill: =RGBA(0, 90, 181, 0.22)
                  Text: =""
                  Tooltip: |-
                    =Switch(ThisItem.uroven, 1, "Agenda ", 2, "Proces ", 3, "Dílčí proces ", "Aktivita ") &
                    ThisItem.kod & Char(10) & ThisItem.nazev & Char(10) &
                    If(
                        IsBlank(ThisItem.utvar),
                        Switch(ThisItem.uroven, 4, "Vykonávající útvar není vyplněný.", "Vlastník není vyplněný.") & Char(10),
                        Switch(ThisItem.uroven, 4, "Vykonává: ", "Vlastník: ") &
                        Concat(
                            Split(ThisItem.utvar, ";") As u,
                            Trim(u.Value) &
                            If(
                                IsBlank(LookUp(colUtvary, Title = Trim(u.Value))),
                                "",
                                " · " & LookUp(colUtvary, Title = Trim(u.Value), nazev)
                            ),
                            "; "
                        ) & Char(10)
                    ) &
                    If(
                        ThisItem.uroven = 4,
                        "Detail otevřeš tužkou vpravo.",
                        "Tužka vpravo otevře úpravu názvu a vlastníka. Číslo vpravo = počet položek o úroveň níž (" &
                        Switch(ThisItem.uroven, 1, "procesů v agendě", 2, "dílčích procesů v procesu", "aktivit v dílčím procesu") &
                        "): " & ThisItem.pocet & ". Klikni pro rozbalení."
                    )
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            # Aktivita se otevře na detailu, agenda / proces / dílčí proces
            # na scr_Ciselnik v režimu úpravy (F6/D). Do 1.0.0.34 vyšší úrovně
            # jen hlásily, že se mění přímo v SharePointu.
            - ico_StromEdit:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =stylAkce
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =36
                  HoverColor: =stylAkceHover
                  HoverFill: =stylRadekVybrany
                  Icon: =Icon.Edit
                  OnSelect: |-
                    =If(
                        ThisItem.uroven = 4,
                        Set(varDetailZpet, "dashboard");
                        Set(varNova, false);
                        Set(varAktivita, LookUp(Aktivity, Title = ThisItem.kod));
                        Navigate(scr_Detail, ScreenTransition.Cover),
                        Set(
                            varUrovenTyp,
                            Switch(ThisItem.uroven, 1, "agenda", 2, "proces", "dilci")
                        );
                        Set(varCiselnikNova, false);
                        Set(varCiselnikKod, ThisItem.kod);
                        Navigate(scr_Ciselnik, ScreenTransition.Cover)
                    )
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  PressedColor: =stylAkceStisk
                  Tooltip: |-
                    =If(
                        ThisItem.uroven = 4,
                        "Otevře detail aktivity " & ThisItem.kod & " k úpravě.",
                        "Otevře úpravu " & Switch(ThisItem.uroven, 1, "agendy ", 2, "procesu ", "dílčího procesu ") &
                        ThisItem.kod & ". Měnit jde název a vlastník; kód ani zařazení ne."
                    )
                  Width: =36
                  X: =Parent.TemplateWidth - 84
                  Y: =(Parent.TemplateHeight - 1) / 2 - 18
