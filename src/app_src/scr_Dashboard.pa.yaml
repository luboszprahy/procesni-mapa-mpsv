            Width: =180
            X: =1016
            Y: =144
      - btn_ExportWord:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =stylAkce
            DisplayMode: =If(varExportBezi, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =stylKarta
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =stylAkce
            HoverFill: =stylRadekHover
            OnSelect: |-
              =Set(varMenuExport, false);
              If(
                  IsEmpty(colExport),
                  Notify("Ve stromu není co exportovat - zruš filtr nebo hledání.", NotificationType.Warning, varNotifyMs),
                  Set(varExportBezi, true);
                  IfError(
                      Set(
                          varExportUrl,
                          ExportFlow.Run(
                              JSON(
                                  {
                                      nadpis: varExportNadpis,
                                      format: "word",
                                      radky: colExport
                                  },
                                  JSONFormat.Compact
                              )
                          ).adresa
                      );
                      Download(varExportUrl),
                      Notify("Export selhal: " & FirstError.Message, NotificationType.Error, varNotifyChybaMs)
                  );
                  Set(varExportBezi, false)
              )
            PaddingLeft: =12
            PressedColor: =stylAkceStisk
            PressedFill: =stylRadekVybrany
            Size: =11
            Text: ="Do Wordu (.doc)"
            Tooltip: '="Uloží momentální pohled jako dokument, který Word otevře a umí uložit jako .docx. Úrovně jsou odsazené jako ve stromu. Aktivity jdou do dokumentu celým zněním, ne zkráceným popiskem z řádku."'
            Visible: =varMenuExport
            Width: =172
            X: =1020
            Y: =148
