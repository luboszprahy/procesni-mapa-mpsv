            Width: =306
            X: =40
            Y: =252
          Children:
            - rec_AgPozadi:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(ThisItem.Title = varDashAgenda, stylRadekVybrany, stylKarta)
                  Height: =Parent.TemplateHeight - 1
                  HoverFill: =stylRadekHover
                  OnSelect: |-
                    =Set(varDashAgenda, ThisItem.Title);
                    Set(varDashProces, Blank());
                    Set(varDashDp, Blank())
                  PressedFill: =stylRadekVybrany
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - lbl_AgKod:
