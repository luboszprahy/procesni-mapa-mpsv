      # přeskočí — u překryvné vrstvy je to správně.
      # ---------- nabídka exportu ----------
      # Leží až za stínem nabídek: co je v souboru dřív, kreslí se níž,
      # a stín pod položkami by jinak spolkl klik (viz 1.0.0.41).
      - rec_MenuExportPanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Fill: =stylKarta
            Height: =84
