                  " aktivit. Smazáním dílčího procesu nezmizí — zůstanou bez nadřazené položky a najdeš je přepínačem „osiřelé“ nad stromem.",
                  "Smaže se aktivita i všechna její zařazení do dílčích procesů. Nic pod ní není, takže nic neosiří; číselník agend, procesů a dílčích procesů zůstane nedotčený."
