      # Sloupec vlastníka hlavičku dosud neměl a číslo vpravo taky ne, takže
      # z obrazovky nešlo poznat, co ta čísla znamenají (hlášeno 21.08.2026).
      - lbl_h_StromUtvar:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =10 + varFs
            Text: ="VLASTNÍK / VYKONÁVÁ"
            Tooltip: '="Kód útvaru z číselníku Útvary - u agendy, procesu a dílčího procesu je to jejich vlastník (sekce u agendy, odbor u procesu a dílčího procesu), u aktivity útvar, který ji vykonává. Vlastníků může být víc, pak jsou kódy oddělené středníkem (například 72; 71). Vlastník schválně není součástí identifikačního kódu - při organizační změně se mění vlastník, ne kód."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =220
            X: =Parent.Width - 480
            Y: =182
      - lbl_h_StromPocet:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
