      # Jedna editační obrazovka pro všechny čtyři úrovně včetně aktivit —
      # do 1.0.0.35 tu byla zvlášť záložka na seznam aktivit a zvlášť tlačítko
      # na číselník, tedy dvě cesty k témuž.
      - lbl_ZalozkaEditaceD:
