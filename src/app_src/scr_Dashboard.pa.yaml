                Properties:
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =18
                  Size: =9
                  Text: =ThisItem.Title
                  Width: =60
                  X: =16
                  Y: =8
            - lbl_AgNazev:
