            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =15
            Text: ="Procesní mapa MPSV"
            VerticalAlign: =VerticalAlign.Middle
            Width: =240
            X: =40
            Y: =0
      - lbl_ZalozkaPrehledD:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =13
            Text: ="Přehled"
            VerticalAlign: =VerticalAlign.Middle
            Width: =120
            X: =300
            Y: =0
      - rec_ZalozkaPodtrzeniD:
