      # Po smazání se colStrom přestaví celá: příznak osiřelosti se mění
      # i řádkům, kterých se mazání přímo netýká, a přepisovat je jeden po
      # druhém by bylo křehčí než nechat OnVisible přepočítat všechno.
      - btn_ModalSmazatD:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =stylNebezpeci
            FocusedBorderColor: =stylNebezpeci
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =stylNebezpeci
            OnSelect: |-
              =IfError(
                  If(
                      varSmazatD.uroven = 1,
                      Remove(Agendy, LookUp(Agendy, Title = varSmazatD.kod));
                      RemoveIf(colAgendy, Title = varSmazatD.kod),
                      varSmazatD.uroven = 2,
                      Remove(Procesy, LookUp(Procesy, Title = varSmazatD.kod));
                      RemoveIf(colProcesy, Title = varSmazatD.kod),
                      varSmazatD.uroven = 3,
                      Remove('Dílčí procesy', LookUp('Dílčí procesy', Title = varSmazatD.kod));
                      RemoveIf(colDilci, Title = varSmazatD.kod);
                      RemoveIf(
                          'Vazba aktivita–dílčí proces',
                          dilci_proces_kod = varSmazatD.kod
                      ),
                      RemoveIf('Vazba aktivita–dílčí proces', aktivita_kod = varSmazatD.kod);
                      Remove(Aktivity, LookUp(Aktivity, Title = varSmazatD.kod))
                  );
                  Notify("Smazáno: " & varSmazatD.kod & ".", NotificationType.Success, varNotifyMs);
                  Set(varSmazatD, Blank());
                  Set(varAktStale, true);
                  Navigate(scr_Dashboard, ScreenTransition.None),
                  Notify("Smazání selhalo: " & FirstError.Message, NotificationType.Error, varNotifyChybaMs);
                  Set(varSmazatD, Blank())
              )
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylNebezpeci
            Size: =11
            Text: ="Smazat"
            Tooltip: |-
              =If(
                  varSmazatD.uroven = 4,
                  "Nevratné. Smaže aktivitu i všechna její zařazení do dílčích procesů.",
                  "Nevratné. Smaže jen tuto položku číselníku; podřízené záznamy zůstanou a stanou se z nich osiřelé položky."
              )
            Visible: =!IsBlank(varSmazatD)
            Width: =160
            X: =Parent.Width / 2 + 128
            Y: =Parent.Height / 2 + 108
