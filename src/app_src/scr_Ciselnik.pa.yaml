# Obrazovka 4 — číselník: agendy, procesy, dílčí procesy (F6/D + F6/E).
#
# DVA PANELY. Vlevo seznam položek zvolené úrovně s hledáním, přepínačem
# úklidu a košem; vpravo formulář, který tutéž položku zakládá nebo upravuje.
# Segmentová tlačítka nahoře přepínají obojí naráz.
#
# JEDNA obrazovka pro všechny tři úrovně, ne tři samostatné: formulář se liší
# jen počtem nadřazených polí (agenda žádné, proces jedno, dílčí proces dvě)
# a tři skoro shodné obrazovky by znamenaly trojí údržbu téhož vzorce pro
# přidělení kódu. Úroveň drží varUrovenTyp ∈ agenda / proces / dilci.
#
# colCiselnik je PLOCHÁ kolekce všech tří úrovní v jedné tabulce — stejný
# vzor jako colStrom na přehledu. Bez ní by galerie musela být trojí: Switch
# nad colAgendy / colProcesy / colDilci neprojde typovou kontrolou, protože
# každá z nich má jiné sloupce. Kolekce se celá přepočítá při každém vstupu
# na obrazovku (303 řádků, zanedbatelné) a mutace ji dál udržují na místě,
# aby se seznam po založení nebo smazání nemusel načítat znovu.
#
# ÚKLID (sloupec uklid) má na každé úrovni jiný smysl a je to schválně:
#   proces, dílčí proces — SIROTEK, tedy chybí nadřazená položka. Vzniká
#     smazáním nadřazené položky a je to smetí, které jde smazat bez následků.
#   agenda — nemá nadřazenou úroveň, takže místo toho PRÁZDNÁ VĚTEV, tedy
#     agenda, pod kterou není žádný proces.
# Kdyby se ty dva významy prohodily, uklízecí tlačítko by nabízelo mazání
# živých větví — proto to říká i popisek chipu a text potvrzovacího dialogu.
#
# KOLIZE KÓDŮ: LookUp před Patch není atomický, takže dva správci zakládající
# tutéž úroveň ve stejnou vteřinu můžou dostat týž kód. Vyhodnoceno jako
# přijatelné (PLAN.md, F6/D): číselník se mění jednotky případů za měsíc
# a stejný optimistický zámek má i zakládání aktivit. Kontrola aspoň promění
# tichou duplicitu v hlášku.
#
# NÁHLED KÓDU se počítá nad kolekcemi, aby se při každém překreslení nechodilo
# na SharePoint. Uložení si kód přepočítá znovu, ale nad ZDROJEM — kolekce
# může být stará o celou session.
#
# DVA REŽIMY formuláře drží varCiselnikNova: zakládání (true) a úprava
# existující položky (false, varCiselnikKod nese její kód). Při úpravě je
# zamčená úroveň i nadřazený prvek: obojí je zapečené v kódu a kód se nikdy
# nemění, takže přesun pod jiného rodiče není přejmenování, ale nová položka.
# Mění se jen název a vlastník.
Screens:
  scr_Ciselnik:
    Properties:
      Fill: =stylPlocha
      LoadingSpinnerColor: =stylAkce
      OnVisible: |-
        =Set(varChybaC, "");
        Set(varSmazatC, Blank());
        If(
            IsEmpty(colAkt),
            ClearCollect(
                colAkt,
                ShowColumns(Aktivity, Title, nazev_kratky, dilci_proces_kod, vykonava, stav)
            )
        );
        ClearCollect(
            colCiselnik,
            ForAll(
                colAgendy As a,
                {
                    kod: a.Title,
                    nazev: a.nazev,
                    vlastnik: a.vlastnik,
                    uroven: "agenda",
                    rodic: "",
                    uklid: CountRows(Filter(colProcesy, agenda_kod = a.Title)) = 0
                }
            )
        );
        Collect(
            colCiselnik,
            ForAll(
                colProcesy As p,
                {
                    kod: p.Title,
                    nazev: p.nazev,
                    vlastnik: p.vlastnik,
                    uroven: "proces",
                    rodic: p.agenda_kod,
                    uklid: IsBlank(p.agenda_kod) || IsBlank(LookUp(colAgendy, Title = p.agenda_kod))
                }
            )
        );
        Collect(
            colCiselnik,
            ForAll(
                colDilci As d,
                {
                    kod: d.Title,
                    nazev: d.nazev,
                    vlastnik: d.vlastnik,
                    uroven: "dilci",
                    rodic: d.proces_kod,
                    uklid: IsBlank(d.proces_kod) || IsBlank(LookUp(colProcesy, Title = d.proces_kod))
                }
            )
        );
        Reset(drp_AgendaC);
        Reset(drp_ProcesC);
        Reset(txt_NazevC);
        Reset(drp_VlastnikC)
    Children:
      # ---------- hlavička ----------
      - rec_HlavickaC:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPrimarni
            Height: =72
            Width: =Parent.Width
            X: =0
            Y: =0
      - ico_ZpetC:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =56
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.18)
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate(scr_Dashboard, ScreenTransition.UnCover)
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            PressedFill: =RGBA(255, 255, 255, 0.28)
            Tooltip: '="Zpět na přehled. Rozdělaný formulář se zahodí; co je uložené, zůstane."'
            Width: =56
            X: =16
            Y: =8
      - lbl_NadpisC:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            Size: =16 + varFs
            Text: |-
              ="Číselník — " &
              Switch(varUrovenTyp, "agenda", "agendy", "proces", "procesy", "dílčí procesy")
            VerticalAlign: =VerticalAlign.Middle
            Width: =740
            X: =88
            Y: =16
      - btn_PismoC1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.35)
            BorderThickness: =1
            Color: =If(varFs = 0, RGBA(255, 255, 255, 1), RGBA(214, 220, 234, 1))
            Fill: =If(varFs = 0, RGBA(255, 255, 255, 0.22), RGBA(0, 0, 0, 0))
            FocusedBorderColor: =RGBA(255, 255, 255, 1)
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.14)
            OnSelect: =Set(varFs, 0)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 0.30)
            Size: =10
            Text: ="A"
            Tooltip: '="Nejmenší text, vejde se toho nejvíc."'
            Width: =34
            X: =Parent.Width - 502
            Y: =20
      - btn_PismoC2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.35)
            BorderThickness: =1
            Color: =If(varFs = 2, RGBA(255, 255, 255, 1), RGBA(214, 220, 234, 1))
            Fill: =If(varFs = 2, RGBA(255, 255, 255, 0.22), RGBA(0, 0, 0, 0))
            FocusedBorderColor: =RGBA(255, 255, 255, 1)
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.14)
            OnSelect: =Set(varFs, 2)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 0.30)
            Size: =13
            Text: ="A"
            Tooltip: '="Střední text v popiscích i v polích. Výchozí nastavení."'
            Width: =38
            X: =Parent.Width - 464
            Y: =20
      - btn_PismoC3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.35)
            BorderThickness: =1
            Color: =If(varFs = 4, RGBA(255, 255, 255, 1), RGBA(214, 220, 234, 1))
            Fill: =If(varFs = 4, RGBA(255, 255, 255, 0.22), RGBA(0, 0, 0, 0))
            FocusedBorderColor: =RGBA(255, 255, 255, 1)
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.14)
            OnSelect: =Set(varFs, 4)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 0.30)
            Size: =16
            Text: ="A"
            Tooltip: '="Největší text. Nejdelší hodnoty se můžou v poli oříznout."'
            Width: =42
            X: =Parent.Width - 422
            Y: =20
      # ---------- volba úrovně (platí pro seznam i formulář) ----------
      # Přepnutí vždycky vrátí formulář do režimu zakládání: jinak by u nově
      # zakládané agendy zůstala viset agenda vybraná pro proces a náhled kódu
      # by lhal.
      - btn_UrovenAgendaC:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =If(varUrovenTyp = "agenda", RGBA(255, 255, 255, 1), stylAkce)
            Fill: =If(varUrovenTyp = "agenda", stylAkce, stylKarta)
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =If(varUrovenTyp = "agenda", RGBA(255, 255, 255, 1), stylAkce)
            HoverFill: =If(varUrovenTyp = "agenda", stylAkceHover, stylRadekHover)
            OnSelect: |-
              =Set(varUrovenTyp, "agenda");
              Set(varCiselnikNova, true);
              Set(varCiselnikKod, "");
              Set(varChybaC, "");
              Reset(drp_AgendaC);
              Reset(drp_ProcesC);
              Reset(txt_NazevC);
              Reset(drp_VlastnikC)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylAkceStisk
            Size: =12 + varFs
            Text: ="Agendy"
            Tooltip: '="První úroveň hierarchie: oblast činnosti daná zákonem nebo vnitřním předpisem. Nadřazený prvek nemá, vlastníkem je sekce. Kód má dvě číslice."'
            Width: =200
            X: =40
            Y: =88
      - btn_UrovenProcesC:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =If(varUrovenTyp = "proces", RGBA(255, 255, 255, 1), stylAkce)
            Fill: =If(varUrovenTyp = "proces", stylAkce, stylKarta)
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =If(varUrovenTyp = "proces", RGBA(255, 255, 255, 1), stylAkce)
            HoverFill: =If(varUrovenTyp = "proces", stylAkceHover, stylRadekHover)
            OnSelect: |-
              =Set(varUrovenTyp, "proces");
              Set(varCiselnikNova, true);
              Set(varCiselnikKod, "");
              Set(varChybaC, "");
              Reset(drp_AgendaC);
              Reset(drp_ProcesC);
              Reset(txt_NazevC);
              Reset(drp_VlastnikC)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylAkceStisk
            Size: =12 + varFs
            Text: ="Procesy"
            Tooltip: '="Druhá úroveň: tok činností s definovaným vstupem a výstupem. Patří vždy pod jednu agendu, vlastníkem je odbor. Kód má tvar AA-BB."'
            Width: =200
            X: =248
            Y: =88
      - btn_UrovenDilciC:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =If(varUrovenTyp = "dilci", RGBA(255, 255, 255, 1), stylAkce)
            Fill: =If(varUrovenTyp = "dilci", stylAkce, stylKarta)
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =If(varUrovenTyp = "dilci", RGBA(255, 255, 255, 1), stylAkce)
            HoverFill: =If(varUrovenTyp = "dilci", stylAkceHover, stylRadekHover)
            OnSelect: |-
              =Set(varUrovenTyp, "dilci");
              Set(varCiselnikNova, true);
              Set(varCiselnikKod, "");
              Set(varChybaC, "");
              Reset(drp_AgendaC);
              Reset(drp_ProcesC);
              Reset(txt_NazevC);
              Reset(drp_VlastnikC)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylAkceStisk
            Size: =12 + varFs
            Text: ="Dílčí procesy"
            Tooltip: '="Třetí úroveň: vymezený úsek procesu. Patří vždy pod jeden proces, vlastníkem je odbor. Kód má tvar AA-BB-CCC a teprve pod něj se zařazují aktivity."'
            Width: =204
            X: =456
            Y: =88
      # ---------- levý panel: seznam ----------
      - txt_HledatC:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =36
            HintText: ="Hledat v kódu nebo názvu"
            HoverBorderColor: =stylAkce
            Size: =12 + varFs
            Tooltip: '="Hledá kdekoli uvnitř kódu i názvu, na velikosti písmen nezáleží. Pracuje nad načteným číselníkem, ne nad SharePointem, takže je výsledek úplný bez ohledu na velikost rejstříku."'
            Width: =400
            X: =40
            Y: =140
      - btn_FiltrVseC:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =If(varUklidC, stylAkce, RGBA(255, 255, 255, 1))
            Fill: =If(varUklidC, stylKarta, stylAkce)
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =If(varUklidC, stylAkce, RGBA(255, 255, 255, 1))
            HoverFill: =If(varUklidC, stylRadekHover, stylAkceHover)
            OnSelect: =Set(varUklidC, false)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylAkceStisk
            Size: =11
            Text: ="vše"
            Tooltip: '="Celý číselník zvolené úrovně bez filtru."'
            Width: =100
            X: =452
            Y: =140
      # Chip má na úrovni agendy jiný význam než níž — agenda nadřazenou
      # položku nemá, takže osiřet nemůže; zato může být prázdná.
      - btn_FiltrUklidC:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =If(varUklidC, stylPozor, stylOkraj)
            BorderThickness: =1
            Color: =If(varUklidC, RGBA(255, 255, 255, 1), stylPozor)
            Fill: =If(varUklidC, stylPozor, stylKarta)
            FocusedBorderColor: =stylPozor
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =stylPozor
            OnSelect: =Set(varUklidC, true)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylPozor
            Size: =11
            Text: |-
              =If(varUrovenTyp = "agenda", "bez procesů", "osiřelé")
            Tooltip: |-
              =If(
                  varUrovenTyp = "agenda",
                  "Agendy, pod kterými není žádný proces. Agenda je nejvyšší úroveň, takže osiřet nemůže - prázdná ale ano.",
                  "Položky, jejichž nadřazená úroveň v číselníku není: " &
                  If(varUrovenTyp = "proces", "proces bez agendy", "dílčí proces bez procesu") &
                  ". Vznikají smazáním nadřazené položky a jdou smazat bez následků - v mapě se stejně nezobrazí, protože se nemají kam zařadit."
              )
            Width: =100
            X: =560
            Y: =140
      - lbl_PocetC:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =22
            Size: =10 + varFs
            Text: |-
              =CountRows(gal_CiselnikC.AllItems) & " z " &
              CountRows(Filter(colCiselnik, uroven = varUrovenTyp)) & " položek" &
              If(
                  varUklidC,
                  If(varUrovenTyp = "agenda", " · jen prázdné", " · jen osiřelé"),
                  ""
              ) &
              If(IsBlank(txt_HledatC.Text), "", " · hledání „" & txt_HledatC.Text & "“")
            VerticalAlign: =VerticalAlign.Middle
            Width: =620
            X: =40
            Y: =184
      - rec_KartaSeznamC:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylKarta
            Height: =496
            Width: =620
            X: =40
            Y: =212
      - lbl_h_KodC:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =10 + varFs
            Text: ="KÓD"
            VerticalAlign: =VerticalAlign.Middle
            Width: =140
            X: =56
            Y: =218
      - lbl_h_NazevC:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =10 + varFs
            Text: ="NÁZEV"
            VerticalAlign: =VerticalAlign.Middle
            Width: =258
            X: =212
            Y: =218
      - lbl_h_VlastnikC:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =10 + varFs
            Text: ="VLASTNÍK"
            Tooltip: '="Kód útvaru z číselníku Útvary. U agendy sekce, u procesu a dílčího procesu odbor. Vlastník schválně není součástí identifikačního kódu - při organizační změně se mění vlastník, ne kód."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =70
            X: =470
            Y: =218
      - lbl_PrazdnoC:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =48
            Size: =11 + varFs
            Text: |-
              =If(
                  varUklidC,
                  If(
                      varUrovenTyp = "agenda",
                      "Žádná prázdná agenda — pod každou je aspoň jeden proces.",
                      "Žádné osiřelé položky — každá má svou nadřazenou úroveň. To je stav, ve kterém má číselník být."
                  ),
                  "Tady zatím nic není. Novou položku založíš formulářem vpravo."
              )
            Visible: =CountRows(gal_CiselnikC.AllItems) = 0
            Width: =588
            X: =56
            Y: =260
      - gal_CiselnikC:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextOneImageVariant_ver5.0
          Properties:
            Height: =462
            Items: |-
              =Sort(
                  Filter(
                      colCiselnik,
                      uroven = varUrovenTyp,
                      !varUklidC || uklid,
                      IsBlank(txt_HledatC.Text)
                      || txt_HledatC.Text in kod
                      || txt_HledatC.Text in nazev
                  ),
                  kod,
                  SortOrder.Ascending
              )
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =44 + varFs * 4
            Width: =620
            X: =40
            Y: =246
          Children:
            - rec_RadekC:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(ThisItem.kod = varCiselnikKod, stylRadekVybrany, stylKarta)
                  Height: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - lbl_RadekKodC:
                Control: Label@2.5.1
                Properties:
                  Color: =stylPrimarni
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight - 1
                  Size: =10 + varFs
                  Text: =ThisItem.kod
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =140
                  X: =16
                  Y: =0
            - lbl_RadekNazevC:
                Control: Label@2.5.1
                Properties:
                  Color: =stylText
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =11 + varFs
                  Text: =ThisItem.nazev
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.TemplateWidth - 362
                  X: =172
                  Y: =0
            - lbl_RadekVlastnikC:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =10 + varFs
                  Text: =ThisItem.vlastnik
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =70
                  X: =Parent.TemplateWidth - 190
                  Y: =0
            # Štítek je jediné místo, kde je na řádku vidět, proč ho chip
            # úklidu vybral — bez něj by se ve výpisu „vše" nedalo poznat,
            # která položka je smetí.
            - lbl_RadekUklidC:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =stylPozor
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =10 + varFs
                  Text: |-
                    =If(
                        !ThisItem.uklid,
                        "",
                        If(ThisItem.uroven = "agenda", "prázdná", "osiřelý")
                    )
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =76
                  X: =Parent.TemplateWidth - 112
                  Y: =0
            - rec_LinkaC:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =stylOkraj
                  Height: =1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =Parent.TemplateHeight - 1
            # Průhledná vrstva přes celý řádek nese klik i podbarvení při
            # najetí a musí být POSLEDNÍ, aby ležela nad popisky — jinak by
            # řádek reagoval jen na mezerách mezi nimi (stejný vzor jako
            # lbl_RadekPrekryv v seznamu a lbl_StromPrekryv na přehledu).
            - lbl_RadekPrekryvC:
                Control: Label@2.5.1
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight - 1
                  HoverFill: =RGBA(0, 90, 181, 0.14)
                  OnSelect: |-
                    =Set(varUrovenTyp, ThisItem.uroven);
                    Set(varCiselnikNova, false);
                    Set(varCiselnikKod, ThisItem.kod);
                    Set(varChybaC, "");
                    Reset(drp_AgendaC);
                    Reset(drp_ProcesC);
                    Reset(txt_NazevC);
                    Reset(drp_VlastnikC)
                  PressedFill: =RGBA(0, 90, 181, 0.22)
                  Text: =""
                  Tooltip: |-
                    =ThisItem.kod & " · " & ThisItem.nazev & Char(10) &
                    If(
                        IsBlank(ThisItem.vlastnik),
                        "Vlastník není vyplněný.",
                        "Vlastník: " & ThisItem.vlastnik &
                        If(
                            IsBlank(LookUp(colUtvary, Title = ThisItem.vlastnik)),
                            "",
                            " · " & LookUp(colUtvary, Title = ThisItem.vlastnik, nazev)
                        )
                    ) & Char(10) &
                    If(
                        !ThisItem.uklid,
                        "",
                        If(
                            ThisItem.uroven = "agenda",
                            "Prázdná agenda — není pod ní žádný proces." & Char(10),
                            "Osiřelá položka — nadřazená úroveň v číselníku není." & Char(10)
                        )
                    ) &
                    "Klikni pro načtení do formuláře vpravo."
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            # Koš je až za překryvem, jinak by ho překryv zakryl a klik spolkl.
            # Nemaže hned — jen si zapamatuje, čeho se dotaz týká; smaže se až
            # po potvrzení v dialogu, protože řádek galerie se dá trefit omylem.
            - ico_SmazatC:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =stylTextSlaby
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =32
                  HoverColor: =stylNebezpeci
                  HoverFill: =stylRadekVybrany
                  Icon: =Icon.Trash
                  OnSelect: =Set(varSmazatC, ThisItem)
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  PressedColor: =stylNebezpeci
                  Tooltip: |-
                    ="Smaže " & ThisItem.kod &
                    " z číselníku. Zeptá se na potvrzení a řekne, kolik podřízených položek tím osiří."
                  Width: =32
                  X: =Parent.TemplateWidth - 48
                  Y: =(Parent.TemplateHeight - 1) / 2 - 16
