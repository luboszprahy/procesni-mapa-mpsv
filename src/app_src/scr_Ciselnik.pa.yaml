            Size: =10 + varFs
            Text: |-
              =If(varCiselnikNova, "Kód, který se přidělí", "Kód — nemění se")
            Width: =280
            X: =724
            Y: =520
      # Náhled počítá nad kolekcemi z App.OnStart — dotaz na SharePoint při
      # každém překreslení by obrazovku zbytečně brzdil. Skutečný kód se při
      # uložení počítá znovu nad zdrojem, takže náhled je odhad, ne slib;
      # říká to i popisek pod tlačítkem.
      - lbl_NahledKodC:
          Control: Label@2.5.1
          Properties:
            Color: =stylAkce
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =36
            Size: =16 + varFs
            Text: |-
              =If(
                  !varCiselnikNova,
                  varCiselnikKod,
                  Switch(
                      varUrovenTyp,
                      "agenda",
                      Right("0" & (Value(First(Sort(colAgendy, Title, SortOrder.Descending)).Title) + 1), 2),
                      "proces",
                      If(
                          IsBlank(drp_AgendaC.Selected.Value),
                          "—",
                          Left(drp_AgendaC.Selected.Value, 2) & "-" &
                          Right(
                              "0" & (
                                  Value(
                                      Right(
                                          First(
                                              Sort(
                                                  Filter(colProcesy, agenda_kod = Left(drp_AgendaC.Selected.Value, 2)),
                                                  Title,
                                                  SortOrder.Descending
                                              )
                                          ).Title,
                                          2
                                      )
                                  ) + 1
                              ),
                              2
                          )
                      ),
                      If(
                          IsBlank(drp_ProcesC.Selected.Value),
                          "—",
                          Left(drp_ProcesC.Selected.Value, 5) & "-" &
                          Right(
                              "00" & (
                                  Value(
                                      Right(
                                          First(
                                              Sort(
                                                  Filter(colDilci, proces_kod = Left(drp_ProcesC.Selected.Value, 5)),
                                                  Title,
                                                  SortOrder.Descending
                                              )
                                          ).Title,
                                          3
                                      )
                                  ) + 1
                              ),
                              3
                          )
                      )
                  )
              )
            Tooltip: '="Kód se skládá z nadřazeného kódu a prvního volného čísla v něm. Přiděluje se stejným způsobem jako u aktivit a jednou přidělený se už nemění, ani při přejmenování položky. Vlastník součástí kódu není — eviduje se zvlášť, protože při organizační změně se mění vlastník, ne kód."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =280
            X: =724
            Y: =542
      - lbl_ChybaC:
          Control: Label@2.5.1
          Properties:
            Color: =stylNebezpeci
            Font: =Font.'Open Sans'
            Height: =58
            Size: =11 + varFs
            Text: =varChybaC
            VerticalAlign: =VerticalAlign.Middle
            Width: =280
            X: =1016
            Y: =520
      - btn_UlozitC:
          Control: Classic/Button@2.2.0
          Properties:
            Fill: =stylAkce
            FocusedBorderColor: =stylPrimarni
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =44
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =stylAkceHover
            OnSelect: |-
              =Set(varChybaC, "");
              If(
                  varCiselnikNova && varUrovenTyp <> "agenda" && IsBlank(drp_AgendaC.Selected.Value),
                  Set(varChybaC, "Vyber nadřazenou agendu.")
              );
              If(
                  varCiselnikNova && varUrovenTyp = "dilci" && IsBlank(drp_ProcesC.Selected.Value),
                  Set(varChybaC, "Vyber nadřazený proces.")
              );
              If(IsBlank(txt_NazevC.Text), Set(varChybaC, "Vyplň název."));
              If(
                  !IsBlank(varChybaC),
                  Notify(varChybaC, NotificationType.Warning),
                  Set(
                      varVlastnikC,
                      If(
                          !IsBlank(drp_VlastnikC.Selected.Value),
                          Left(drp_VlastnikC.Selected.Value, Find(" ·", drp_VlastnikC.Selected.Value & " ·") - 1),
                          varCiselnikNova,
                          "",
                          Switch(
                              varUrovenTyp,
                              "agenda", LookUp(colAgendy, Title = varCiselnikKod, vlastnik),
                              "proces", LookUp(colProcesy, Title = varCiselnikKod, vlastnik),
                              LookUp(colDilci, Title = varCiselnikKod, vlastnik)
                          )
                      )
                  );
                  If(
                      varCiselnikNova,
                      Set(
                          varNovyKodC,
                          Switch(
                              varUrovenTyp,
                              "agenda",
                              Right("0" & (Value(First(Sort(Agendy, Title, SortOrder.Descending)).Title) + 1), 2),
                              "proces",
                              Left(drp_AgendaC.Selected.Value, 2) & "-" &
                              Right(
                                  "0" & (
                                      Value(
                                          Right(
                                              First(
                                                  Sort(
                                                      Filter(Procesy, StartsWith(Title, Left(drp_AgendaC.Selected.Value, 2) & "-")),
                                                      Title,
                                                      SortOrder.Descending
                                                  )
                                              ).Title,
                                              2
                                          )
                                      ) + 1
                                  ),
                                  2
                              ),
                              Left(drp_ProcesC.Selected.Value, 5) & "-" &
                              Right(
                                  "00" & (
                                      Value(
                                          Right(
                                              First(
                                                  Sort(
                                                      Filter('Dílčí procesy', StartsWith(Title, Left(drp_ProcesC.Selected.Value, 5) & "-")),
                                                      Title,
                                                      SortOrder.Descending
                                                  )
                                              ).Title,
                                              3
                                          )
                                      ) + 1
                                  ),
                                  3
                              )
                          )
                      );
                      Set(
                          varKolizeC,
                          Switch(
                              varUrovenTyp,
                              "agenda", !IsBlank(LookUp(Agendy, Title = varNovyKodC)),
                              "proces", !IsBlank(LookUp(Procesy, Title = varNovyKodC)),
                              !IsBlank(LookUp('Dílčí procesy', Title = varNovyKodC))
                          )
                      );
                      If(
                          varKolizeC,
                          Notify("Kód " & varNovyKodC & " mezitím někdo zabral, zkus uložit znovu.", NotificationType.Warning),
                          IfError(
                              If(
                                  varUrovenTyp = "agenda",
                                  Patch(
                                      Agendy,
                                      Defaults(Agendy),
                                      {
                                          Title: varNovyKodC,
                                          nazev: txt_NazevC.Text,
                                          vlastnik: varVlastnikC,
                                          stav_mapovani: { Value: "nezmapováno" },
                                          zdroj: { Value: "karta" }
                                      }
                                  );
                                  Collect(
                                      colAgendy,
                                      { Title: varNovyKodC, nazev: txt_NazevC.Text, vlastnik: varVlastnikC }
                                  );
                                  Collect(
                                      colCiselnik,
                                      {
                                          kod: varNovyKodC,
                                          nazev: txt_NazevC.Text,
                                          vlastnik: varVlastnikC,
                                          uroven: "agenda",
                                          rodic: "",
                                          uklid: true
                                      }
                                  ),
                                  varUrovenTyp = "proces",
                                  Patch(
                                      Procesy,
                                      Defaults(Procesy),
                                      {
                                          Title: varNovyKodC,
                                          nazev: txt_NazevC.Text,
                                          agenda_kod: Left(drp_AgendaC.Selected.Value, 2),
                                          vlastnik: varVlastnikC,
                                          stav_mapovani: { Value: "nezmapováno" },
                                          zdroj: { Value: "karta" }
                                      }
                                  );
                                  Collect(
                                      colProcesy,
                                      {
                                          Title: varNovyKodC,
                                          nazev: txt_NazevC.Text,
                                          agenda_kod: Left(drp_AgendaC.Selected.Value, 2),
                                          vlastnik: varVlastnikC
                                      }
                                  );
                                  Collect(
                                      colCiselnik,
                                      {
                                          kod: varNovyKodC,
                                          nazev: txt_NazevC.Text,
                                          vlastnik: varVlastnikC,
                                          uroven: "proces",
                                          rodic: Left(drp_AgendaC.Selected.Value, 2),
                                          uklid: false
                                      }
                                  );
                                  UpdateIf(
                                      colCiselnik,
                                      uroven = "agenda" && kod = Left(drp_AgendaC.Selected.Value, 2),
                                      { uklid: false }
                                  ),
                                  Patch(
                                      'Dílčí procesy',
                                      Defaults('Dílčí procesy'),
                                      {
                                          Title: varNovyKodC,
                                          nazev: txt_NazevC.Text,
                                          proces_kod: Left(drp_ProcesC.Selected.Value, 5),
                                          vlastnik: varVlastnikC,
                                          stav_rejstrik: { Value: "využitý" },
                                          stav_mapovani: { Value: "nezmapováno" },
                                          zdroj: { Value: "karta" }
                                      }
                                  );
                                  Collect(
                                      colDilci,
                                      {
                                          Title: varNovyKodC,
                                          nazev: txt_NazevC.Text,
                                          proces_kod: Left(drp_ProcesC.Selected.Value, 5),
                                          vlastnik: varVlastnikC
                                      }
                                  );
                                  Collect(
                                      colCiselnik,
                                      {
                                          kod: varNovyKodC,
                                          nazev: txt_NazevC.Text,
                                          vlastnik: varVlastnikC,
                                          uroven: "dilci",
                                          rodic: Left(drp_ProcesC.Selected.Value, 5),
                                          uklid: false
                                      }
                                  )
                              );
                              Set(varAktStale, true);
                              Notify("Založeno jako " & varNovyKodC & ".", NotificationType.Success);
                              Reset(txt_NazevC);
                              Reset(drp_VlastnikC),
                              Notify("Uložení selhalo: " & FirstError.Message, NotificationType.Error)
                          )
                      ),
                      IfError(
                          If(
                              varUrovenTyp = "agenda",
                              Patch(
                                  Agendy,
                                  LookUp(Agendy, Title = varCiselnikKod),
                                  { nazev: txt_NazevC.Text, vlastnik: varVlastnikC }
                              );
                              UpdateIf(
                                  colAgendy,
                                  Title = varCiselnikKod,
                                  { nazev: txt_NazevC.Text, vlastnik: varVlastnikC }
                              ),
                              varUrovenTyp = "proces",
                              Patch(
                                  Procesy,
                                  LookUp(Procesy, Title = varCiselnikKod),
                                  { nazev: txt_NazevC.Text, vlastnik: varVlastnikC }
                              );
                              UpdateIf(
                                  colProcesy,
                                  Title = varCiselnikKod,
                                  { nazev: txt_NazevC.Text, vlastnik: varVlastnikC }
                              ),
                              Patch(
                                  'Dílčí procesy',
                                  LookUp('Dílčí procesy', Title = varCiselnikKod),
                                  { nazev: txt_NazevC.Text, vlastnik: varVlastnikC }
                              );
                              UpdateIf(
                                  colDilci,
                                  Title = varCiselnikKod,
                                  { nazev: txt_NazevC.Text, vlastnik: varVlastnikC }
                              )
                          );
                          UpdateIf(
                              colCiselnik,
                              kod = varCiselnikKod,
                              { nazev: txt_NazevC.Text, vlastnik: varVlastnikC }
                          );
                          Set(varAktStale, true);
                          Notify("Uloženo — " & varCiselnikKod & ".", NotificationType.Success),
                          Notify("Uložení selhalo: " & FirstError.Message, NotificationType.Error)
                      )
                  )
              )
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylAkceStisk
            Size: =14 + varFs
            Text: |-
              =If(varCiselnikNova, "Založit", "Uložit změny")
            Tooltip: |-
              =If(
                  varCiselnikNova,
                  "Založí položku v příslušném SharePoint seznamu a přidělí jí kód. Zapíše se stav mapování nezmapováno a zdroj karta; u dílčího procesu navíc stav v rejstříku využitý, protože ho právě zakládá správce. Když mezitím stejný kód zabere někdo jiný, uložení se neprovede a dostaneš hlášku - stačí uložit znovu.",
                  "Uloží změnu názvu a vlastníka. Kód, úroveň ani zařazení se nemění - vazby v rejstříku i v mapě na kódu stojí. Když necháš vlastníka nevyplněného, zůstane ten původní; je to pojistka pro položky, které mají vlastníků víc a v nabídce jednoho útvaru se proto nenajdou."
              ) & " Nová hodnota se rovnou objeví v seznamu vlevo i v nabídkách a po návratu na přehled ve stromu - appka se kvůli tomu nemusí restartovat."
            Width: =200
            X: =724
            Y: =596
      - btn_NovaC:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =stylAkce
            DisplayMode: |-
              =If(varCiselnikNova, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(255, 255, 255, 1)
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =44
            HoverColor: =stylAkce
            HoverFill: =stylRadekHover
            OnSelect: |-
              =Set(varCiselnikNova, true);
              Set(varCiselnikKod, "");
              Set(varChybaC, "");
              Reset(drp_AgendaC);
              Reset(drp_ProcesC);
              Reset(txt_NazevC);
              Reset(drp_VlastnikC)
            PressedFill: =stylRadekVybrany
            Size: =13 + varFs
            Text: ="Nová položka"
            Tooltip: '="Vyprázdní formulář a přepne ho ze zobrazení vybrané položky zpět na zakládání. Když už formulář zakládá, je tlačítko neaktivní - je z něj tak vidět, v jakém režimu formulář je."'
            Width: =200
            X: =944
            Y: =596
      - lbl_PoznamkaC:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =48
            Size: =10 + varFs
            Text: |-
              =If(
                  varCiselnikNova,
                  "Kód je náhled z načtených dat. Skutečný kód se přidělí až při uložení, podle stavu v SharePointu.",
                  "Mění se jen název a vlastník. Kód a zařazení jsou zamčené — jednou přidělený kód se nemění."
              )
            Width: =572
            X: =724
            Y: =648
      # ---------- potvrzení smazání ----------
      # Power Apps nemá nativní confirm(), takže dialog je vrstva nad
      # obrazovkou. Stín zachytí kliknutí mimo kartu, aby pod dialogem nešlo
      # omylem pracovat. Souřadnice jsou vzorce (Parent.Width/2), takže
      # kontrola překryvu je přeskočí — u překryvné vrstvy je to správně.
      - rec_ModalStinC:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            OnSelect: =Set(varSmazatC, Blank())
            Visible: =!IsBlank(varSmazatC)
            Width: =Parent.Width
            X: =0
            Y: =0
      - rec_ModalKartaC:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylKarta
            Height: =360
            Visible: =!IsBlank(varSmazatC)
            Width: =640
            X: =Parent.Width / 2 - 320
            Y: =Parent.Height / 2 - 180
      - rec_ModalPruhC:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylNebezpeci
            Height: =4
            Visible: =!IsBlank(varSmazatC)
            Width: =640
            X: =Parent.Width / 2 - 320
            Y: =Parent.Height / 2 - 180
      - lbl_ModalNadpisC:
          Control: Label@2.5.1
          Properties:
            Color: =stylText
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =15
            Text: |-
              =Switch(
                  varSmazatC.uroven,
                  "agenda", "Smazat agendu?",
                  "proces", "Smazat proces?",
                  "Smazat dílčí proces?"
              )
            Visible: =!IsBlank(varSmazatC)
            Width: =576
            X: =Parent.Width / 2 - 288
            Y: =Parent.Height / 2 - 148
      # Dialog musí říct, KOLIK podřízených položek tím osiří — bez toho je
      # smazání agendy se čtyřiceti procesy stejně nevinné jako smazání
      # prázdné, a to není pravda.
      - lbl_ModalTextC:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =200
            Size: =12
            Text: |-
              =varSmazatC.kod & " — " & varSmazatC.nazev & "

              " &
              Switch(
                  varSmazatC.uroven,
                  "agenda",
                  "Pod touto agendou je " & CountRows(Filter(colProcesy, agenda_kod = varSmazatC.kod)) &
                  " procesů. Smazáním agendy nezmizí — zůstanou bez nadřazené položky a v číselníku procesů je pak najdeš přepínačem „osiřelé“.",
                  "proces",
                  "Pod tímto procesem je " & CountRows(Filter(colDilci, proces_kod = varSmazatC.kod)) &
                  " dílčích procesů. Smazáním procesu nezmizí — zůstanou bez nadřazené položky a v číselníku dílčích procesů je pak najdeš přepínačem „osiřelé“.",
                  "Pod tímto dílčím procesem je " & CountRows(Filter(colAkt, dilci_proces_kod = varSmazatC.kod)) &
                  " aktivit. Smazáním dílčího procesu nezmizí — zůstanou bez nadřazené položky a v seznamu aktivit je pak najdeš přepínačem „osiřelé“."
              ) & "

              Maže se jen tato jedna položka číselníku. Vrátit to zpět nejde."
            Visible: =!IsBlank(varSmazatC)
            Width: =576
            X: =Parent.Width / 2 - 288
            Y: =Parent.Height / 2 - 112
      - btn_ModalZrusitC:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =stylText
            Fill: =stylKarta
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =40
            HoverFill: =stylRadekHover
            OnSelect: =Set(varSmazatC, Blank())
            PressedFill: =stylRadekVybrany
            Size: =13
            Text: ="Zrušit"
            Visible: =!IsBlank(varSmazatC)
            Width: =140
            X: =Parent.Width / 2 - 288
            Y: =Parent.Height / 2 + 108
      # Smazání nadřazené položky udělá z jejích potomků sirotky — a protože
      # colCiselnik se za běhu nepřepočítává celá, přepíše se jim příznak
      # rovnou tady. Bez toho by se v seznamu objevili až po opuštění
      # a novém otevření obrazovky.
      - btn_ModalSmazatC:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =stylNebezpeci
            FocusedBorderColor: =stylNebezpeci
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =40
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =stylNebezpeci
            OnSelect: |-
              =IfError(
                  If(
                      varSmazatC.uroven = "agenda",
                      Remove(Agendy, LookUp(Agendy, Title = varSmazatC.kod));
                      RemoveIf(colAgendy, Title = varSmazatC.kod);
                      UpdateIf(
                          colCiselnik,
                          uroven = "proces" && rodic = varSmazatC.kod,
                          { uklid: true }
                      ),
                      varSmazatC.uroven = "proces",
                      Remove(Procesy, LookUp(Procesy, Title = varSmazatC.kod));
                      RemoveIf(colProcesy, Title = varSmazatC.kod);
                      UpdateIf(
                          colCiselnik,
                          uroven = "dilci" && rodic = varSmazatC.kod,
                          { uklid: true }
                      );
                      UpdateIf(
                          colCiselnik,
                          uroven = "agenda" && kod = Left(varSmazatC.kod, 2),
                          { uklid: CountRows(Filter(colProcesy, agenda_kod = Left(varSmazatC.kod, 2))) = 0 }
                      ),
                      Remove('Dílčí procesy', LookUp('Dílčí procesy', Title = varSmazatC.kod));
                      RemoveIf(colDilci, Title = varSmazatC.kod)
                  );
                  RemoveIf(colCiselnik, kod = varSmazatC.kod);
                  Set(varAktStale, true);
                  If(
                      varCiselnikKod = varSmazatC.kod,
                      Set(varCiselnikNova, true);
                      Set(varCiselnikKod, "");
                      Reset(txt_NazevC);
                      Reset(drp_VlastnikC)
                  );
                  Notify("Smazáno: " & varSmazatC.kod & ".", NotificationType.Success);
                  Set(varSmazatC, Blank()),
                  Notify("Smazání selhalo: " & FirstError.Message, NotificationType.Error);
                  Set(varSmazatC, Blank())
              )
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylNebezpeci
            Size: =13
            Text: ="Smazat"
            Tooltip: '="Nevratné. Smaže jen tuto položku číselníku; podřízené záznamy zůstanou a stanou se z nich osiřelé položky, které se uklízejí ve své vlastní entitě."'
            Visible: =!IsBlank(varSmazatC)
            Width: =160
            X: =Parent.Width / 2 + 128
            Y: =Parent.Height / 2 + 108
