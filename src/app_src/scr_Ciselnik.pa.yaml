            Size: =13 + varFs
            Tooltip: '="Povinné. Název položky číselníku. Delší text SharePoint ořízne na 255 znaků, proto je pole na tuhle délku omezené. Název jde později přejmenovat, přidělený kód už ne — vazby v rejstříku i v mapě stojí na kódu."'
            Width: =572
            X: =724
            Y: =356
