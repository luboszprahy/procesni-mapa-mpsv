                  Text: =ThisItem.kod
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =140
                  X: =16
                  Y: =0
            - lbl_RadekNazevC:
                Control: Label@2.5.1
                Properties:
                  Color: =stylText
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =11 + varFs
                  PaddingTop: =4
                  Text: =ThisItem.nazev
                  VerticalAlign: |-
                    =If(varUrovenTyp = "aktivita", VerticalAlign.Top, VerticalAlign.Middle)
                  Width: =Parent.TemplateWidth - 362
                  X: =172
                  Y: =0
            - lbl_RadekVlastnikC:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =10 + varFs
                  Text: =ThisItem.vlastnik
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =70
                  X: =Parent.TemplateWidth - 190
                  Y: =0
            # Štítek je jediné místo, kde je na řádku vidět, proč ho chip
            # úklidu vybral — bez něj by se ve výpisu „vše" nedalo poznat,
            # která položka je smetí.
            - lbl_RadekUklidC:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =stylPozor
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =10 + varFs
                  Text: |-
                    =If(
                        !ThisItem.uklid,
                        "",
                        If(
                            ThisItem.uroven = "agenda",
                            "prázdná",
                            If(ThisItem.uroven = "aktivita", "osiřelá", "osiřelý")
                        )
                    )
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =76
                  X: =Parent.TemplateWidth - 112
                  Y: =0
