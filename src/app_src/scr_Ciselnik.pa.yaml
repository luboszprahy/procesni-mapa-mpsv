            Text: |-
              =If(varUrovenTyp = "agenda", "Vlastník agendy — sekce", "Vlastník — odbor") &
              If(varCiselnikNova, " (nepovinné)", " (prázdné = ponechat stávajícího)")
            Width: =572
            X: =724
            Y: =446
