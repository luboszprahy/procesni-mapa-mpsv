                  PressedColor: =stylNebezpeci
                  Tooltip: |-
                    ="Smaže " & ThisItem.kod &
                    " z číselníku. Zeptá se na potvrzení a řekne, kolik podřízených položek tím osiří."
                  Width: =32
                  X: =Parent.TemplateWidth - 48
                  Y: =(Parent.TemplateHeight - 1) / 2 - 16
