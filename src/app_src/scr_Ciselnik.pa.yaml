      - gal_CiselnikC:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextOneImageVariant_ver5.0
          Properties:
            Height: =If(varUrovenTyp = "aktivita", 442, 486)
            Items: |-
              =Sort(
                  Search(
                      Filter(
                          colCiselnik,
                          uroven = varUrovenTyp,
                          !varUklidC || uklid,
                          varUrovenTyp <> "aktivita" || IsBlank(varSekceKodC) || sekce = varSekceKodC,
                          varUrovenTyp <> "aktivita" || IsBlank(varUtvarKodC) || vlastnik = varUtvarKodC,
                          varUrovenTyp <> "aktivita"
                          || drp_StavC.Selected.Value = "(vše)"
                          || stav = drp_StavC.Selected.Value
                      ),
                      txt_HledatC.Text,
                      kod,
                      nazev
                  ),
                  If(varRazeniC = "nazev", nazev, varRazeniC = "vlastnik", vlastnik, kod),
                  If(varRazeniAscC, SortOrder.Ascending, SortOrder.Descending)
              )
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =44 + varFs * 4
