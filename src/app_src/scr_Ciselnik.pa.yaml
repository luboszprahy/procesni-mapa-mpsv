            # Průhledná vrstva přes celý řádek nese klik i podbarvení při
            # najetí a musí být POSLEDNÍ, aby ležela nad popisky — jinak by
            # řádek reagoval jen na mezerách mezi nimi (stejný vzor jako
            # lbl_RadekPrekryv v seznamu a lbl_StromPrekryv na přehledu).
            - lbl_RadekPrekryvC:
                Control: Label@2.5.1
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight - 1
                  HoverFill: =RGBA(16, 126, 150, 0.14)
                  OnSelect: |-
                    =Set(varUrovenTyp, ThisItem.uroven);
                    Set(varCiselnikNova, false);
                    Set(varCiselnikKod, ThisItem.kod);
                    Set(varRodicC, "");
                    Set(varChybaC, "");
                    Reset(drp_AgendaC);
                    Reset(drp_ProcesC);
                    Reset(txt_NazevC);
                    Reset(drp_VlastnikC);
                    If(
                        ThisItem.uroven = "aktivita",
                        Set(varDetailZpet, "ciselnik");
                        Set(varNova, false);
                        Set(varAktivita, LookUp(Aktivity, Title = ThisItem.kod));
                        Navigate(scr_Detail, ScreenTransition.Cover)
                    )
                  PressedFill: =RGBA(16, 126, 150, 0.22)
                  Text: =""
                  Tooltip: |-
                    =ThisItem.kod & " · " & ThisItem.nazevPlny & Char(10) &
                    If(
                        IsBlank(ThisItem.vlastnik),
                        "Vlastník není vyplněný.",
                        "Vlastník: " & ThisItem.vlastnik &
                        If(
                            IsBlank(LookUp(colUtvary, Title = ThisItem.vlastnik)),
                            "",
                            " · " & LookUp(colUtvary, Title = ThisItem.vlastnik, nazev)
                        )
                    ) & Char(10) &
                    If(
                        !ThisItem.uklid,
                        "",
                        If(
                            ThisItem.uroven = "agenda",
                            "Prázdná agenda — není pod ní žádný proces." & Char(10),
                            If(
                                ThisItem.uroven = "aktivita",
                                "Osiřelá aktivita — její dílčí proces v číselníku není." & Char(10),
                                "Osiřelá položka — nadřazená úroveň v číselníku není." & Char(10)
                            )
                        )
                    ) &
                    If(
                        ThisItem.uroven = "aktivita",
                        "Klikni pro otevření detailu aktivity.",
                        "Klikni pro načtení do formuláře vpravo."
                    )
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            # Koš je až za překryvem, jinak by ho překryv zakryl a klik spolkl.
            # Nemaže hned — jen si zapamatuje, čeho se dotaz týká; smaže se až
            # po potvrzení v dialogu, protože řádek galerie se dá trefit omylem.
            - ico_SmazatC:
