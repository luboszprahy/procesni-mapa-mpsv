      - btn_ModalProvestP:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylPozor
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            Fill: =stylPozor
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =stylPozor
            # POŘADÍ JE PODSTATNÉ a je zvolené tak, aby přerušení uprostřed
            # nechalo duplicitu, ne ztrátu: nejdřív záloha, pak VZNIK nových
            # záznamů a vazeb, pak zápis do historie, a teprve nakonec ZÁNIK.
            # V opačném pořadí by výpadek sítě uprostřed smazal větev, která
            # ještě nikde jinde neexistuje.
            # Záloha PŘED zápisem je součást zadání, ne opatrnost navíc:
            # kaskáda není transakce (SharePoint ji neumí ani přes flow)
            # a metodika u změny kódu vyžaduje doložitelnost.
            OnSelect: |-
              =Set(varPresunPotvrdit, false);
              Set(varPresunBezi, true);
              IfError(
                  ZalohaFlow.Run();
                  Set(
                      varPresunZapis,
                      PresunFlow.Run(
                          "{""kod"":""" & varPresunKod &
                          """,""uroven"":""" & varPresunUroven &
                          """,""cil"":""" & If(
                              varPresunUroven = "proces",
                              Left(drp_CilAgendaP.Selected.Value, 2),
                              Left(drp_CilProcesP.Selected.Value, 5)
                          ) &
                          """,""duvod"":""" & txt_DuvodP.Text &
                          """,""rezim"":""zapis""}"
                      )
                  );
                  Notify(
                      "Přesun hotov: " & varPresunKod & " je teď " & varPresunZapis.porizeno & ".",
                      NotificationType.Success,
                      varNotifyMs
                  ),
                  Notify(
                      "Přesun selhal: " & FirstError.Message & " Zkontroluj rejstřík a případně ho obnov ze zálohy pořízené na začátku.",
                      NotificationType.Error,
                      varNotifyChybaMs
                  )
              );
              Set(varPresunBezi, false);
              Set(varAktStale, true);
              Set(varPresunHotovo, "");
              Clear(colPresun);
              Set(varUrovenTyp, If(varPresunUroven = "proces", "proces", "dilci"));
              Set(varCiselnikNova, true);
              Set(varCiselnikKod, "");
              Set(varRodicC, "");
              Navigate(scr_Ciselnik, ScreenTransition.UnCover)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylPozor
            Size: =11 + varFs
            Text: ="Ano, přesunout"
            Visible: =varPresunPotvrdit
            Width: =240
            X: =Parent.Width / 2 - 4
            Y: =544
