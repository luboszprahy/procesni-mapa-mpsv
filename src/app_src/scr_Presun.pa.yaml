              ="Přesun je zánik a vznik, ne přejmenování. Starý kód se uzavře v Historii kódů a zůstane jako doklad; pod novým rodičem vznikne nový kód a obě strany na sebe ukazují. Mění se prefix celého podstromu, takže se to týká i dílčích procesů a aktivit pod ním — pořadová čísla si ale ponechají. Nic se nezapíše, dokud si náhled neodklepneš."
