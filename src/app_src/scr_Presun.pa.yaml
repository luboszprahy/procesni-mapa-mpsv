# Obrazovka 6 — přesun procesu nebo dílčího procesu pod jiného rodiče.
#
# Tvar je schválně týž jako scr_Nahled, protože je to táž úloha: vyber →
# spočítej nanečisto → podívej se, co z toho vyjde → teprve pak zapiš.
# Rozlišuje je `varPresunUroven` ("proces" / "dilci_proces").
#
# VARIANTA C — ZÁNIK A VZNIK. Přesun není přejmenování. Starý kód se uzavře
# v listu Historie kódů a zůstane jako doklad, nový kód vznikne pod novým
# rodičem a obě strany na sebe ukazují (`nastupce_kod` a `puvodni_kod`).
# Kód tím navždy znamená jednu jedinou věc — vlastnost, kterou po schválení
# organizačního řádu už nejde dodělat zpětně.
#
# PŘEČÍSLOVÁVÁ SE JEN PŘESOUVANÁ ÚROVEŇ. Potomci dědí nový prefix a nechají
# si své pořadové číslo:
#     proces  07-08          → 03-05           (první volné BB v agendě 03)
#       dílčí proces 07-08-001   → 03-05-001    (CCC beze změny)
#         aktivita   07-08-001-0006 → 03-05-001-0006  (DDDD beze změny)
# Hledat pod novým rodičem volná CCC/DDDD není potřeba: číslují se v rámci
# svého rodiče a ten je nový, takže jsou volná všechna.
#
# VŠECHNO SE POČÍTÁ NAD KOLEKCEMI, ne nad zdrojem — kaskáda se ptá na tytéž
# řádky mnohokrát a nad SharePointem by to byly stovky dotazů. Kolekce plní
# OnVisible téhle obrazovky, ne přehled: sem se dá přijít i po delší práci
# v jiné části appky a data z přehledu můžou být stará.
#
# POČÍTÁ I ZAPISUJE `PresunFlow`, ne appka. Kaskáda je ~240 zápisů: v appce
# běží v prohlížeči a zavřené okno nebo výpadek sítě uprostřed nechá rejstřík
# rozpůlený, kdežto Foreach v Logic Apps doběhne na serveru a při pádu je
# vidět, na které akci. Obrazovka tedy jen skládá požadavek, kreslí náhled
# z odpovědi a hlídá, aby se nezapisovalo podle náhledu spočítaného pro jiný
# cíl. Kolekce níž slouží nabídkám a popiskům, ne výpočtu.
Screens:
  scr_Presun:
    Properties:
      Fill: =stylPlocha
      LoadingSpinnerColor: =stylAkce
      OnVisible: |-
        =Set(varPresunHotovo, "");
        Set(varPresunNovyPrefix, "");
        Set(varPresunPotvrdit, false);
        Set(varPresunBezi, false);
        // ClearCollect + Clear, ne samotný Clear: prázdné kolekci by Studio
        // neznalo sloupce a galerie by hlásila neznámé ThisItem.stary.
        // Tvar musí sedět s tím, co do ní nasype odpověď PresunFlow.
        ClearCollect(colPresun, { stary: "", novy: "", uroven: "", nazev: "" });
        Clear(colPresun);
        Reset(drp_CilAgendaP);
        Reset(drp_CilProcesP);
        Reset(txt_DuvodP);
        If(
            IsEmpty(colAgendy) || IsEmpty(colProcesy) || IsEmpty(colDilci),
            ClearCollect(colAgendy, ShowColumns(Agendy, Title, nazev, vlastnik));
            ClearCollect(colProcesy, ShowColumns(Procesy, Title, nazev, agenda_kod, vlastnik));
            ClearCollect(colDilci, ShowColumns('Dílčí procesy', Title, nazev, proces_kod, vlastnik))
        );
        // Aktivity, vazby a historie se načítají VŽDY, ne jen když jsou
        // prázdné: kaskáda podle nich počítá, co se uzavře, a snímek starý
        // o celou session by přečísloval podle neaktuálního stavu.
        ClearCollect(
            colAkt,
            ShowColumns(Aktivity, Title, nazev, nazev_kratky, dilci_proces_kod, vykonava, sekce, stav)
        );
        ClearCollect(
            colVazby,
            ShowColumns('Vazba aktivita–dílčí proces', aktivita_kod, dilci_proces_kod, primarni)
        )
    Children:
      - rec_HlavickaP:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPrimarni
            Height: =48
            Width: =Parent.Width
            X: =0
            Y: =0
      - ico_ZpetP:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =40
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.18)
            Icon: =Icon.ChevronLeft
            OnSelect: |-
              =Set(varUrovenTyp, If(varPresunUroven = "proces", "proces", "dilci"));
              Set(varCiselnikNova, true);
              Set(varCiselnikKod, "");
              Set(varRodicC, "");
              Navigate(scr_Ciselnik, ScreenTransition.UnCover)
            PaddingBottom: =10
            PaddingLeft: =10
            PaddingRight: =10
            PaddingTop: =10
            PressedFill: =RGBA(255, 255, 255, 0.28)
            Tooltip: '="Zpět do číselníku. Nedokončený náhled se nikam neukládá a nic nezapisuje."'
            Width: =40
            X: =16
            Y: =4
      - lbl_NadpisP:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =14 + varFs
            Text: |-
              =If(
                  varPresunUroven = "proces",
                  "Přesun procesu pod jinou agendu",
                  "Přesun dílčího procesu pod jiný proces"
              )
            VerticalAlign: =VerticalAlign.Middle
            Width: =900
            X: =68
            Y: =8
      - lbl_VysvetleniP:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =40
            Size: =10 + varFs
