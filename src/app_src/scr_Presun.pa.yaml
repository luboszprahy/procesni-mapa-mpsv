            Tooltip: '="Kolik položek přesun zasáhne. Každé z nich se uzavře kód a vznikne nový, protože se jim mění prefix - to je podstata varianty C. Aktivity se počítají podle primárního zařazení; vedlejší vazby se přenesou taky, ale nový kód nedostávají."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =546
            X: =770
            Y: =128
      - lbl_l_CilAgendaP:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
