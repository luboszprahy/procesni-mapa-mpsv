              =If(IsBlank(drp_CilAgendaP.Selected.Value), DisplayMode.Disabled, DisplayMode.Edit)
            Font: =Font.'Open Sans'
            Height: =32
            Items: |-
              =Distinct(
                  Filter(
                      colProcesy,
                      agenda_kod = Left(drp_CilAgendaP.Selected.Value, 2),
                      Title <> "00-00",
                      Title <> varPresunKod
                  ),
                  Title & " · " & nazev
              )
            OnChange: |-
              =Set(varPresunHotovo, "");
              Clear(colPresun)
            Size: =11 + varFs
            Tooltip: '="Proces, pod který dílčí proces přejde. Nabízejí se jen procesy vybrané agendy; dokud agenda není vybraná, je pole zašedlé."'
            Visible: =varPresunUroven = "dilci_proces"
            Width: =400
            X: =460
            Y: =208
      - lbl_l_DuvodP:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Důvod přesunu (zapíše se ke každému uzavřenému kódu)"
            Width: =820
            X: =40
            Y: =260
      - txt_DuvodP:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =stylOkraj
            Default: =""
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HintText: '="Například: organizační změna k 1.1.2027, agenda přechází pod sekci 4"'
            HoverBorderColor: =stylAkce
            Size: =11 + varFs
            Tooltip: '="Důvod je povinný - metodika vyžaduje, aby změna kódu byla doložená. Zapíše se ke KAŽDÉMU uzavřenému kódu v této kaskádě, takže z historie jde později dohledat, proč se celá větev přečíslovala."'
            Width: =820
            X: =40
            Y: =284
      - btn_SpocitatP:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: |-
              =If(
                  varPresunBezi
                  || IsBlank(varPresunKod)
                  || IsBlank(drp_CilAgendaP.Selected.Value)
                  || (varPresunUroven = "dilci_proces" && IsBlank(drp_CilProcesP.Selected.Value))
                  || IsBlank(txt_DuvodP.Text),
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =stylAkceHover
            # Nové číslo se hledá jako maximum přes ŽIVÝ list I HISTORII —
            # uzavřený kód se nikdy nerecykluje (pravidlo F10/1). Bez historie
            # by přesun zpátky tam, odkud položka přišla, oživil kód, který
            # už jednou něco znamenal.
            # Náhled je povinný krok, ne pohodlí: tlačítko Provést je zhasnuté,
            # dokud výpočet neproběhl právě nad tímhle cílem. Jinak by se
            # zapisovalo podle čísel, která platila pro jiného rodiče.
            OnSelect: |-
              =Set(varPresunBezi, true);
              Set(varPresunHotovo, "");
              Clear(colPresun);
              IfError(
                  Set(
                      varPresunVysledek,
                      PresunFlow.Run(
                          "{""kod"":""" & varPresunKod &
                          """,""uroven"":""" & varPresunUroven &
                          """,""cil"":""" & If(
                              varPresunUroven = "proces",
                              Left(drp_CilAgendaP.Selected.Value, 2),
                              Left(drp_CilProcesP.Selected.Value, 5)
                          ) &
                          """,""duvod"":""" & txt_DuvodP.Text &
                          """,""rezim"":""nahled""}"
                      )
                  );
                  Set(varPresunNovyPrefix, varPresunVysledek.porizeno);
                  If(
                      varPresunVysledek.stav = "plno",
                      Notify(varPresunVysledek.hlaseni, NotificationType.Error, varNotifyChybaMs),
                      ClearCollect(
                          colPresun,
                          ForAll(
                              Split(varPresunVysledek.prehled, "|#|") As r,
                              {
                                  stary: First(Split(r.Value, "|~|")).Value,
                                  novy: Last(FirstN(Split(r.Value, "|~|"), 2)).Value,
                                  uroven: Last(FirstN(Split(r.Value, "|~|"), 3)).Value,
                                  nazev: Last(Split(r.Value, "|~|")).Value
                              }
                          )
                      );
                      Set(varPresunHotovo, varPresunKod & "→" & varPresunNovyPrefix)
                  ),
                  Notify("Náhled se nepodařilo spočítat: " & FirstError.Message, NotificationType.Error, varNotifyChybaMs)
              );
              Set(varPresunBezi, false)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylAkceStisk
            Size: =11 + varFs
            Text: ="Spočítat náhled"
            Tooltip: '="Spočítá, které kódy se uzavřou a jaké vzniknou. Nic nezapisuje. Nové číslo se hledá jako první volné pod cílovým rodičem, a to přes živý číselník I přes historii - uzavřený kód se nikdy nerecykluje."'
            Width: =200
            X: =880
            Y: =284
      - lbl_NovyKodP:
