      - lbl_SouhrnP:
          Control: Label@2.5.1
          Properties:
            Color: =stylText
            Font: =Font.'Open Sans'
            Height: =36
            Size: =11 + varFs
            Text: |-
              =If(
                  IsBlank(varPresunHotovo),
                  "Vyber cíl, vyplň důvod a dej Spočítat náhled.",
