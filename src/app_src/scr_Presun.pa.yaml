              =Reset(drp_CilProcesP);
              Set(varPresunHotovo, "");
              Clear(colPresun)
            Size: =11 + varFs
            Tooltip: '="Kam se má položka přestěhovat. Technická větev 00 Nezařazeno se nenabízí - je to provizorium pro import holých aktivit, ne kus rejstříku."'
            Width: =400
            X: =40
            Y: =208
      - lbl_l_CilProcesP:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Cílový proces"
            Visible: =varPresunUroven = "dilci_proces"
            Width: =400
            X: =460
            Y: =184
      - drp_CilProcesP:
          Control: Classic/DropDown@2.3.1
          Properties:
            AllowEmptySelection: =true
            BorderColor: =stylOkraj
            ChevronBackground: =stylKarta
            ChevronFill: =stylAkce
            Color: =stylText
