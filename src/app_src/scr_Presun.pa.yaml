                  varPresunNovyPrefix & ". Přenese se " &
                  CountRows(
                      Filter(
                          colVazby,
                          !IsBlank(LookUp(colPresun, stary = aktivita_kod))
                          || !IsBlank(LookUp(colPresun, stary = dilci_proces_kod))
                      )
                  ) & " zařazení. Před zápisem se pořídí záloha rejstříku."
              )
            VerticalAlign: =VerticalAlign.Middle
            Width: =1000
            X: =40
            Y: =660
      - btn_ProvestP:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            # Zápis jde odklepnout jedině tehdy, když náhled proběhl PRÁVĚ NAD
            # TÍMHLE cílem. Změna agendy nebo procesu náhled zneplatní, jinak
            # by se zapisovalo podle čísel, která platila pro jiný cíl.
            DisplayMode: |-
              =If(
                  varPresunBezi
                  || IsBlank(varPresunHotovo)
                  || varPresunHotovo <> varPresunKod & "→" & varPresunNovyPrefix,
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =stylPozor
            FocusedBorderColor: =stylPozor
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =stylPozor
            OnSelect: =Set(varPresunPotvrdit, true)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylPozor
            Size: =11 + varFs
            Text: ="Provést přesun"
            Tooltip: '="Provede kaskádu: pořídí zálohu, založí nové kódy, přenese zařazení, uzavře staré kódy v historii a staré záznamy smaže. Trvá to desítky sekund - je to řádově dvě stě zápisů. Zpět to jde jen obnovou ze zálohy, která se pořídí na začátku."'
