# Zdroj canvas appky "procesni mapa" — App.
# Generováno ručně podle deploy/app_navrh.md, schéma listů src/schema.json.
# colUtvary/colSekce plní nabídky filtrů. Distinct nad Aktivitami není
# delegovatelný — nad 2 000 aktivitami by nabídka přestala být úplná.
# Do té doby je to nejlevnější zdroj hodnot; pak bude potřeba číselník útvarů.
App:
  Properties:
    OnStart: |-
      =Concurrent(
          ClearCollect(colAgendy, ShowColumns(Agendy, Title, nazev, vlastnik)),
          ClearCollect(colProcesy, ShowColumns(Procesy, Title, nazev, agenda_kod, vlastnik)),
          ClearCollect(colDilci, ShowColumns('Dílčí procesy', Title, nazev, proces_kod, vlastnik))
      );
      ClearCollect(colUtvary, { Value: "(vše)" });
      Collect(colUtvary, Distinct(Aktivity, vykonava));
      ClearCollect(colSekce, { Value: "(vše)" });
      Collect(colSekce, Distinct(Aktivity, sekce));
      Set(varNova, false);
      Set(varAktivita, Blank())
    Theme: =PowerAppsTheme
