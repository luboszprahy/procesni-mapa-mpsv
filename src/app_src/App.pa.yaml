# Zdroj canvas appky "procesni mapa" — App.
# Generováno ručně podle deploy/app_navrh.md, schéma listů src/schema.json.
# varMapaUrl se odsud NEnastavuje. Canvas app umí číst jen datasetové
# proměnné prostředí, textové ne — adresu mapy proto dodá ExportFlow, které
# ji složí z proměnné webu (volání `ExportFlow.Run("__mapa__")` v OnSelect
# tlačítka mapy). Díky tomu je adresa vždy z toho prostředí, kde appka běží,
# a při přenosu na jiný tenant se nic nepřepisuje.
#
# Adresa MUSÍ být náhled knihovny (AllItems.aspx?id=<cesta k souboru>), NE přímý
# odkaz na .html. Ověřeno 20.08.2026: na přímou cestu k souboru pošle SharePoint
# kvůli Strict browser file handling `Content-Disposition: attachment` a mapa se
# místo zobrazení stáhne do Downloads. Klik v knihovně používá právě tenhle tvar.
# `viewid` určuje jen podkladové zobrazení knihovny; adresa je z reálného kliknutí,
# a proto se přebírá celá — zkracovat ji bez ověření v prostředí nemá cenu.
# Nabídky útvarů a sekcí se plní z číselníku 'Útvary', ne z hodnot v aktivitách:
# číselník je malý a načte se celý, takže nabídka je úplná bez ohledu na to,
# kolik aktivit v rejstříku je. Položka nabídky má tvar "kód · název".
App:
  Properties:
    OnStart: |-
      =Concurrent(
          ClearCollect(colAgendy, ShowColumns(Agendy, Title, nazev, vlastnik)),
          ClearCollect(colProcesy, ShowColumns(Procesy, Title, nazev, agenda_kod, vlastnik)),
          ClearCollect(colDilci, ShowColumns('Dílčí procesy', Title, nazev, proces_kod, vlastnik)),
          ClearCollect(colUtvary, ShowColumns('Útvary', Title, nazev, uroven, nadrizeny_kod))
      );
      ClearCollect(colUtvarNabidka, { Value: "(vše)" });
      Collect(colUtvarNabidka, Distinct(Filter(colUtvary, uroven.Value <> "sekce"), Title & " · " & nazev));
      ClearCollect(colSekceNabidka, { Value: "(vše)" });
      Collect(colSekceNabidka, Distinct(Filter(colUtvary, uroven.Value = "sekce"), Title & " · " & nazev));
      // Adresa mapy se sem dotáhne z ExportFlow až při kliknutí na tlačítko
      // (flow ji složí z proměnné prostředí, takže sedí na to prostředí,
      // kde appka běží). Tady jen prázdno, aby proměnná existovala.
      Set(varMapaUrl, "");
      // Totéž pro adresu vzorové tabulky pro import — ta leží v Site
      // Assets a její adresu skládá rovněž ExportFlow.
      Set(varSablonaUrl, "");
      // Doba svícení notifikací v ms. Tři sekundy na obojí — chyba měla
      // dřív 4000, ale delší svícení působilo spíš jako zádrhel než jako
      // čas navíc na čtení (rozhodnuto 31.08.2026). Ladí se jen tady.
      Set(varNotifyMs, 3000);
      Set(varNotifyChybaMs, 3000);
      Set(stylPrimarni, RGBA(17, 11, 122, 1));
      Set(stylAkce, RGBA(16, 126, 150, 1));
      Set(stylAkceHover, RGBA(14, 111, 131, 1));
      Set(stylAkceStisk, RGBA(12, 95, 112, 1));
      Set(stylPlocha, RGBA(246, 248, 252, 1));
      Set(stylKarta, RGBA(255, 255, 255, 1));
      Set(stylOkraj, RGBA(220, 225, 236, 1));
      Set(stylText, RGBA(27, 34, 51, 1));
      Set(stylTextSlaby, RGBA(84, 94, 115, 1));
      Set(stylRadekHover, RGBA(238, 243, 251, 1));
      Set(stylRadekVybrany, RGBA(221, 232, 248, 1));
      Set(stylUspech, RGBA(48, 128, 64, 1));
      Set(stylUspechSvetle, RGBA(228, 243, 232, 1));
      Set(stylPozor, RGBA(158, 92, 0, 1));
      Set(stylPozorSvetle, RGBA(253, 243, 226, 1));
      Set(stylNebezpeci, RGBA(168, 32, 32, 1));
      Set(stylVrstva1, RGBA(213, 216, 239, 1));
      Set(stylPruh1, RGBA(17, 11, 122, 1));
      Set(stylVrstva2, RGBA(226, 233, 246, 1));
      Set(stylPruh2, RGBA(20, 158, 187, 1));
      Set(stylVrstva3, RGBA(237, 242, 250, 1));
      Set(stylPruh3, RGBA(60, 160, 80, 1));
      Set(stylVrstva4, RGBA(250, 251, 254, 1));
      Set(stylPruh4, RGBA(169, 199, 236, 1));
      Set(varNova, false);
      Set(varAktivita, Blank());
      Set(varAktStale, true);
      // Sirotek = aktivita nahraná importem bez zařazení. Jako jediná smí
      // změnit dílčí proces: její kód 00-00-000-XXXX nikdy platný nebyl,
      // takže se přepíše a do HistorieKodu nejde. U aktivity s platným
      // kódem je kaskáda zamčená až do F10/2 — přesun je tam zánik a vznik.
      Set(varSirotek, false);
      Set(varPresun, false);
      Set(varStaryKod, "");
      // Přesun procesu / dílčího procesu (F10/4). Co se stěhuje, nastaví
      // číselník. Výpočet i zápis dělá PresunFlow.
      Set(varPresunKod, "");
      Set(varPresunUroven, "proces");
      Set(varPresunNazev, "");
      Set(varPresunNovyPrefix, "");
      Set(varPresunHotovo, "");
      Set(varPresunBezi, false);
      Set(varPresunPotvrdit, false);
      Set(varZobrazitKod, true);
      Set(varDetailZpet, "seznam");
      Set(varUrovenTyp, "agenda");
      Set(varCiselnikNova, true);
      Set(varCiselnikKod, "");
      Set(varRodicC, "");
      Set(varNovyDpKod, "");
      Set(varChybaC, "");
      Set(varUklidC, false);
      Set(varRazeniC, "kod");
      Set(varRazeniAscC, true);
      Set(varSekceKodC, "");
      Set(varUtvarKodC, "");
      Set(varSmazatC, Blank());
      Set(varFs, -2);
      Set(varDashStav, "");
      Set(varDashOsirele, false);
      Set(varDashNezarazene, false);
      Set(varMenuRozbalit, false);
      Set(varMenuStav, false);
      Set(varMenuMapa, false);
      Set(varMenuData, false);
      Set(varExportBezi, false);
      Set(varPublikuji, false);
      Set(varZalohuji, false);
      Set(varSmazatD, Blank());
      // Obrazovka náhledu (import i obnova). Odpovědi z flow chodí jako
      // oddělovaný text, ne JSON — appka má dynamicschema = false.
      Set(varNahledRezim, "");
      Set(varNahledSoubor, "");
      Set(varNahledHotovo, "");
      Set(varNahledHlaseni, "");
      Set(varNahledSeznam, "");
      Set(varNahledOdpoved, "");
      Set(varNahledChybyText, "");
      Set(varNahledBezi, false);
      Set(varNahledPotvrdit, false);
      // Razítko dosazuje build_app.py při balení. Bez něj se z běžící appky
      // nedá poznat, jestli po importu proběhla ve Studiu povinná mikro-změna
      // + Save + Publish — publikovaný dokument totiž vzniká až tam a starý
      // by běžel dál, aniž by to bylo na čem vidět (nález B-03, kolo 4).
      Set(varVerze, "vývojová")
    Theme: =PowerAppsTheme
