# Obrazovka 2 — detail/editace aktivity.
# Kaskáda běží nad kolekcemi z App.OnStart (delegace se jich netýká).
# Přidělení kódu je naopak dotaz nad zdrojem, delegovaný přes StartsWith(Title, prefix).
Screens:
  scr_Detail:
    Properties:
      Fill: =stylPlocha
      LoadingSpinnerColor: =stylAkce
      OnVisible: |-
        =Set(varDpKod, If(varNova, varNovyDpKod, varAktivita.dilci_proces_kod));
        Reset(drp_Agenda);
        Reset(drp_Proces);
        Reset(drp_Dilci)
    Children:
      - rec_HlavickaDetail:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPrimarni
            Height: =72
            Width: =Parent.Width
            X: =0
            Y: =0
      # Celý čtvereček je klikací a při najetí zesvětlá — samotná šipka je
      # malý cíl. Vrací se tam, odkud se na detail přišlo: varDetailZpet
      # nastavuje seznam i strom na přehledu, jinak by proklik z přehledu
      # skončil v seznamu aktivit.
      - ico_Zpet:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =56
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.18)
            Icon: =Icon.ChevronLeft
            OnSelect: |-
              =Set(varUrovenTyp, "aktivita");
              Set(varCiselnikNova, varNova);
              Set(varCiselnikKod, If(varNova, "", varAktivita.Title));
              Set(varRodicC, "");
              If(
                  varDetailZpet = "dashboard",
                  Navigate(scr_Dashboard, ScreenTransition.UnCover),
                  Navigate(scr_Ciselnik, ScreenTransition.UnCover)
              )
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            PressedFill: =RGBA(255, 255, 255, 0.28)
            Tooltip: |-
              =If(
                  varDetailZpet = "dashboard",
                  "Zpět na přehled, na to místo ve stromu, odkud jsi přišel.",
                  "Zpět na editaci, na seznam aktivit."
              ) & " Neuložené změny se zahodí."
            Width: =56
            X: =16
            Y: =8
      - lbl_KodDetail:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            Size: =16 + varFs
            Text: |-
              =If(varNova, "Nová aktivita — kód se přidělí při uložení", varAktivita.Title)
            VerticalAlign: =VerticalAlign.Middle
            Width: =740
            X: =88
            Y: =16
      # Stejný přepínač jako na přehledu a v seznamu, tatáž proměnná —
      # volba tedy platí napříč appkou. Na detailu mění popisky i obsah
      # polí; výšky zůstávají, protože se text do stávajících rámečků
      # vejde i na největším stupni.
      - btn_PismoT1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.35)
            BorderThickness: =1
            Color: =If(varFs = 0, RGBA(255, 255, 255, 1), RGBA(214, 220, 234, 1))
            Fill: =If(varFs = 0, RGBA(255, 255, 255, 0.22), RGBA(0, 0, 0, 0))
            FocusedBorderColor: =RGBA(255, 255, 255, 1)
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.14)
            OnSelect: =Set(varFs, 0)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 0.30)
            Size: =10
            Text: ="A"
            Tooltip: '="Nejmenší text, vejde se toho nejvíc."'
            Width: =34
            X: =Parent.Width - 502
            Y: =20
      - btn_PismoT2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.35)
            BorderThickness: =1
            Color: =If(varFs = 2, RGBA(255, 255, 255, 1), RGBA(214, 220, 234, 1))
            Fill: =If(varFs = 2, RGBA(255, 255, 255, 0.22), RGBA(0, 0, 0, 0))
            FocusedBorderColor: =RGBA(255, 255, 255, 1)
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.14)
            OnSelect: =Set(varFs, 2)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 0.30)
            Size: =13
            Text: ="A"
            Tooltip: '="Střední text v popiscích i v polích. Výchozí nastavení."'
            Width: =38
            X: =Parent.Width - 464
            Y: =20
      - btn_PismoT3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.35)
            BorderThickness: =1
            Color: =If(varFs = 4, RGBA(255, 255, 255, 1), RGBA(214, 220, 234, 1))
            Fill: =If(varFs = 4, RGBA(255, 255, 255, 0.22), RGBA(0, 0, 0, 0))
            FocusedBorderColor: =RGBA(255, 255, 255, 1)
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.14)
            OnSelect: =Set(varFs, 4)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 0.30)
            Size: =16
            Text: ="A"
            Tooltip: '="Největší text. Nejdelší hodnoty se můžou v poli oříznout."'
            Width: =42
            X: =Parent.Width - 422
            Y: =20
      - lbl_l_Agenda:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Agenda"
            Width: =620
            X: =40
            Y: =96
      - drp_Agenda:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="První úroveň hierarchie: oblast činnosti daná zákonem nebo vnitřním předpisem, vlastníkem je sekce. Výběr agendy určuje, které procesy se nabídnou níž. Když agendu změníš, proces i dílčí proces se vynulují — kombinace z různých agend neexistuje."'
            AllowEmptySelection: =true
            Default: |-
              =If(
                  IsBlank(varDpKod),
                  "",
                  LookUp(colAgendy, Title = Left(varDpKod, 2), Title & " · " & nazev)
              )
            Font: =Font.'Open Sans'
            Height: =40
            Items: =Distinct(colAgendy, Title & " · " & nazev)
            OnChange: |-
              =Reset(drp_Proces);
              Reset(drp_Dilci)
            Size: =13 + varFs
            Width: =620
            X: =40
            Y: =120
      - lbl_l_Proces:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Proces"
            Width: =620
            X: =40
            Y: =172
      - drp_Proces:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Druhá úroveň: tok činností s definovaným vstupem a výstupem, vlastníkem je odbor. Nabízejí se jen procesy vybrané agendy. Dokud není vybraná agenda, je pole zašedlé — to není chyba, jen kaskáda čeká na nadřazenou úroveň."'
            AllowEmptySelection: =true
            DisplayMode: =If(IsBlank(drp_Agenda.Selected.Value), DisplayMode.Disabled, DisplayMode.Edit)
            Default: |-
              =If(
                  IsBlank(varDpKod),
                  "",
                  LookUp(colProcesy, Title = Left(varDpKod, 5), Title & " · " & nazev)
              )
            Font: =Font.'Open Sans'
            Height: =40
            Items: |-
              =Distinct(
                  Filter(colProcesy, agenda_kod = Left(drp_Agenda.Selected.Value, 2)),
                  Title & " · " & nazev
              )
            OnChange: =Reset(drp_Dilci)
            Size: =13 + varFs
            Width: =620
            X: =40
            Y: =196
      - lbl_l_Dilci:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Dílčí proces"
            Width: =620
            X: =40
            Y: =248
      - drp_Dilci:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Třetí úroveň: vymezený úsek procesu, vlastníkem je odbor. Tenhle výběr je klíčový — určuje kód aktivity a její primární zařazení v procesní mapě. Nabízejí se jen dílčí procesy vybraného procesu. Aktivitu lze zařadit i do dalších dílčích procesů tlačítkem „Další dílčí procesy…“."'
            AllowEmptySelection: =true
            DisplayMode: =If(IsBlank(drp_Proces.Selected.Value), DisplayMode.Disabled, DisplayMode.Edit)
            Default: |-
              =If(IsBlank(varDpKod), "", LookUp(colDilci, Title = varDpKod, Title & " · " & nazev))
            Font: =Font.'Open Sans'
            Height: =40
            Items: |-
              =Distinct(
                  Filter(colDilci, proces_kod = Left(drp_Proces.Selected.Value, 5)),
                  Title & " · " & nazev
              )
            Size: =13 + varFs
            Width: =620
            X: =40
            Y: =272
      - lbl_l_Nazev:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Aktivita — znění pro organizační řád"
            Width: =620
            X: =40
            Y: =324
      - txt_Nazev:
          Control: Classic/TextInput@2.3.2
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Znění činnosti tak, jak má stát v organizačním řádu — celá věta, ne heslo. Toto je nejnižší úroveň hierarchie a vykonává ji oddělení. Pole je bez omezení délky (nejdelší aktivita v datech má 220 znaků); pro řazení v seznamu se z něj automaticky odvozuje zkrácená verze na 150 znaků."'
            HintText: ="Znění činnosti tak, jak má být v organizačním řádu"
            Default: =If(varNova, "", varAktivita.nazev)
            Font: =Font.'Open Sans'
            Height: =88
            Mode: =TextMode.MultiLine
            Size: =13 + varFs
            Width: =620
            X: =40
            Y: =348
      - lbl_l_Spolupracuje:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Spolupracuje"
            Width: =620
            X: =40
            Y: =448
      - txt_Spolupracuje:
          Control: Classic/TextInput@2.3.2
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Útvary, které se na aktivitě podílejí, ale nejsou za ni odpovědné. Víc útvarů odděl středníkem (712; 721). Odpovědný útvar patří do pole „Vykonává útvar“, ne sem."'
            HintText: ="Útvary, které se na aktivitě podílejí — např. 712; 721"
            Default: =If(varNova, "", varAktivita.spolupracuje)
            Font: =Font.'Open Sans'
            Height: =64
            Mode: =TextMode.MultiLine
            Size: =13 + varFs
            Width: =620
            X: =40
            Y: =472
      - lbl_l_TextOR:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Text pro OŘ"
            Width: =620
            X: =40
            Y: =548
      - txt_TextOR:
          Control: Classic/TextInput@2.3.2
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Nepovinné. Místo pro formulaci, která půjde doslova do organizačního řádu, pokud se má lišit od znění aktivity. Dokud je prázdné, použije se při generování organizačního řádu znění aktivity. Generování samo je až druhá fáze projektu."'
            HintText: ="Nepovinné, plní se až pro generování organizačního řádu"
            Default: =If(varNova, "", varAktivita.text_pro_or)
            Font: =Font.'Open Sans'
            Height: =64
            Mode: =TextMode.MultiLine
            Size: =13 + varFs
            Width: =620
            X: =40
            Y: =572
      - lbl_l_VlastnikAgendy:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Vlastník agendy (z číselníku)"
            Width: =620
            X: =700
            Y: =96
      - lbl_VlastnikAgendy:
          Control: Label@2.5.1
          Properties:
            Fill: =stylOkraj
            Font: =Font.'Open Sans'
            Height: =40
            PaddingLeft: =12
            Size: =13 + varFs
            Text: |-
              =If(
                  IsBlank(drp_Agenda.Selected.Value),
                  "",
                  Coalesce(
                      LookUp(colAgendy, Title = Left(drp_Agenda.Selected.Value, 2), vlastnik),
                      "— v rejstříku nevyplněno —"
                  )
              )
            VerticalAlign: =VerticalAlign.Middle
            Width: =620
            X: =700
            Y: =120
      - lbl_l_VlastnikProcesu:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Vlastník procesu (z číselníku)"
            Width: =620
            X: =700
            Y: =172
      - lbl_VlastnikProcesu:
          Control: Label@2.5.1
          Properties:
            Fill: =stylOkraj
            Font: =Font.'Open Sans'
            Height: =40
            PaddingLeft: =12
            Size: =13 + varFs
            Text: |-
              =If(
                  IsBlank(drp_Proces.Selected.Value),
                  "",
                  Coalesce(
                      LookUp(colProcesy, Title = Left(drp_Proces.Selected.Value, 5), vlastnik),
                      "— v rejstříku nevyplněno —"
                  )
              )
            VerticalAlign: =VerticalAlign.Middle
            Width: =620
            X: =700
            Y: =196
      - lbl_l_VlastnikDilci:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Vlastník dílčího procesu (z číselníku)"
            Width: =620
            X: =700
            Y: =248
      - lbl_VlastnikDilci:
          Control: Label@2.5.1
          Properties:
            Fill: =stylOkraj
            Font: =Font.'Open Sans'
            Height: =40
            PaddingLeft: =12
            Size: =13 + varFs
            Text: |-
              =If(
                  IsBlank(drp_Dilci.Selected.Value),
                  "",
                  Coalesce(
                      LookUp(colDilci, Title = Left(drp_Dilci.Selected.Value, 9), vlastnik),
                      "— v rejstříku nevyplněno —"
                  )
              )
            VerticalAlign: =VerticalAlign.Middle
            Width: =620
            X: =700
            Y: =272
      - lbl_l_Utvar:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Vykonává útvar"
            Width: =300
            X: =700
            Y: =324
      - drp_UtvarDetail:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Útvar, který aktivitu vykonává a nese za ni odpovědnost. Vybírá se z číselníku útvarů, aby se do evidence nedostaly překlepy — podle tohoto pole se filtruje seznam a jednou z něj bude sestavený text organizačního řádu. Chybí-li útvar v nabídce, doplní ho správce do listu Útvary."'
            AllowEmptySelection: =true
            Default: |-
              =If(
                  varNova,
                  "",
                  LookUp(colUtvary, Title = varAktivita.vykonava, Title & " · " & nazev)
              )
            Font: =Font.'Open Sans'
            Height: =40
            Items: =Distinct(Filter(colUtvary, uroven.Value <> "sekce"), Title & " · " & nazev)
            Size: =13 + varFs
            Width: =300
            X: =700
            Y: =348
      - lbl_l_Sekce:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Sekce"
            Width: =300
            X: =1020
            Y: =324
      - drp_SekceDetail:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Sekce, pod kterou vykonávající útvar patří. Vybírá se z číselníku útvarů (úroveň sekce). Podle sekce se dělí evidence mezi sekční správce procesního rámce a filtruje se seznam aktivit."'
            AllowEmptySelection: =true
            Default: |-
              =If(
                  varNova,
                  "",
                  LookUp(colUtvary, Title = varAktivita.sekce, Title & " · " & nazev)
              )
            Font: =Font.'Open Sans'
            Height: =40
            Items: =Distinct(Filter(colUtvary, uroven.Value = "sekce"), Title & " · " & nazev)
            Size: =13 + varFs
            Width: =300
            X: =1020
            Y: =348
      - lbl_l_Predpis:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Vnitřní předpis"
            Width: =300
            X: =700
            Y: =424
      - txt_Predpis:
          Control: Classic/TextInput@2.3.2
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Vnitřní předpis, o který se aktivita opírá — např. SP 10/2021. Víc předpisů odděl středníkem. Slouží jako doklad, proč se činnost vykonává; při revizi předpisu je podle tohoto pole vidět, kterých aktivit se změna týká."'
            HintText: ="Víc předpisů oddělte středníkem — např. SP 10/2021"
            Default: =If(varNova, "", varAktivita.vnitrni_predpis)
            Font: =Font.'Open Sans'
            Height: =64
            Mode: =TextMode.MultiLine
            Size: =13 + varFs
            Width: =300
            X: =700
            Y: =448
      - lbl_l_Stav:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10 + varFs
            Text: ="Stav"
            Width: =300
            X: =1020
            Y: =424
      - drp_StavDetail:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Pracovní = rozpracováno, schváleno = potvrzené znění pro organizační řád. Přepnutím na „schváleno“ dáváš najevo, že formulace prošla vlastníkem procesu. Automatické schvalování s notifikacemi součástí této fáze není."'
            Default: =If(varNova, "pracovní", varAktivita.stav.Value)
            Font: =Font.'Open Sans'
            Height: =40
            Items: =["pracovní", "schváleno"]
            Size: =13 + varFs
            Width: =300
            X: =1020
            Y: =448
      # ---------- karta zařazení do dílčích procesů ----------
      # Do 1.0.0.34 to byla galerie 300×60 px vedle pole Stav: dva řádky
      # písmem 10, bez nadpisu s počtem a bez štítku primárního zařazení.
      # Z obrazovky nešlo poznat, že jde o zařazení do víc větví mapy.
      # Nově karta přes celou šířku pravého sloupce, řádky 28+ px a akce
      # v hlavičce karty.
      - rec_KartaVazby:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylKarta
            Height: =140
            Width: =620
            X: =700
            Y: =516
      - rec_PruhVazby:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylAkce
            Height: =140
            Width: =4
            X: =700
            Y: =516
      # Nadpis je vidět vždycky a u nové aktivity nese vysvětlení místo počtu.
      # Samostatný popisek „zatím prázdno" přes galerii by neprošel branou
      # kontrola_prekryvu — ta počítá geometrii, ne Visible za běhu.
      - lbl_l_Vazby:
          Control: Label@2.5.1
          Properties:
            Color: =stylText
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11 + varFs
            Text: |-
              =If(
                  varNova,
                  "Zařazení do dílčích procesů — vznikne po uložení",
                  "Zařazení do dílčích procesů (" & CountRows(gal_Zarazeni.AllItems) & ")"
              )
            VerticalAlign: =VerticalAlign.Middle
            Width: =380
            X: =724
            Y: =524
      - btn_Vazby:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =stylAkce
            Fill: =RGBA(255, 255, 255, 1)
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =stylAkce
            HoverFill: =stylRadekHover
            OnSelect: =Navigate(scr_Vazby, ScreenTransition.Cover)
            PressedFill: =stylRadekVybrany
            Size: =11 + varFs
            Text: ="Spravovat…"
            Tooltip: '="Otevře přiřazení aktivity do DALŠÍCH dílčích procesů. Standardně aktivita patří do jednoho (vybraného vlevo) — ale metodika připouští, že tutéž činnost vykonává útvar ve víc dílčích procesech. Pak ji přidej i tam a v mapě se objeví v obou větvích, aniž by vznikl duplicitní záznam."'
            Visible: =!varNova
            Width: =184
            X: =1112
            Y: =520
      # Výška na tři řádky se schválně nedopočítává z počtu položek: má být
      # vidět, že seznam pokračuje pod okrajem, a to ustálená výška se
      # svislým posuvníkem ukáže líp než karta, která se roztáhne.
      - gal_Zarazeni:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextOneImageVariant_ver5.0
          Properties:
            Height: =84
            Items: |-
              =Filter('Vazba aktivita–dílčí proces', aktivita_kod = varAktivita.Title)
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =28 + varFs * 3
            Visible: =!varNova
            Width: =572
            X: =724
            Y: =560
          Children:
            - lbl_ZarazeniText:
                Control: Label@2.5.1
                Properties:
                  Color: =If(ThisItem.primarni.Value = "ano", stylText, stylTextSlaby)
                  Font: =Font.'Open Sans'
                  FontWeight: |-
                    =If(ThisItem.primarni.Value = "ano", FontWeight.Semibold, FontWeight.Normal)
                  Height: =Parent.TemplateHeight
                  PaddingLeft: =0
                  Size: =11 + varFs
                  Text: |-
                    =ThisItem.dilci_proces_kod & " · " &
                    LookUp(colDilci, Title = ThisItem.dilci_proces_kod, nazev)
                  Tooltip: |-
                    =ThisItem.dilci_proces_kod & " · " &
                    LookUp(colDilci, Title = ThisItem.dilci_proces_kod, nazev) &
                    If(ThisItem.primarni.Value = "ano", " (primární zařazení — určuje kód aktivity)", "")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.TemplateWidth - 88
                  X: =0
                  Y: =0
            - lbl_ZarazeniPrimarni:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =stylUspech
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight
                  Size: =10 + varFs
                  Text: |-
                    =If(ThisItem.primarni.Value = "ano", "primární", "")
                  Tooltip: '="Primární zařazení určuje kód aktivity a mění se výběrem dílčího procesu vlevo. Ostatní zařazení se přidávají a odebírají tlačítkem Spravovat."'
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =84
                  X: =Parent.TemplateWidth - 84
                  Y: =0
      - btn_Ulozit:
          Control: Classic/Button@2.2.0
          Properties:
            HoverFill: =stylAkceHover
            PressedFill: =stylAkceStisk
            HoverColor: =RGBA(255, 255, 255, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            FocusedBorderColor: =stylPrimarni
            FocusedBorderThickness: =2
            Tooltip: '="Uloží změny. U nové aktivity se teprve teď přidělí kód AA-BB-CCC-DDDD: AA agenda, BB proces, CCC dílčí proces, DDDD první volné čtyřčíslí v tom dílčím procesu. Zároveň se založí primární vazba do rejstříku. Jednou přidělený kód se už nikdy nemění, ani při přesunu do jiného dílčího procesu - vazby v rejstříku i v mapě na něm stojí. Vlastník součástí kódu není, eviduje se zvlášť. Když mezitím stejný kód zabere někdo jiný, uložení se neprovede a dostaneš hlášku - stačí uložit znovu."'
            Fill: =stylAkce
            Font: =Font.'Open Sans'
            Height: =44
            OnSelect: |-
              =Set(varChyba, "");
              If(IsBlank(drp_Dilci.Selected.Value), Set(varChyba, "Vyber dílčí proces."));
              If(IsBlank(txt_Nazev.Text), Set(varChyba, "Vyplň znění aktivity."));
              If(
                  !IsBlank(varChyba),
                  Notify(varChyba, NotificationType.Warning),
                  Set(varStaryDp, If(varNova, "", varAktivita.dilci_proces_kod));
                  Set(varPrefix, Left(drp_Dilci.Selected.Value, 9) & "-");
                  Set(
                      varNovyKod,
                      If(
                          varNova,
                          varPrefix & Right(
                              "000" & (Value(
                                  Right(
                                      First(Sort(Filter(Aktivity, StartsWith(Title, varPrefix)), Title, SortOrder.Descending)).Title,
                                      4
                                  )
                              ) + 1),
                              4
                          ),
                          varAktivita.Title
                      )
                  );
                  If(
                      varNova && !IsBlank(LookUp(Aktivity, Title = varNovyKod)),
                      Notify("Kód " & varNovyKod & " mezitím někdo použil, zkus uložit znovu.", NotificationType.Warning),
                      IfError(
                          Patch(
                              Aktivity,
                              If(varNova, Defaults(Aktivity), varAktivita),
                              {
                                  Title: varNovyKod,
                                  nazev: txt_Nazev.Text,
                                  nazev_kratky: Left(txt_Nazev.Text, 150),
                                  dilci_proces_kod: Left(drp_Dilci.Selected.Value, 9),
                                  vykonava: Left(drp_UtvarDetail.Selected.Value, Find(" ·", drp_UtvarDetail.Selected.Value & " ·") - 1),
                                  spolupracuje: txt_Spolupracuje.Text,
                                  vnitrni_predpis: txt_Predpis.Text,
                                  text_pro_or: txt_TextOR.Text,
                                  sekce: Left(drp_SekceDetail.Selected.Value, Find(" ·", drp_SekceDetail.Selected.Value & " ·") - 1),
                                  stav: { Value: drp_StavDetail.Selected.Value },
                                  datum_aktualizace: Now()
                              }
                          );
                          If(
                              varNova || varStaryDp <> Left(drp_Dilci.Selected.Value, 9),
                              RemoveIf(
                                  'Vazba aktivita–dílčí proces',
                                  aktivita_kod = varNovyKod,
                                  dilci_proces_kod = varStaryDp
                              );
                              RemoveIf(
                                  'Vazba aktivita–dílčí proces',
                                  aktivita_kod = varNovyKod,
                                  dilci_proces_kod = Left(drp_Dilci.Selected.Value, 9)
                              );
                              Patch(
                                  'Vazba aktivita–dílčí proces',
                                  Defaults('Vazba aktivita–dílčí proces'),
                                  {
                                      Title: varNovyKod & "__" & Left(drp_Dilci.Selected.Value, 9),
                                      aktivita_kod: varNovyKod,
                                      dilci_proces_kod: Left(drp_Dilci.Selected.Value, 9),
                                      primarni: { Value: "ano" }
                                  }
                              )
                          );
                          Set(varAktStale, true);
                          Notify("Uloženo jako " & varNovyKod & ".", NotificationType.Success);
                          Set(varUrovenTyp, "aktivita");
                          Set(varCiselnikNova, false);
                          Set(varCiselnikKod, varNovyKod);
                          Set(varRodicC, "");
                          If(
                              varDetailZpet = "dashboard",
                              Navigate(scr_Dashboard, ScreenTransition.UnCover),
                              Navigate(scr_Ciselnik, ScreenTransition.UnCover)
                          ),
                          Notify("Uložení selhalo: " & FirstError.Message, NotificationType.Error)
                      )
                  )
              )
            Size: =14 + varFs
            Text: ="Uložit"
            Width: =200
            X: =700
            Y: =664
      - btn_Smazat:
          Control: Classic/Button@2.2.0
          Properties:
            HoverFill: =stylNebezpeci
            HoverColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylNebezpeci
            BorderColor: =stylNebezpeci
            FocusedBorderColor: =stylNebezpeci
            FocusedBorderThickness: =2
            Tooltip: '="Smaže aktivitu i všechna její zařazení do dílčích procesů. Nevratné. Číselník agend, procesů a dílčích procesů zůstane nedotčený — maže se jen tato jedna aktivita."'
            Color: =stylNebezpeci
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =44
            OnSelect: |-
              =IfError(
                  RemoveIf('Vazba aktivita–dílčí proces', aktivita_kod = varAktivita.Title);
                  Remove(Aktivity, varAktivita);
                  Set(varAktStale, true);
                  Notify("Aktivita " & varAktivita.Title & " smazána i s vazbami.", NotificationType.Success);
                  Set(varUrovenTyp, "aktivita");
                  Set(varCiselnikNova, true);
                  Set(varCiselnikKod, "");
                  Set(varRodicC, "");
                  Navigate(scr_Ciselnik, ScreenTransition.UnCover),
                  Notify("Smazání selhalo: " & FirstError.Message, NotificationType.Error)
              )
            Size: =14 + varFs
            Text: ="Smazat"
            Visible: =!varNova
            Width: =160
            X: =920
            Y: =664
