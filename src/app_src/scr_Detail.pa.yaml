# Obrazovka 2 — detail/editace aktivity.
# Kaskáda běží nad kolekcemi z App.OnStart (delegace se jich netýká).
# Přidělení kódu je naopak dotaz nad zdrojem, delegovaný přes StartsWith(Title, prefix).
Screens:
  scr_Detail:
    Properties:
      Fill: =stylPlocha
      LoadingSpinnerColor: =stylAkce
      OnVisible: |-
        =Set(varDpKod, If(varNova, "", varAktivita.dilci_proces_kod));
        Reset(drp_Agenda);
        Reset(drp_Proces);
        Reset(drp_Dilci)
    Children:
      - rec_HlavickaDetail:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPrimarni
            Height: =72
            Width: =Parent.Width
            X: =0
            Y: =0
      - ico_Zpet:
          Control: Classic/Icon@2.5.0
          Properties:
            HoverColor: =stylAkce
            PressedColor: =stylAkceStisk
            Tooltip: '="Zpět na seznam aktivit. Neuložené změny se zahodí."'
            Color: =RGBA(255, 255, 255, 1)
            Height: =40
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate(scr_Seznam, ScreenTransition.UnCover)
            PaddingBottom: =10
            PaddingLeft: =10
            PaddingRight: =10
            PaddingTop: =10
            Width: =40
            X: =24
            Y: =16
      - lbl_KodDetail:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            Size: =16
            Text: |-
              =If(varNova, "Nová aktivita — kód se přidělí při uložení", varAktivita.Title)
            VerticalAlign: =VerticalAlign.Middle
            Width: =800
            X: =76
            Y: =16
      - lbl_l_Agenda:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Agenda"
            Width: =620
            X: =40
            Y: =96
      - drp_Agenda:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="První úroveň hierarchie: oblast činnosti daná zákonem nebo vnitřním předpisem, vlastníkem je sekce. Výběr agendy určuje, které procesy se nabídnou níž. Když agendu změníš, proces i dílčí proces se vynulují — kombinace z různých agend neexistuje."'
            AllowEmptySelection: =true
            Default: =If(varNova, "", LookUp(colAgendy, Title = Left(varDpKod, 2), Title & " · " & nazev))
            Font: =Font.'Open Sans'
            Height: =40
            Items: =Distinct(colAgendy, Title & " · " & nazev)
            OnChange: |-
              =Reset(drp_Proces);
              Reset(drp_Dilci)
            Size: =13
            Width: =620
            X: =40
            Y: =120
      - lbl_l_Proces:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Proces"
            Width: =620
            X: =40
            Y: =172
      - drp_Proces:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Druhá úroveň: tok činností s definovaným vstupem a výstupem, vlastníkem je odbor. Nabízejí se jen procesy vybrané agendy. Dokud není vybraná agenda, je pole zašedlé — to není chyba, jen kaskáda čeká na nadřazenou úroveň."'
            AllowEmptySelection: =true
            DisplayMode: =If(IsBlank(drp_Agenda.Selected.Value), DisplayMode.Disabled, DisplayMode.Edit)
            Default: =If(varNova, "", LookUp(colProcesy, Title = Left(varDpKod, 5), Title & " · " & nazev))
            Font: =Font.'Open Sans'
            Height: =40
            Items: |-
              =Distinct(
                  Filter(colProcesy, agenda_kod = Left(drp_Agenda.Selected.Value, 2)),
                  Title & " · " & nazev
              )
            OnChange: =Reset(drp_Dilci)
            Size: =13
            Width: =620
            X: =40
            Y: =196
      - lbl_l_Dilci:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Dílčí proces"
            Width: =620
            X: =40
            Y: =248
      - drp_Dilci:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Třetí úroveň: vymezený úsek procesu, vlastníkem je odbor. Tenhle výběr je klíčový — určuje kód aktivity a její primární zařazení v procesní mapě. Nabízejí se jen dílčí procesy vybraného procesu. Aktivitu lze zařadit i do dalších dílčích procesů tlačítkem „Další dílčí procesy…“."'
            AllowEmptySelection: =true
            DisplayMode: =If(IsBlank(drp_Proces.Selected.Value), DisplayMode.Disabled, DisplayMode.Edit)
            Default: =If(varNova, "", LookUp(colDilci, Title = varDpKod, Title & " · " & nazev))
            Font: =Font.'Open Sans'
            Height: =40
            Items: |-
              =Distinct(
                  Filter(colDilci, proces_kod = Left(drp_Proces.Selected.Value, 5)),
                  Title & " · " & nazev
              )
            Size: =13
            Width: =620
            X: =40
            Y: =272
      - lbl_l_Nazev:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Aktivita — znění pro organizační řád"
            Width: =620
            X: =40
            Y: =324
      - txt_Nazev:
          Control: Classic/TextInput@2.3.2
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Znění činnosti tak, jak má stát v organizačním řádu — celá věta, ne heslo. Toto je nejnižší úroveň hierarchie a vykonává ji oddělení. Pole je bez omezení délky (nejdelší aktivita v datech má 220 znaků); pro řazení v seznamu se z něj automaticky odvozuje zkrácená verze na 150 znaků."'
            HintText: ="Znění činnosti tak, jak má být v organizačním řádu"
            Default: =If(varNova, "", varAktivita.nazev)
            Font: =Font.'Open Sans'
            Height: =88
            Mode: =TextMode.MultiLine
            Size: =13
            Width: =620
            X: =40
            Y: =348
      - lbl_l_Spolupracuje:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Spolupracuje"
            Width: =620
            X: =40
            Y: =448
      - txt_Spolupracuje:
          Control: Classic/TextInput@2.3.2
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Útvary, které se na aktivitě podílejí, ale nejsou za ni odpovědné. Víc útvarů odděl středníkem (712; 721). Odpovědný útvar patří do pole „Vykonává útvar“, ne sem."'
            HintText: ="Útvary, které se na aktivitě podílejí — např. 712; 721"
            Default: =If(varNova, "", varAktivita.spolupracuje)
            Font: =Font.'Open Sans'
            Height: =64
            Mode: =TextMode.MultiLine
            Size: =13
            Width: =620
            X: =40
            Y: =472
      - lbl_l_TextOR:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Text pro OŘ"
            Width: =620
            X: =40
            Y: =548
      - txt_TextOR:
          Control: Classic/TextInput@2.3.2
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Nepovinné. Místo pro formulaci, která půjde doslova do organizačního řádu, pokud se má lišit od znění aktivity. Dokud je prázdné, použije se při generování organizačního řádu znění aktivity. Generování samo je až druhá fáze projektu."'
            HintText: ="Nepovinné, plní se až pro generování organizačního řádu"
            Default: =If(varNova, "", varAktivita.text_pro_or)
            Font: =Font.'Open Sans'
            Height: =64
            Mode: =TextMode.MultiLine
            Size: =13
            Width: =620
            X: =40
            Y: =572
      - lbl_l_VlastnikAgendy:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Vlastník agendy (z číselníku)"
            Width: =620
            X: =700
            Y: =96
      - lbl_VlastnikAgendy:
          Control: Label@2.5.1
          Properties:
            Fill: =stylOkraj
            Font: =Font.'Open Sans'
            Height: =40
            PaddingLeft: =12
            Size: =13
            Text: |-
              =If(
                  IsBlank(drp_Agenda.Selected.Value),
                  "",
                  Coalesce(
                      LookUp(colAgendy, Title = Left(drp_Agenda.Selected.Value, 2), vlastnik),
                      "— v rejstříku nevyplněno —"
                  )
              )
            VerticalAlign: =VerticalAlign.Middle
            Width: =620
            X: =700
            Y: =120
      - lbl_l_VlastnikProcesu:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Vlastník procesu (z číselníku)"
            Width: =620
            X: =700
            Y: =172
      - lbl_VlastnikProcesu:
          Control: Label@2.5.1
          Properties:
            Fill: =stylOkraj
            Font: =Font.'Open Sans'
            Height: =40
            PaddingLeft: =12
            Size: =13
            Text: |-
              =If(
                  IsBlank(drp_Proces.Selected.Value),
                  "",
                  Coalesce(
                      LookUp(colProcesy, Title = Left(drp_Proces.Selected.Value, 5), vlastnik),
                      "— v rejstříku nevyplněno —"
                  )
              )
            VerticalAlign: =VerticalAlign.Middle
            Width: =620
            X: =700
            Y: =196
      - lbl_l_VlastnikDilci:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Vlastník dílčího procesu (z číselníku)"
            Width: =620
            X: =700
            Y: =248
      - lbl_VlastnikDilci:
          Control: Label@2.5.1
          Properties:
            Fill: =stylOkraj
            Font: =Font.'Open Sans'
            Height: =40
            PaddingLeft: =12
            Size: =13
            Text: |-
              =If(
                  IsBlank(drp_Dilci.Selected.Value),
                  "",
                  Coalesce(
                      LookUp(colDilci, Title = Left(drp_Dilci.Selected.Value, 9), vlastnik),
                      "— v rejstříku nevyplněno —"
                  )
              )
            VerticalAlign: =VerticalAlign.Middle
            Width: =620
            X: =700
            Y: =272
      - lbl_l_Utvar:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Vykonává útvar"
            Width: =300
            X: =700
            Y: =324
      - drp_UtvarDetail:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Útvar, který aktivitu vykonává a nese za ni odpovědnost. Vybírá se z číselníku útvarů, aby se do evidence nedostaly překlepy — podle tohoto pole se filtruje seznam a jednou z něj bude sestavený text organizačního řádu. Chybí-li útvar v nabídce, doplní ho správce do listu Útvary."'
            AllowEmptySelection: =true
            Default: |-
              =If(
                  varNova,
                  "",
                  LookUp(colUtvary, Title = varAktivita.vykonava, Title & " · " & nazev)
              )
            Font: =Font.'Open Sans'
            Height: =40
            Items: =Distinct(Filter(colUtvary, uroven.Value <> "sekce"), Title & " · " & nazev)
            Size: =13
            Width: =300
            X: =700
            Y: =348
      - lbl_l_Sekce:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Sekce"
            Width: =300
            X: =1020
            Y: =324
      - drp_SekceDetail:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Sekce, pod kterou vykonávající útvar patří. Vybírá se z číselníku útvarů (úroveň sekce). Podle sekce se dělí evidence mezi sekční správce procesního rámce a filtruje se seznam aktivit."'
            AllowEmptySelection: =true
            Default: |-
              =If(
                  varNova,
                  "",
                  LookUp(colUtvary, Title = varAktivita.sekce, Title & " · " & nazev)
              )
            Font: =Font.'Open Sans'
            Height: =40
            Items: =Distinct(Filter(colUtvary, uroven.Value = "sekce"), Title & " · " & nazev)
            Size: =13
            Width: =300
            X: =1020
            Y: =348
      - lbl_l_Predpis:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Vnitřní předpis"
            Width: =620
            X: =700
            Y: =424
      - txt_Predpis:
          Control: Classic/TextInput@2.3.2
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Vnitřní předpis, o který se aktivita opírá — např. SP 10/2021. Víc předpisů odděl středníkem. Slouží jako doklad, proč se činnost vykonává; při revizi předpisu je podle tohoto pole vidět, kterých aktivit se změna týká."'
            HintText: ="Víc předpisů oddělte středníkem — např. SP 10/2021; VP 02/2016"
            Default: =If(varNova, "", varAktivita.vnitrni_predpis)
            Font: =Font.'Open Sans'
            Height: =64
            Mode: =TextMode.MultiLine
            Size: =13
            Width: =620
            X: =700
            Y: =448
      - lbl_l_Stav:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Stav"
            Width: =300
            X: =700
            Y: =524
      - drp_StavDetail:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Pracovní = rozpracováno, schváleno = potvrzené znění pro organizační řád. Přepnutím na „schváleno“ dáváš najevo, že formulace prošla vlastníkem procesu. Automatické schvalování s notifikacemi součástí této fáze není."'
            Default: =If(varNova, "pracovní", varAktivita.stav.Value)
            Font: =Font.'Open Sans'
            Height: =40
            Items: =["pracovní", "schváleno"]
            Size: =13
            Width: =300
            X: =700
            Y: =548
      - lbl_l_Vazby:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Zařazení do dílčích procesů"
            Visible: =!varNova
            Width: =240
            X: =1020
            Y: =524
      - btn_Vazby:
          Control: Classic/Button@2.2.0
          Properties:
            HoverFill: =stylRadekHover
            PressedFill: =stylRadekVybrany
            HoverColor: =stylAkce
            BorderColor: =stylOkraj
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Otevře přiřazení aktivity do DALŠÍCH dílčích procesů. Standardně aktivita patří do jednoho (vybraného výše) — ale metodika připouští, že tutéž činnost vykonává útvar ve víc dílčích procesech. Pak ji přidej i tam a v mapě se objeví v obou větvích, aniž by vznikl duplicitní záznam."'
            Color: =stylPrimarni
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =40
            OnSelect: =Navigate(scr_Vazby, ScreenTransition.Cover)
            Size: =13
            Text: ="Další dílčí procesy…"
            Visible: =!varNova
            Width: =240
            X: =1020
            Y: =548
      - btn_Ulozit:
          Control: Classic/Button@2.2.0
          Properties:
            HoverFill: =stylAkceHover
            PressedFill: =stylAkceStisk
            HoverColor: =RGBA(255, 255, 255, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            FocusedBorderColor: =stylPrimarni
            FocusedBorderThickness: =2
            Tooltip: '="Uloží změny. U nové aktivity se teprve teď přidělí kód AA-BB-CCC-DDDD: AA agenda, BB proces, CCC dílčí proces, DDDD první volné čtyřčíslí v tom dílčím procesu. Zároveň se založí primární vazba do rejstříku. Jednou přidělený kód se už nikdy nemění, ani při přesunu do jiného dílčího procesu - vazby v rejstříku i v mapě na něm stojí. Vlastník součástí kódu není, eviduje se zvlášť. Když mezitím stejný kód zabere někdo jiný, uložení se neprovede a dostaneš hlášku - stačí uložit znovu."'
            Fill: =stylAkce
            Font: =Font.'Open Sans'
            Height: =44
            OnSelect: |-
              =Set(varChyba, "");
              If(IsBlank(drp_Dilci.Selected.Value), Set(varChyba, "Vyber dílčí proces."));
              If(IsBlank(txt_Nazev.Text), Set(varChyba, "Vyplň znění aktivity."));
              If(
                  !IsBlank(varChyba),
                  Notify(varChyba, NotificationType.Warning),
                  Set(varStaryDp, If(varNova, "", varAktivita.dilci_proces_kod));
                  Set(varPrefix, Left(drp_Dilci.Selected.Value, 9) & "-");
                  Set(
                      varNovyKod,
                      If(
                          varNova,
                          varPrefix & Right(
                              "000" & (Value(
                                  Right(
                                      First(Sort(Filter(Aktivity, StartsWith(Title, varPrefix)), Title, SortOrder.Descending)).Title,
                                      4
                                  )
                              ) + 1),
                              4
                          ),
                          varAktivita.Title
                      )
                  );
                  If(
                      varNova && !IsBlank(LookUp(Aktivity, Title = varNovyKod)),
                      Notify("Kód " & varNovyKod & " mezitím někdo použil, zkus uložit znovu.", NotificationType.Warning),
                      IfError(
                          Patch(
                              Aktivity,
                              If(varNova, Defaults(Aktivity), varAktivita),
                              {
                                  Title: varNovyKod,
                                  nazev: txt_Nazev.Text,
                                  nazev_kratky: Left(txt_Nazev.Text, 150),
                                  dilci_proces_kod: Left(drp_Dilci.Selected.Value, 9),
                                  vykonava: Left(drp_UtvarDetail.Selected.Value, Find(" ·", drp_UtvarDetail.Selected.Value & " ·") - 1),
                                  spolupracuje: txt_Spolupracuje.Text,
                                  vnitrni_predpis: txt_Predpis.Text,
                                  text_pro_or: txt_TextOR.Text,
                                  sekce: Left(drp_SekceDetail.Selected.Value, Find(" ·", drp_SekceDetail.Selected.Value & " ·") - 1),
                                  stav: { Value: drp_StavDetail.Selected.Value },
                                  datum_aktualizace: Now()
                              }
                          );
                          If(
                              varNova || varStaryDp <> Left(drp_Dilci.Selected.Value, 9),
                              RemoveIf('Vazba aktivita–dílčí proces', aktivita_kod = varNovyKod, primarni.Value = "ano");
                              Patch(
                                  'Vazba aktivita–dílčí proces',
                                  Defaults('Vazba aktivita–dílčí proces'),
                                  {
                                      Title: varNovyKod & "__" & Left(drp_Dilci.Selected.Value, 9),
                                      aktivita_kod: varNovyKod,
                                      dilci_proces_kod: Left(drp_Dilci.Selected.Value, 9),
                                      primarni: { Value: "ano" }
                                  }
                              )
                          );
                          Notify("Uloženo jako " & varNovyKod & ".", NotificationType.Success);
                          Navigate(scr_Seznam, ScreenTransition.UnCover),
                          Notify("Uložení selhalo: " & FirstError.Message, NotificationType.Error)
                      )
                  )
              )
            Size: =14
            Text: ="Uložit"
            Width: =200
            X: =700
            Y: =664
      - btn_Smazat:
          Control: Classic/Button@2.2.0
          Properties:
            HoverFill: =stylNebezpeci
            HoverColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylNebezpeci
            BorderColor: =stylNebezpeci
            FocusedBorderColor: =stylNebezpeci
            FocusedBorderThickness: =2
            Tooltip: '="Smaže aktivitu i všechna její zařazení do dílčích procesů. Nevratné. Číselník agend, procesů a dílčích procesů zůstane nedotčený — maže se jen tato jedna aktivita."'
            Color: =stylNebezpeci
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =44
            OnSelect: |-
              =IfError(
                  RemoveIf('Vazba aktivita–dílčí proces', aktivita_kod = varAktivita.Title);
                  Remove(Aktivity, varAktivita);
                  Notify("Aktivita " & varAktivita.Title & " smazána i s vazbami.", NotificationType.Success);
                  Navigate(scr_Seznam, ScreenTransition.UnCover),
                  Notify("Smazání selhalo: " & FirstError.Message, NotificationType.Error)
              )
