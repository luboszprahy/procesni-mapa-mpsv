# Obrazovka 3 — přiřazení aktivity do dalších dílčích procesů (M:N).
# Vlevo existující vazby (delegovaný dotaz podle indexovaného aktivita_kod),
# vpravo výběr z číselníku dílčích procesů (kolekce, hledání tedy delegaci neřeší).
Screens:
  scr_Vazby:
    Properties:
      Fill: =stylPlocha
      LoadingSpinnerColor: =stylAkce
    Children:
      - rec_HlavickaV:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPrimarni
            Height: =48
            Width: =Parent.Width
            X: =0
            Y: =0
      - ico_ZpetV:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =40
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.18)
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate(scr_Detail, ScreenTransition.UnCover)
            PaddingBottom: =10
            PaddingLeft: =10
            PaddingRight: =10
            PaddingTop: =10
            PressedFill: =RGBA(255, 255, 255, 0.28)
            Tooltip: '="Zpět na detail aktivity. Přiřazení dílčích procesů se ukládá hned při kliknutí, takže se odchodem nic neztratí."'
            Width: =40
            X: =16
            Y: =4
      - lbl_NadpisV:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =14 + varFs
            Text: |-
              ="Dílčí procesy aktivity " & varAktivita.Title
            VerticalAlign: =VerticalAlign.Middle
            Width: =900
            X: =68
            Y: =8
      - lbl_l_Vysvetleni:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =40
            Size: =10 + varFs
            Text: |-
              ="Táž aktivita se může vykonávat ve víc dílčích procesech. Vlevo je seznam, kam už je zařazená; „primární“ je ta z detailu aktivity a odebrat ji tady nelze. Vpravo vyberte další dílčí proces tlačítkem +."
            Width: =1220
            X: =40
            Y: =56
      - lbl_l_Prirazene:
          Control: Label@2.5.1
          Properties:
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =13 + varFs
            Text: ="Přiřazeno"
            Width: =620
            X: =40
            Y: =108
      - gal_Vazby:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Height: =Parent.Height - Self.Y - 40
            Items: |-
              =Filter('Vazba aktivita–dílčí proces', aktivita_kod = varAktivita.Title)
            TemplateSize: =64 + varFs * 4
            Width: =620
            X: =40
            Y: =140
          Children:
            - rec_RadekVazby:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  HoverFill: =stylRadekHover
                  PressedFill: =stylRadekVybrany
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - lbl_VazbaKod:
                Control: Label@2.5.1
                Properties:
                  Color: =stylPrimarni
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =20 + varFs
                  OnSelect: =Select(Parent)
                  Size: =11 + varFs
                  Text: =ThisItem.dilci_proces_kod
                  Width: =140
                  X: =16
                  Y: =10
            - lbl_VazbaNazev:
                Control: Label@2.5.1
                Properties:
                  Font: =Font.'Open Sans'
                  Height: =36
                  OnSelect: =Select(Parent)
                  Size: =11 + varFs
                  Text: |-
                    =LookUp(colDilci, Title = ThisItem.dilci_proces_kod).nazev
                  Width: =Parent.TemplateWidth - 240
                  X: =16
                  Y: =28 + varFs
            - lbl_VazbaPrimarni:
                Control: Label@2.5.1
                Properties:
                  Color: =stylUspech
                  Font: =Font.'Open Sans'
                  Height: =20
                  OnSelect: =Select(Parent)
                  Size: =10 + varFs
                  Text: |-
                    =If(ThisItem.primarni.Value = "ano", "primární", "")
                  Width: =100
                  X: =Parent.TemplateWidth - 220
                  Y: =22
            - ico_Odebrat:
                Control: Classic/Icon@2.5.0
                Properties:
                  HoverColor: =stylAkce
                  PressedColor: =stylAkceStisk
                  Tooltip: '="Odebere aktivitu z tohoto dílčího procesu. Samotná aktivita zůstane — mizí jen její zařazení do této větve mapy. Primární zařazení (označené „primární“) tímto způsobem odebrat nelze; to se mění výběrem dílčího procesu v detailu aktivity."'
                  Color: =stylNebezpeci
                  Height: =36
                  Icon: =Icon.Trash
                  OnSelect: |-
                    =IfError(
                        Remove('Vazba aktivita–dílčí proces', ThisItem);
                        Notify("Vazba odebrána.", NotificationType.Success, varNotifyMs),
                        Notify("Odebrání selhalo: " & FirstError.Message, NotificationType.Error, varNotifyChybaMs)
                    )
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                  Visible: =ThisItem.primarni.Value <> "ano"
                  Width: =36
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =14
            - sep_Vazba:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =stylOkraj
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1
      - lbl_l_Nabidka:
          Control: Label@2.5.1
          Properties:
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =13 + varFs
            Text: ="Přidat další dílčí proces"
            Width: =620
            X: =700
            Y: =108
      - txt_HledatDp:
          Control: Classic/TextInput@2.3.2
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Hledá v kódu i v názvu dílčího procesu, kdekoli uvnitř textu. Prázdné pole zobrazí celý číselník (250 dílčích procesů), takže je rychlejší napsat kus názvu než scrollovat."'
            Default: =""
            Font: =Font.'Open Sans'
            Height: =32
            HintText: ="Hledat v názvu nebo kódu"
            Size: =11 + varFs
            Width: =620
            X: =700
            Y: =140
      - gal_Nabidka:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Height: =Parent.Height - Self.Y - 40
            Items: |-
              =If(
                  IsBlank(txt_HledatDp.Text),
                  colDilci,
                  Search(colDilci, txt_HledatDp.Text, Title, nazev)
              )
            TemplateSize: =64 + varFs * 4
            Width: =620
            X: =700
            Y: =192
          Children:
            - rec_RadekNabidka:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  HoverFill: =stylRadekHover
                  PressedFill: =stylRadekVybrany
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - lbl_DpKod:
                Control: Label@2.5.1
                Properties:
                  Color: =stylPrimarni
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =20 + varFs
                  OnSelect: =Select(Parent)
                  Size: =11 + varFs
                  Text: =ThisItem.Title
                  Width: =140
                  X: =16
                  Y: =10
            - lbl_DpNazev:
                Control: Label@2.5.1
                Properties:
                  Font: =Font.'Open Sans'
                  Height: =36
                  OnSelect: =Select(Parent)
                  Size: =11 + varFs
                  Text: =ThisItem.nazev
                  Width: =Parent.TemplateWidth - 120
                  X: =16
                  Y: =28 + varFs
            - ico_Pridat:
                Control: Classic/Icon@2.5.0
                Properties:
                  HoverColor: =stylAkce
                  PressedColor: =stylAkceStisk
                  Tooltip: '="Přiřadí aktivitu i do tohoto dílčího procesu. Nevzniká kopie: je to pořád tatáž aktivita s jedním kódem, jen se v procesní mapě objeví ve víc větvích. Používá se, když tutéž činnost útvar vykonává v několika dílčích procesech."'
                  Color: =stylAkce
                  Height: =36
                  Icon: =Icon.Add
                  OnSelect: |-
                    =If(
                        !IsBlank(LookUp('Vazba aktivita–dílčí proces', Title = varAktivita.Title & "__" & ThisItem.Title)),
                        Notify("Aktivita už v tomto dílčím procesu je.", NotificationType.Warning, varNotifyMs),
                        IfError(
                            Patch(
                                'Vazba aktivita–dílčí proces',
                                Defaults('Vazba aktivita–dílčí proces'),
                                {
                                    Title: varAktivita.Title & "__" & ThisItem.Title,
                                    aktivita_kod: varAktivita.Title,
                                    dilci_proces_kod: ThisItem.Title,
                                    primarni: { Value: "ne" }
                                }
                            );
                            Notify("Přidáno do " & ThisItem.Title & ".", NotificationType.Success, varNotifyMs),
                            Notify("Přidání selhalo: " & FirstError.Message, NotificationType.Error, varNotifyChybaMs)
                        )
                    )
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                  Width: =36
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =14
            - sep_Dp:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =stylOkraj
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1
