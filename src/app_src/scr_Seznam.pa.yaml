# Obrazovka 1 — seznam aktivit.
#
# Rozvržení podle vzoru ze Správy notifikací (input/snimky/vzor-notifikace-2.png):
# tmavý navbar s identitou → bílá souhrnná karta s čísly a akcemi → řádek
# hledání s chipy → tabulková galerie s řaditelnou hlavičkou. Plocha je světlá,
# oddělení tenkými linkami, žádné barevné bloky.
#
# HLEDÁNÍ: Search() hledá řetězec kdekoli uvnitř názvu i kódu, ale NENÍ
# delegovatelné. Je proto navlečené AŽ NA VÝSLEDEK delegovaného Filter —
# sekce, útvar a stav zúží dotaz na serveru a fulltext běží nad tím, co
# přijde. Do 2 000 aktivit (dnes 46) je výsledek úplný; nad tím hledá jen
# v prvním okně, a proto na to chip upozorní. StartsWith by delegovatelný
# byl, ale hledal by jen od začátku názvu — vědomá výměna, viz VYJIMKY_DELEGACE
# v check_app.py.
#
# Čísla v souhrnné kartě se počítají z gal_Aktivity.AllItems, ne z listu:
# CountRows nad SharePointem se nedeleguje a nad 2 000 aktivitami by tiše lhal.
# Popisky proto říkají „zobrazeno", ne „celkem".
#
# Řazení drží varRazeni (kod / nazev / utvar / datum) a varRazeniAsc; přepíná
# se klikem na hlavičku sloupce. Aktivní sloupec je modrý a nese šipku směru.
# Sort je uvnitř každé větve Switch zvlášť, aby dotaz zůstal delegovatelný —
# Sort s vypočítaným výrazem by delegaci shodil.
Screens:
  scr_Seznam:
    Properties:
      Fill: =stylPlocha
      LoadingSpinnerColor: =stylAkce
    Children:
      # ---------- navbar ----------
      - rec_Navbar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPrimarni
            Height: =64
            Width: =Parent.Width
            X: =0
            Y: =0
      - lbl_AppNazev:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =15
            Text: ="Procesní mapa MPSV"
            VerticalAlign: =VerticalAlign.Middle
            Width: =240
            X: =40
            Y: =0
      - lbl_ZalozkaPrehled:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(214, 220, 234, 1)
            Font: =Font.'Open Sans'
            Height: =64
            HoverColor: =RGBA(255, 255, 255, 1)
            OnSelect: =Navigate(scr_Dashboard, ScreenTransition.None)
            PressedColor: =RGBA(255, 255, 255, 1)
            Size: =13
            Text: ="Přehled"
            Tooltip: '="Zpět na přehled s rozpadem rejstříku."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =120
            X: =300
            Y: =0
      - lbl_Zalozka:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =13
            Text: ="Seznam aktivit"
            VerticalAlign: =VerticalAlign.Middle
            Width: =160
            X: =428
            Y: =0
      - rec_ZalozkaPodtrzeni:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =3
            Width: =160
            X: =428
            Y: =58
      # Velikost písma (varFs = 0 / 2 / 4) vpravo u jména uživatele.
      # Mění se text
      # v seznamu a ve stromu a výška jejich řádků — prvky uvnitř mají
      # Height = TemplateHeight - 1, takže rostou s řádkem a neořežou se.
      # Sloupec kódu se rozšiřuje spolu s písmem, jinak by se při XL
      # oříznulo AA-BB-CCC-DDDD.
      - btn_PismoS1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.35)
            BorderThickness: =1
            Color: =If(varFs = 0, RGBA(255, 255, 255, 1), RGBA(214, 220, 234, 1))
            Fill: =If(varFs = 0, RGBA(255, 255, 255, 0.22), RGBA(0, 0, 0, 0))
            FocusedBorderColor: =RGBA(255, 255, 255, 1)
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.14)
            OnSelect: =Set(varFs, 0)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 0.30)
            Size: =10
            Text: ="A"
            Tooltip: '="Nejmenší text, nejvíc řádků na obrazovku."'
            Width: =34
            X: =Parent.Width - 502
            Y: =16
      - btn_PismoS2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.35)
            BorderThickness: =1
            Color: =If(varFs = 2, RGBA(255, 255, 255, 1), RGBA(214, 220, 234, 1))
            Fill: =If(varFs = 2, RGBA(255, 255, 255, 0.22), RGBA(0, 0, 0, 0))
            FocusedBorderColor: =RGBA(255, 255, 255, 1)
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.14)
            OnSelect: =Set(varFs, 2)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 0.30)
            Size: =13
            Text: ="A"
            Tooltip: '="Střední text a vyšší řádky. Výchozí nastavení."'
            Width: =38
            X: =Parent.Width - 464
            Y: =16
      - btn_PismoS3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.35)
            BorderThickness: =1
            Color: =If(varFs = 4, RGBA(255, 255, 255, 1), RGBA(214, 220, 234, 1))
            Fill: =If(varFs = 4, RGBA(255, 255, 255, 0.22), RGBA(0, 0, 0, 0))
            FocusedBorderColor: =RGBA(255, 255, 255, 1)
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.14)
            OnSelect: =Set(varFs, 4)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 0.30)
            Size: =16
            Text: ="A"
            Tooltip: '="Největší text. Nejlépe se čte, ale na jednu obrazovku se vejde nejmíň řádků a nejdelší názvy se můžou oříznout."'
            Width: =42
            X: =Parent.Width - 422
            Y: =16
      - lbl_Uzivatel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =12
            Text: =User().FullName
            VerticalAlign: =VerticalAlign.Bottom
            Width: =320
            X: =Parent.Width - 360
            Y: =10
      - lbl_UzivatelMail:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(214, 220, 234, 1)
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: =User().Email
            VerticalAlign: =VerticalAlign.Top
            Width: =320
            X: =Parent.Width - 360
            Y: =34
      # ---------- souhrnná karta ----------
      - rec_Souhrn:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylKarta
            Height: =84
            Width: =Parent.Width - 80
            X: =40
            Y: =80
      - rec_SouhrnOkraj:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylOkraj
            Height: =1
            Width: =Parent.Width - 80
            X: =40
            Y: =163
      - lbl_SouhrnNadpis:
          Control: Label@2.5.1
          Properties:
            Color: =stylText
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =84
            Size: =15
            Text: ="Aktivity"
            VerticalAlign: =VerticalAlign.Middle
            Width: =180
            X: =64
            Y: =80
      - lbl_l_Zobrazeno:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =18
            Size: =10
            Text: ="Zobrazeno"
            Width: =120
            X: =264
            Y: =98
      - lbl_v_Zobrazeno:
          Control: Label@2.5.1
          Properties:
            Color: =stylText
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =15
            Text: =CountRows(gal_Aktivity.AllItems)
            VerticalAlign: =VerticalAlign.Middle
            Width: =120
            X: =264
            Y: =118
      - lbl_l_Schvaleno:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =18
            Size: =10
            Text: ="Schváleno"
            Width: =120
            X: =404
            Y: =98
      - lbl_v_Schvaleno:
          Control: Label@2.5.1
          Properties:
            Color: =stylUspech
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =15
            Text: |-
              =CountRows(Filter(gal_Aktivity.AllItems, stav.Value = "schváleno"))
            VerticalAlign: =VerticalAlign.Middle
            Width: =120
            X: =404
            Y: =118
      - lbl_l_Pracovni:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =18
            Size: =10
            Text: ="Pracovní"
            Width: =120
            X: =544
            Y: =98
      - lbl_v_Pracovni:
          Control: Label@2.5.1
          Properties:
            Color: =stylPozor
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =15
            Text: |-
              =CountRows(Filter(gal_Aktivity.AllItems, stav.Value = "pracovní"))
            VerticalAlign: =VerticalAlign.Middle
            Width: =120
            X: =544
            Y: =118
      - btn_ObnovitMapu:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =stylAkce
            DisplayMode: =If(varPublikuji, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =stylKarta
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =40
            HoverColor: =stylAkce
            HoverFill: =stylRadekHover
            OnSelect: |-
              =Set(varPublikuji, true);
              IfError(
                  MapaPublishFlow.Run();
                  Notify("Publikace mapy spuštěna. Přegenerování chvíli trvá - pak mapu otevři tlačítkem Zobrazit v HTML.", NotificationType.Information),
                  Notify("Publikace selhala: " & FirstError.Message, NotificationType.Error)
              );
              Set(varPublikuji, false)
            PressedColor: =stylAkceStisk
            PressedFill: =stylRadekVybrany
            Size: =13
            Text: ="Obnovit mapu"
            Tooltip: '="Přegeneruje publikovanou HTML mapu z dnešního obsahu rejstříku. Mapa data nečte živě - ukazuje stav k okamžiku poslední publikace, takže po každé dávce úprav ji je potřeba obnovit. Běh trvá několik sekund a probíhá na pozadí; hlášení potvrzuje spuštění, ne dokončení. Výsledek se ukáže po chvíli tlačítkem Zobrazit v HTML."'
            Width: =176
            X: =btn_Mapa.X - Self.Width - 12
            Y: =102
      - btn_Mapa:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =stylAkce
            Fill: =stylKarta
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =40
            HoverColor: =stylAkce
            HoverFill: =stylRadekHover
            OnSelect: =Launch(varMapaUrl, {}, LaunchTarget.New)
            PressedColor: =stylAkceStisk
            PressedFill: =stylRadekVybrany
            Size: =13
            Text: ="Zobrazit v HTML"
            Tooltip: '="Otevře publikovanou procesní mapu v novém okně prohlížeče. Mapa ukazuje celý rejstřík jako strom agenda - proces - dílčí proces - aktivita a umí fulltextové hledání napříč všemi aktivitami bez ohledu na jejich počet. Data v mapě jsou k okamžiku poslední publikace, ne živá."'
            Visible: =!IsBlank(varMapaUrl)
            Width: =176
            X: =Parent.Width - 296 - Self.Width - 12
            Y: =102
      - btn_Nova:
          Control: Classic/Button@2.2.0
          Properties:
            Fill: =stylAkce
            FocusedBorderColor: =stylPrimarni
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =40
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =stylAkceHover
            OnSelect: |-
              =Set(varDetailZpet, "seznam");
              Set(varNova, true);
              Set(varAktivita, Blank());
              Navigate(scr_Detail, ScreenTransition.Cover)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylAkceStisk
            Size: =13
            Text: ="+ Nová aktivita"
            Tooltip: '="Založí novou aktivitu. Kód AA-BB-CCC-DDDD se nezadává - přidělí se sám při uložení: AA agenda, BB proces, CCC dílčí proces, DDDD pořadí aktivity v tom dílčím procesu. Aktivita dostane první volné čtyřčíslí. Jednou přidělený kód se už nikdy nemění, ani při přesunu do jiného dílčího procesu, ani když se před ní něco smaže - vazby v rejstříku i v mapě na něm stojí. Vlastník (sekce, odbor, oddělení) součástí kódu není, eviduje se zvlášť, aby organizační změny kódy nepřečíslovaly. Povinné je znění aktivity a dílčí proces, ostatní pole jde doplnit později."'
            Width: =176
            X: =Parent.Width - 296
            Y: =102
      # ---------- hledání a filtry ----------
      - lbl_f_Hledat:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =14
            Size: =9
            Text: ="Hledat"
            Width: =196
            X: =40
            Y: =182
      - txt_Hledat:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HintText: ="část názvu nebo kódu…"
            HoverBorderColor: =stylAkce
            Size: =11
            Tooltip: '="Najde aktivity, které hledaný řetězec obsahují kdekoli v názvu nebo v kódu - nemusí jím začínat. Velikost písmen nerozhoduje. Prázdné pole znamená bez omezení. Pozor: fulltext se počítá až nad tím, co vrátí ostatní filtry, takže nad 2 000 aktivitami prohledá jen první okno. Zúžit sekcí nebo útvarem to spolehlivě vyřeší; fulltext přes celý rejstřík bez omezení nabízí publikovaná HTML mapa."'
            Width: =196
            X: =40
            Y: =198
      - lbl_f_Sekce:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =14
            Size: =9
            Text: ="Sekce"
            Width: =124
            X: =246
            Y: =182
      - drp_Sekce:
          Control: Classic/DropDown@2.3.1
          Properties:
            Default: ="(vše)"
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverBorderColor: =stylAkce
            Items: =colSekceNabidka
            OnChange: |-
              =Set(
                  varSekceKod,
                  If(
                      drp_Sekce.Selected.Value = "(vše)",
                      "",
                      Left(drp_Sekce.Selected.Value, Find(" ·", drp_Sekce.Selected.Value & " ·") - 1)
                  )
              )
            Size: =11
            Tooltip: '="Filtruje podle sekce, pod kterou vykonávající útvar patří. Nabídka se plní z číselníku útvarů, takže je úplná bez ohledu na to, kolik aktivit v rejstříku je. Volba (vše) filtr vypne. Filtry se sčítají: sekce, útvar, stav i hledání platí najednou."'
            Width: =124
            X: =246
            Y: =198
      - lbl_f_Utvar:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =14
            Size: =9
            Text: ="Vykonává útvar"
            Width: =160
            X: =380
            Y: =182
      - drp_Utvar:
          Control: Classic/DropDown@2.3.1
          Properties:
            Default: ="(vše)"
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverBorderColor: =stylAkce
            Items: =colUtvarNabidka
            OnChange: |-
              =Set(
                  varUtvarKod,
                  If(
                      drp_Utvar.Selected.Value = "(vše)",
                      "",
                      Left(drp_Utvar.Selected.Value, Find(" ·", drp_Utvar.Selected.Value & " ·") - 1)
                  )
              )
            Size: =11
            Tooltip: '="Filtruje podle útvaru, který aktivitu vykonává. Nabídka je z číselníku útvarů ve tvaru kód · název a obsahuje odbory i oddělení. Chceš-li vidět všechny aktivity jednoho útvaru pro potřeby organizačního řádu, nastav sem útvar a ostatní filtry nech na (vše)."'
            Width: =160
            X: =380
            Y: =198
      - lbl_f_Stav:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =14
            Size: =9
            Text: ="Stav"
            Width: =112
            X: =550
            Y: =182
      - drp_Stav:
          Control: Classic/DropDown@2.3.1
          Properties:
            Default: ="(vše)"
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverBorderColor: =stylAkce
            Items: =["(vše)", "pracovní", "schváleno"]
            Size: =11
            Tooltip: '="Pracovní je rozpracovaný záznam, na kterém se ještě pracuje. Schváleno je potvrzené znění, které smí jít do organizačního řádu. Stav se přepíná v detailu aktivity; schvalovací kolečko s notifikacemi zatím není součástí řešení."'
            Width: =112
            X: =550
            Y: =198
      # Sloupec s kódem jde skrýt. Řazení podle kódu zůstává dostupné i pak —
      # skrývá se zobrazení, ne data.
      - btn_Kod:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =If(varZobrazitKod, stylAkce, stylTextSlaby)
            Fill: =If(varZobrazitKod, stylRadekVybrany, stylKarta)
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =stylAkce
            HoverFill: =stylRadekHover
            OnSelect: =Set(varZobrazitKod, !varZobrazitKod)
            PressedColor: =stylAkceStisk
            PressedFill: =stylRadekVybrany
            Size: =11
            Text: |-
              =If(varZobrazitKod, "Kód: zobrazen", "Kód: skrytý")
            Tooltip: '="Skryje nebo zobrazí sloupec s identifikačním kódem. Kód se jen přestane vypisovat - řadit podle něj i hledat v něm jde dál a v detailu aktivity zůstává vidět. Ve výchozím stavu je zobrazený."'
            Width: =116
            X: =672
            Y: =198
      # Vynuluje všechny čtyři filtry naráz. Reset() vrátí ovládacím prvkům
      # výchozí hodnotu, ale kódy sekce a útvaru drží proměnné plněné až
      # v OnChange — a ten se při Resetu nespustí, takže se musí smazat zvlášť.
      - btn_ZobrazitVse:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =stylAkce
            DisplayMode: |-
              =If(
                  IsBlank(txt_Hledat.Text)
                  && IsBlank(varSekceKod)
                  && IsBlank(varUtvarKod)
                  && !varOsirele
                  && drp_Stav.Selected.Value = "(vše)",
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =stylKarta
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =stylAkce
            HoverFill: =stylRadekHover
            OnSelect: |-
              =Reset(txt_Hledat);
              Reset(drp_Sekce);
              Reset(drp_Utvar);
              Reset(drp_Stav);
              Set(varSekceKod, "");
              Set(varUtvarKod, "");
              Set(varOsirele, false)
            PressedColor: =stylAkceStisk
            PressedFill: =stylRadekVybrany
            Size: =11
            Text: ="Zobrazit vše"
            Tooltip: '="Vynuluje hledání, sekci, útvar, stav i přepínač osiřelých naráz - v galerii zůstane celý rejstřík. Dokud není zapnutý žádný filtr, je tlačítko neaktivní. Zobrazení kódu se tím nemění, to je samostatný přepínač."'
            Width: =112
            X: =798
            Y: =198
      # Osiřelá aktivita = její dílčí proces v číselníku není. Vzniká smazáním
      # dílčího procesu a v mapě se nezobrazí, protože se nemá kam zařadit.
      # Predikát se nedeleguje (LookUp do kolekce), proto je navlečený AŽ NA
      # VÝSLEDEK delegovaného dotazu — stejný kompromis jako fulltext a chip
      # vpravo na to upozorňuje.
      - btn_Osirele:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =If(varOsirele, stylPozor, stylOkraj)
            BorderThickness: =1
            Color: =If(varOsirele, RGBA(255, 255, 255, 1), stylPozor)
            Fill: =If(varOsirele, stylPozor, stylKarta)
            FocusedBorderColor: =stylPozor
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =stylPozor
            OnSelect: =Set(varOsirele, !varOsirele)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylPozor
            Size: =11
            Text: |-
              =If(varOsirele, "Jen osiřelé ✓", "Jen osiřelé")
            Tooltip: '="Nechá jen aktivity, jejichž dílčí proces v číselníku neexistuje. Takové vznikají smazáním dílčího procesu, do mapy se nedostanou a je potřeba je buď přeřadit v detailu, nebo smazat. Bez zapnutého přepínače se chovají jako každá jiná aktivita, takže bez něj je nikdo nenajde."'
            Width: =120
            X: =920
            Y: =198
      - rec_ChipPocet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPlocha
            Height: =32
            Width: =140
            X: =Parent.Width - 320
            Y: =198
      - lbl_ChipPocet:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =32
            Size: =11
            Text: |-
              =CountRows(gal_Aktivity.AllItems) & " aktivit"
            Tooltip: '="Kolik řádků je právě v galerii po započtení všech filtrů."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =140
            X: =Parent.Width - 320
            Y: =198
      - rec_ChipFiltr:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPlocha
            Height: =32
            Width: =136
            X: =Parent.Width - 176
            Y: =198
      - lbl_ChipFiltr:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: |-
              =If(
                  (!IsBlank(txt_Hledat.Text) || varOsirele)
                  && IsBlank(varSekceKod) && IsBlank(varUtvarKod),
                  stylPozor,
                  stylTextSlaby
              )
            Font: =Font.'Open Sans'
            Height: =32
            Size: =11
            Text: |-
              =If(
                  (!IsBlank(txt_Hledat.Text) || varOsirele)
                  && IsBlank(varSekceKod) && IsBlank(varUtvarKod),
                  "První okno dat",
                  IsBlank(txt_Hledat.Text) && !varOsirele && IsBlank(varSekceKod) && IsBlank(varUtvarKod) && drp_Stav.Selected.Value = "(vše)",
                  "Bez filtru",
                  "Filtrováno"
              )
            Tooltip: '="Fulltextové hledání i přepínač osiřelých se počítají až nad tím, co vrátí ostatní filtry - delegovat je nejde. Dokud je aktivit méně než 2 000, je výsledek úplný. Nad tím pracují jen s prvním oknem dat; zúžení sekcí nebo útvarem to spolehlivě vyřeší, protože ty filtry běží na serveru nad celým rejstříkem."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =136
            X: =Parent.Width - 176
            Y: =198
      # ---------- hlavička tabulky (klik = řazení) ----------
      - lbl_h_Kod:
          Control: Label@2.5.1
          Properties:
            Color: =If(varRazeni = "kod", stylAkce, stylTextSlaby)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =26
            HoverColor: =stylAkce
            OnSelect: |-
              =Set(varRazeniAsc, If(varRazeni = "kod", !varRazeniAsc, true));
              Set(varRazeni, "kod")
            PressedColor: =stylAkceStisk
            Size: =10 + varFs
            Text: |-
              ="KÓD" & If(varRazeni = "kod", If(varRazeniAsc, " ▲", " ▼"), "")
            Tooltip: '="Seřadí podle identifikačního kódu, tedy v pořadí rejstříku. Výchozí řazení. Další klik obrátí směr."'
            VerticalAlign: =VerticalAlign.Middle
            Visible: =varZobrazitKod
            Width: =140
            X: =56
            Y: =242
      - lbl_h_Nazev:
          Control: Label@2.5.1
          Properties:
            Color: =If(varRazeni = "nazev", stylAkce, stylTextSlaby)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =26
            HoverColor: =stylAkce
            OnSelect: |-
              =Set(varRazeniAsc, If(varRazeni = "nazev", !varRazeniAsc, true));
              Set(varRazeni, "nazev")
            PressedColor: =stylAkceStisk
            Size: =10 + varFs
            Text: |-
              ="AKTIVITA" & If(varRazeni = "nazev", If(varRazeniAsc, " ▲", " ▼"), "")
            Tooltip: '="Seřadí abecedně podle názvu aktivity. Další klik obrátí směr."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =300
            X: =If(varZobrazitKod, 208 + varFs * 12, 56)
            Y: =242
      - lbl_h_Utvar:
          Control: Label@2.5.1
          Properties:
            Color: =If(varRazeni = "utvar", stylAkce, stylTextSlaby)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =26
            HoverColor: =stylAkce
            OnSelect: |-
              =Set(varRazeniAsc, If(varRazeni = "utvar", !varRazeniAsc, true));
              Set(varRazeni, "utvar")
            PressedColor: =stylAkceStisk
            Size: =10 + varFs
            Text: |-
              ="VYKONÁVÁ" & If(varRazeni = "utvar", If(varRazeniAsc, " ▲", " ▼"), "")
            Tooltip: '="Seskupí za sebe aktivity téhož útvaru. Další klik obrátí směr."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =110
            X: =Parent.Width - 568
            Y: =242
      - lbl_h_Sekce:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =26
            Size: =10 + varFs
            Text: ="SEKCE"
            VerticalAlign: =VerticalAlign.Middle
            Width: =90
            X: =Parent.Width - 448
            Y: =242
      - lbl_h_Vytvoreno:
          Control: Label@2.5.1
          Properties:
            Color: =If(varRazeni = "datum", stylAkce, stylTextSlaby)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =26
            HoverColor: =stylAkce
            OnSelect: |-
              =Set(varRazeniAsc, If(varRazeni = "datum", !varRazeniAsc, false));
              Set(varRazeni, "datum")
            PressedColor: =stylAkceStisk
            Size: =10 + varFs
            Text: |-
              ="VYTVOŘENO" & If(varRazeni = "datum", If(varRazeniAsc, " ▲", " ▼"), "")
            Tooltip: '="Seřadí podle data založení aktivity. První klik dá nejnovější nahoru, další klik obrátí směr. Datum zapisuje SharePoint sám při vzniku záznamu, ručně se měnit nedá."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =90
            X: =Parent.Width - 348
            Y: =242
      - lbl_h_Stav:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =26
            Size: =10 + varFs
            Text: ="STAV"
            VerticalAlign: =VerticalAlign.Middle
            Width: =100
            X: =Parent.Width - 248
            Y: =242
      - rec_HlavickaLinka:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylOkraj
            Height: =1
            Width: =Parent.Width - 80
            X: =40
            Y: =268
      # ---------- galerie ----------
      - gal_Aktivity:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Height: =Parent.Height - Self.Y - 24
            Items: |-
              =Filter(
                  Search(
                      Switch(
                          varRazeni,
                          "nazev",
                          Sort(Filter(
                              Aktivity,
                              IsBlank(varSekceKod) || sekce = varSekceKod,
                              IsBlank(varUtvarKod) || vykonava = varUtvarKod,
                              drp_Stav.Selected.Value = "(vše)" || stav.Value = drp_Stav.Selected.Value
                          ), nazev_kratky, If(varRazeniAsc, SortOrder.Ascending, SortOrder.Descending)),
                          "utvar",
                          Sort(Filter(
                              Aktivity,
                              IsBlank(varSekceKod) || sekce = varSekceKod,
                              IsBlank(varUtvarKod) || vykonava = varUtvarKod,
                              drp_Stav.Selected.Value = "(vše)" || stav.Value = drp_Stav.Selected.Value
                          ), vykonava, If(varRazeniAsc, SortOrder.Ascending, SortOrder.Descending)),
                          "datum",
                          Sort(Filter(
                              Aktivity,
                              IsBlank(varSekceKod) || sekce = varSekceKod,
                              IsBlank(varUtvarKod) || vykonava = varUtvarKod,
                              drp_Stav.Selected.Value = "(vše)" || stav.Value = drp_Stav.Selected.Value
                          ), Created, If(varRazeniAsc, SortOrder.Ascending, SortOrder.Descending)),
                          Sort(Filter(
                              Aktivity,
                              IsBlank(varSekceKod) || sekce = varSekceKod,
                              IsBlank(varUtvarKod) || vykonava = varUtvarKod,
                              drp_Stav.Selected.Value = "(vše)" || stav.Value = drp_Stav.Selected.Value
                          ), Title, If(varRazeniAsc, SortOrder.Ascending, SortOrder.Descending))
                      ),
                      txt_Hledat.Text,
                      nazev_kratky,
                      Title
                  ),
                  !varOsirele || IsBlank(LookUp(colDilci, Title = dilci_proces_kod))
              )
            TemplatePadding: =0
            TemplateSize: =56 + varFs * 5
            # Pohyb řádku při najetí myší. Bez toho galerie na hover nereaguje
            # vůbec — Transition je jediná vlastnost, která to zapíná.
            Transition: =Transition.Push
            Width: =Parent.Width - 80
            X: =40
            Y: =270
          Children:
            - rec_RadekPozadi:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(ThisItem.IsSelected, stylRadekVybrany, stylKarta)
                  Height: =Parent.TemplateHeight - 1
                  HoverFill: =stylRadekHover
                  PressedFill: =stylRadekVybrany
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - rec_RadekLinka:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =stylOkraj
                  Height: =1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =Parent.TemplateHeight - 1
            - lbl_Kod:
                Control: Label@2.5.1
                Properties:
                  Color: =stylText
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =11 + varFs
                  Text: =ThisItem.Title
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =varZobrazitKod
                  Width: =140 + varFs * 12
                  X: =16
                  Y: =0
            - lbl_Nazev:
                Control: Label@2.5.1
                Properties:
                  Color: =stylText
                  Font: =Font.'Open Sans'
                  FontWeight: |-
                    =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Parent.TemplateHeight - 1
                  PaddingBottom: =0
                  PaddingTop: =0
                  Size: =12 + varFs
                  Text: =ThisItem.nazev_kratky
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =If(varZobrazitKod, Parent.TemplateWidth - 712 - varFs * 12, Parent.TemplateWidth - 560)
                  X: =If(varZobrazitKod, 168 + varFs * 12, 16)
                  Y: =0
            - lbl_Utvar:
                Control: Label@2.5.1
                Properties:
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =11 + varFs
                  Text: =ThisItem.vykonava
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =110
                  X: =Parent.TemplateWidth - 528
                  Y: =0
            - lbl_Sekce:
                Control: Label@2.5.1
                Properties:
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =11 + varFs
                  Text: =ThisItem.sekce
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =90
                  X: =Parent.TemplateWidth - 408
                  Y: =0
            - lbl_Vytvoreno:
                Control: Label@2.5.1
                Properties:
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =11 + varFs
                  Text: =Text(ThisItem.Created, "dd.mm.yyyy")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =90
                  X: =Parent.TemplateWidth - 308
                  Y: =0
            - lbl_Stav:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(ThisItem.stav.Value = "schváleno", stylUspech, stylPozor)
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  Size: =11 + varFs
                  Text: =ThisItem.stav.Value
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =100
                  X: =Parent.TemplateWidth - 208
                  Y: =0
            # Průhledná vrstva PŘES text řádku. Hover dostane jen control přímo
            # pod kurzorem, a řádek je ze čtyř pětin pokrytý labely — podkladový
            # obdélník se ho proto nikdy nedočkal a řádek na najetí nereagoval.
            # Label, ne Rectangle: jen Label umí HoverBorderColor.
            # Akční ikony jsou ZA touto vrstvou v pořadí, tedy nad ní, aby
            # zůstaly klikací samostatně.
            - lbl_RadekPrekryv:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderThickness: =2
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight - 1
                  HoverBorderColor: =stylAkce
                  HoverFill: =RGBA(0, 90, 181, 0.10)
                  OnSelect: |-
                    =Set(varDetailZpet, "seznam");
                    Set(varNova, false);
                    Set(varAktivita, ThisItem);
                    Navigate(scr_Detail, ScreenTransition.Cover)
                  PressedFill: =RGBA(0, 90, 181, 0.20)
                  Text: =""
                  Tooltip: '="Otevře detail aktivity: úplné znění, vykonávající útvar, spolupráci, vnitřní předpis a zařazení do dílčích procesů."'
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - ico_Smazat:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =stylTextSlaby
                  Height: =32
                  HoverColor: =stylNebezpeci
                  Icon: =Icon.Trash
                  # Nemaže hned — jen si zapamatuje, čeho se dotaz týká.
                  # Smaže se až po potvrzení v dialogu níž.
                  OnSelect: =Set(varSmazat, ThisItem)
                  PaddingBottom: =9
                  PaddingLeft: =9
                  PaddingRight: =9
                  PaddingTop: =9
                  PressedColor: =stylNebezpeci
                  Tooltip: '="Smaže aktivitu i všechna její zařazení do dílčích procesů. Zeptá se na potvrzení."'
                  Width: =32
                  X: =Parent.TemplateWidth - 56
                  Y: =(Parent.TemplateHeight - 1) / 2 - 16
      # ---------- potvrzení smazání ----------
      # Power Apps nemá nativní confirm(), takže dialog je vrstva nad obrazovkou.
      # Stín zachytí kliknutí mimo kartu, aby pod dialogem nešlo omylem pracovat.
      # Souřadnice jsou vzorce (Parent.Width/2), takže kontrola překryvu je
      # přeskočí — u překryvné vrstvy je to správně, leží nad vším záměrně.
      - rec_ModalStin:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            OnSelect: =Set(varSmazat, Blank())
            Visible: =!IsBlank(varSmazat)
            Width: =Parent.Width
            X: =0
            Y: =0
      - rec_ModalKarta:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylKarta
            Height: =360
            Visible: =!IsBlank(varSmazat)
            Width: =640
            X: =Parent.Width / 2 - 320
            Y: =Parent.Height / 2 - 180
      - rec_ModalPruh:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylNebezpeci
            Height: =4
            Visible: =!IsBlank(varSmazat)
            Width: =640
            X: =Parent.Width / 2 - 320
            Y: =Parent.Height / 2 - 180
      - lbl_ModalNadpis:
          Control: Label@2.5.1
          Properties:
            Color: =stylText
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =15
            Text: ="Smazat aktivitu?"
            Visible: =!IsBlank(varSmazat)
            Width: =576
            X: =Parent.Width / 2 - 288
            Y: =Parent.Height / 2 - 148
      - lbl_ModalText:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =200
            Size: =12
            Text: |-
              =varSmazat.Title & " — " & varSmazat.nazev_kratky & "

              Smaže se i zařazení do všech dílčích procesů. Číselník agend, procesů a dílčích procesů zůstane nedotčený. Vrátit to zpět nejde.

              Mazání nikdy nesahá na podřízené záznamy: když se ruší položka číselníku, zůstanou pod ní záznamy bez nadřazené položky. Ty se uklízejí ve své vlastní entitě — aktivity tady v seznamu, agendy, procesy a dílčí procesy v číselníku — přepínačem „osiřelé“ nad seznamem."
            Visible: =!IsBlank(varSmazat)
            Width: =576
            X: =Parent.Width / 2 - 288
            Y: =Parent.Height / 2 - 112
      - btn_ModalZrusit:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =stylText
            Fill: =stylKarta
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =40
            HoverFill: =stylRadekHover
            OnSelect: =Set(varSmazat, Blank())
            PressedFill: =stylRadekVybrany
            Size: =13
            Text: ="Zrušit"
            Visible: =!IsBlank(varSmazat)
            Width: =140
            X: =Parent.Width / 2 - 288
            Y: =Parent.Height / 2 + 108
      - btn_ModalSmazat:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =stylNebezpeci
            FocusedBorderColor: =stylNebezpeci
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =40
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =stylNebezpeci
            OnSelect: |-
              =IfError(
                  RemoveIf('Vazba aktivita–dílčí proces', aktivita_kod = varSmazat.Title);
                  Remove(Aktivity, varSmazat);
                  Set(varAktStale, true);
                  Notify("Aktivita " & varSmazat.Title & " smazána i s vazbami.", NotificationType.Success);
                  Set(varSmazat, Blank()),
                  Notify("Smazání selhalo: " & FirstError.Message, NotificationType.Error);
                  Set(varSmazat, Blank())
              )
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylNebezpeci
            Size: =13
            Text: ="Smazat"
            Tooltip: '="Nevratné. Smaže aktivitu i všechna její zařazení do dílčích procesů. Číselník zůstane nedotčený."'
            Visible: =!IsBlank(varSmazat)
            Width: =160
            X: =Parent.Width / 2 + 128
            Y: =Parent.Height / 2 + 108
