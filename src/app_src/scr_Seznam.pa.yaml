# Obrazovka 1 — seznam aktivit. Všechny filtry jsou delegovatelné
# (=, StartsWith nad indexovanými sloupci Title, nazev_kratky, sekce, vykonava, stav).
Screens:
  scr_Seznam:
    Properties:
      Fill: =stylPlocha
      LoadingSpinnerColor: =stylAkce
    Children:
      - rec_Hlavicka:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPrimarni
            Height: =72
            Width: =Parent.Width
            X: =0
            Y: =0
      - lbl_Nadpis:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            Size: =18
            Text: ="Rejstřík agend a procesů — aktivity"
            VerticalAlign: =VerticalAlign.Middle
            Width: =600
            X: =40
            Y: =16
      - btn_Nova:
          Control: Classic/Button@2.2.0
          Properties:
            HoverFill: =stylAkceHover
            PressedFill: =stylAkceStisk
            HoverColor: =RGBA(255, 255, 255, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            FocusedBorderColor: =stylPrimarni
            FocusedBorderThickness: =2
            Tooltip: '="Založí novou aktivitu. Kód se nezadává — přidělí se sám při uložení podle vybraného dílčího procesu. Povinné je znění aktivity a dílčí proces; ostatní pole jde doplnit později."'
            Fill: =stylAkce
            Font: =Font.'Open Sans'
            Height: =40
            OnSelect: |-
              =Set(varNova, true);
              Set(varAktivita, Blank());
              Navigate(scr_Detail, ScreenTransition.Cover)
            Size: =13
            Text: ="+ Nová aktivita"
            Width: =176
            X: =Parent.Width - Self.Width - 40
            Y: =16
      - rec_FiltrPanel:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylKarta
            Height: =96
            Width: =Parent.Width - 80
            X: =40
            Y: =72
      - rec_FiltrOkraj:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylOkraj
            Height: =1
            Width: =Parent.Width - 80
            X: =40
            Y: =167
      - lbl_l_Filtry:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Hledání a filtry — prázdná nabídka „(vše)“ znamená bez omezení"
            Width: =700
            X: =40
            Y: =76
      - txt_Hledat:
          Control: Classic/TextInput@2.3.2
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Hledá podle ZAČÁTKU názvu aktivity, ne kdekoli uvnitř. Napíšeš-li „Tvorba“, najde „Tvorba Služebního řádu“, ale ne „Roční tvorba plánu“. Je to daň za rychlost: takový dotaz umí vyřídit SharePoint sám i nad tisíci aktivitami. Fulltext přes celý rejstřík nabízí publikovaná HTML mapa. Prázdné pole = bez omezení."'
            Default: =""
            Font: =Font.'Open Sans'
            Height: =40
            HintText: ="Název začíná na…"
            Size: =13
            Width: =380
            X: =40
            Y: =96
      - drp_Sekce:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Filtruje podle sekce, pod kterou vykonávající útvar patří. Nabídka se plní z číselníku útvarů, takže je úplná bez ohledu na to, kolik aktivit v rejstříku je. „(vše)“ vypne filtr. Filtry se sčítají: sekce + útvar + stav + hledání platí najednou."'
            Default: ="(vše)"
            Font: =Font.'Open Sans'
            Height: =40
            Items: =colSekceNabidka
            OnChange: |-
              =Set(
                  varSekceKod,
                  If(
                      drp_Sekce.Selected.Value = "(vše)",
                      "",
                      Left(drp_Sekce.Selected.Value, Find(" ·", drp_Sekce.Selected.Value & " ·") - 1)
                  )
              )
            Size: =13
            Width: =140
            X: =436
            Y: =96
      - drp_Utvar:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Filtruje podle útvaru, který aktivitu vykonává. Nabídka je z číselníku útvarů ve tvaru „kód · název“ a obsahuje odbory i oddělení. Chceš-li vidět všechny aktivity jednoho útvaru pro potřeby organizačního řádu, nastav sem útvar a ostatní filtry nech na „(vše)“."'
            Default: ="(vše)"
            Font: =Font.'Open Sans'
            Height: =40
            Items: =colUtvarNabidka
            OnChange: |-
              =Set(
                  varUtvarKod,
                  If(
                      drp_Utvar.Selected.Value = "(vše)",
                      "",
                      Left(drp_Utvar.Selected.Value, Find(" ·", drp_Utvar.Selected.Value & " ·") - 1)
                  )
              )
            Size: =13
            Width: =180
            X: =592
            Y: =96
      - drp_Stav:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Pracovní = rozpracovaný záznam, na kterém se ještě pracuje. Schváleno = potvrzené znění, které smí jít do organizačního řádu. Stav se přepíná v detailu aktivity; schvalovací kolečko s notifikacemi zatím není součástí řešení."'
            Default: ="(vše)"
            Font: =Font.'Open Sans'
            Height: =40
            Items: =["(vše)", "pracovní", "schváleno"]
            Size: =13
            Width: =180
            X: =788
            Y: =96
      - lbl_l_Razeni:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: ="Řadit podle"
            Width: =180
            X: =984
            Y: =76
      - drp_Razeni:
          Control: Classic/DropDown@2.3.1
          Properties:
            HoverBorderColor: =stylAkce
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Tooltip: '="Mění pořadí seznamu. Kód = pořadí v rejstříku (agenda, proces, dílčí proces, aktivita) — nejlepší pro procházení celé struktury. Název = abecedně. Útvar = seskupí aktivity jednoho oddělení za sebe. Řazení neovlivňuje filtry ani počet zobrazených aktivit."'
            Default: ="kód"
            Font: =Font.'Open Sans'
            Height: =40
            Items: =["kód", "název", "útvar"]
            Size: =13
            Width: =180
            X: =984
            Y: =96
      - lbl_Pocet:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =32
            Size: =11
            Text: |-
              ="Zobrazeno " & CountRows(gal_Aktivity.AllItems) & " aktivit"
            VerticalAlign: =VerticalAlign.Middle
            Width: =400
            X: =40
            Y: =148
      - rec_HlavickaTabulky:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPlocha
            Height: =32
            Width: =Parent.Width - 80
            X: =40
            Y: =180
      - lbl_h_Kod:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =10
            Text: ="KÓD"
            VerticalAlign: =VerticalAlign.Middle
            Width: =148
            X: =60
            Y: =180
      - lbl_h_Nazev:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =10
            Text: ="AKTIVITA"
            VerticalAlign: =VerticalAlign.Middle
            Width: =400
            X: =224
            Y: =180
      - lbl_h_Stav:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =10
            Text: ="STAV"
            VerticalAlign: =VerticalAlign.Middle
            Width: =112
            X: =Parent.Width - 240
            Y: =180
      - gal_Aktivity:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Height: =Parent.Height - Self.Y - 24
            Items: |-
              =Switch(
                  drp_Razeni.Selected.Value,
                  "název",
                  Sort(Filter(
                      Aktivity,
                      IsBlank(txt_Hledat.Text) || StartsWith(nazev_kratky, txt_Hledat.Text),
                      IsBlank(varSekceKod) || sekce = varSekceKod,
                      IsBlank(varUtvarKod) || vykonava = varUtvarKod,
                      drp_Stav.Selected.Value = "(vše)" || stav.Value = drp_Stav.Selected.Value
                  ), nazev_kratky, SortOrder.Ascending),
                  "útvar",
                  Sort(Filter(
                      Aktivity,
                      IsBlank(txt_Hledat.Text) || StartsWith(nazev_kratky, txt_Hledat.Text),
                      IsBlank(varSekceKod) || sekce = varSekceKod,
                      IsBlank(varUtvarKod) || vykonava = varUtvarKod,
                      drp_Stav.Selected.Value = "(vše)" || stav.Value = drp_Stav.Selected.Value
                  ), vykonava, SortOrder.Ascending),
                  Sort(Filter(
                      Aktivity,
                      IsBlank(txt_Hledat.Text) || StartsWith(nazev_kratky, txt_Hledat.Text),
                      IsBlank(varSekceKod) || sekce = varSekceKod,
                      IsBlank(varUtvarKod) || vykonava = varUtvarKod,
                      drp_Stav.Selected.Value = "(vše)" || stav.Value = drp_Stav.Selected.Value
                  ), Title, SortOrder.Ascending)
              )
            TemplatePadding: =0
            TemplateSize: =96
            Width: =Parent.Width - 80
            X: =40
            Y: =216
          Children:
            - rec_RadekPozadi:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(
                        ThisItem.IsSelected,
                        stylRadekVybrany,
                        RGBA(255, 255, 255, 1)
                    )
                  HoverFill: =stylRadekHover
                  PressedFill: =stylRadekVybrany
                  Height: =Parent.TemplateHeight - 8
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - rec_Pruh:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(
                        ThisItem.stav.Value = "schváleno",
                        stylUspech,
                        stylPrimarni
                    )
                  Height: =Parent.TemplateHeight - 8
                  OnSelect: =Select(Parent)
                  Width: =4
                  X: =0
                  Y: =0
            - rec_KodPozadi:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =stylPlocha
                  Height: =32
                  OnSelect: =Select(Parent)
                  Width: =148
                  X: =20
                  Y: =(Parent.TemplateHeight - 8) / 2 - 16
            - lbl_Kod:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =stylPrimarni
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  OnSelect: =Select(Parent)
                  Size: =11
                  Text: =ThisItem.Title
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =148
                  X: =20
                  Y: =(Parent.TemplateHeight - 8) / 2 - 16
            - lbl_NazevKratky:
                Control: Label@2.5.1
                Properties:
                  Color: =stylText
                  Font: =Font.'Open Sans'
                  FontWeight: |-
                    =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =44
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingTop: =0
                  Size: =13
                  Text: =ThisItem.nazev_kratky
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 500
                  X: =184
                  Y: =16
            - lbl_Utvar:
                Control: Label@2.5.1
                Properties:
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =20
                  OnSelect: =Select(Parent)
                  PaddingTop: =0
                  Size: =10
                  Text: |-
                    ="vykonává " & ThisItem.vykonava & "   ·   sekce " & ThisItem.sekce
                  Width: =Parent.TemplateWidth - 500
                  X: =184
                  Y: =62
            - rec_StavPozadi:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(
                        ThisItem.stav.Value = "schváleno",
                        stylUspechSvetle,
                        stylPozorSvetle
                    )
                  Height: =28
                  OnSelect: =Select(Parent)
                  Width: =112
                  X: =Parent.TemplateWidth - 200
                  Y: =(Parent.TemplateHeight - 8) / 2 - 14
            - lbl_Stav:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: |-
                    =If(
                        ThisItem.stav.Value = "schváleno",
                        stylUspech,
                        stylPozor
                    )
                  Font: =Font.'Open Sans'
                  Height: =28
                  OnSelect: =Select(Parent)
                  Size: =10
                  Text: =ThisItem.stav.Value
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =112
                  X: =Parent.TemplateWidth - 200
                  Y: =(Parent.TemplateHeight - 8) / 2 - 14
            - ico_Detail:
                Control: Classic/Icon@2.5.0
                Properties:
                  HoverColor: =stylAkce
                  PressedColor: =stylAkceStisk
                  Tooltip: '="Otevře detail aktivity: úplné znění, vykonávající útvar, spolupráci, vnitřní předpis a zařazení do dílčích procesů. Odtud se aktivita také maže."'
                  Color: =stylTextSlaby
                  Height: =40
                  Icon: =Icon.ChevronRight
                  OnSelect: |-
                    =Set(varNova, false);
                    Set(varAktivita, ThisItem);
                    Navigate(scr_Detail, ScreenTransition.Cover)
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  Width: =40
                  X: =Parent.TemplateWidth - Self.Width - 16
                  Y: =(Parent.TemplateHeight - 8) / 2 - 20

      - ico_Mapa:
          Control: Classic/Icon@2.5.0
          Properties:
            HoverColor: =stylAkce
            PressedColor: =stylAkceStisk
            Color: =RGBA(255, 255, 255, 1)
            Height: =28
            Icon: =Icon.Globe
            OnSelect: =Launch(varMapaUrl, {}, LaunchTarget.New)
            Tooltip: '="Otevřít procesní mapu (HTML) v novém okně"'
            Visible: =!IsBlank(varMapaUrl)
            Width: =28
            X: =Parent.Width - 288
            Y: =26
      - ico_InfoSeznam:
          Control: Classic/Icon@2.5.0
          Properties:
            HoverColor: =stylAkce
            PressedColor: =stylAkceStisk
            Color: =RGBA(255, 255, 255, 1)
            Height: =28
            Icon: =Icon.Information
            OnSelect: =Set(varNapovedaKod, !varNapovedaKod)
            Tooltip: '="Jak se tvoří identifikační kód"'
            Width: =28
            X: =Parent.Width - 240
            Y: =26
      - rec_NapovedaSeznam:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =340
            Visible: =varNapovedaKod
            Width: =640
            X: =280
            Y: =120
      - rec_NapovedaOkrajSeznam:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPrimarni
            Height: =340
            Visible: =varNapovedaKod
            Width: =4
            X: =280
            Y: =120
      - lbl_NapovedaSeznam:
          Control: Label@2.5.1
          Properties:
            Color: =stylText
            Font: =Font.'Open Sans'
            Height: =300
            Size: =11
            Text: |-
              ="Identifikační kód aktivity: AA-BB-CCC-DDDD

              AA     agenda (např. 07)
              BB     proces uvnitř agendy (07-04)
              CCC    dílčí proces (07-04-006)
              DDDD   pořadí aktivity v dílčím procesu (07-04-006-0001)

              Kód se skládá z výběru agenda → proces → dílčí proces a přiděluje se sám při prvním uložení: aktivita dostane první volné čtyřčíslí ve svém dílčím procesu.

              Jednou přidělený kód se už nikdy nemění — ani když se aktivita přesune do jiného dílčího procesu, ani když se před ní něco smaže. Vazby v rejstříku i v mapě na něm stojí.

              Vlastník (sekce, odbor, oddělení) součástí kódu není. Eviduje se zvlášť, aby organizační změny kódy nepřečíslovaly."
            VerticalAlign: =VerticalAlign.Top
            Visible: =varNapovedaKod
            Width: =570
            X: =308
            Y: =140
      - ico_ZavritNapoveduSeznam:
          Control: Classic/Icon@2.5.0
          Properties:
            HoverColor: =stylAkce
            PressedColor: =stylAkceStisk
            Color: =stylTextSlaby
            Height: =32
            Icon: =Icon.Cancel
            OnSelect: =Set(varNapovedaKod, false)
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Visible: =varNapovedaKod
            Width: =32
            X: =880
            Y: =128
