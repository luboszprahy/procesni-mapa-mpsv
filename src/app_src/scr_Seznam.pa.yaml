# Obrazovka 1 — seznam aktivit. Všechny filtry jsou delegovatelné
# (=, StartsWith nad indexovanými sloupci Title, nazev_kratky, sekce, vykonava, stav).
Screens:
  scr_Seznam:
    Properties:
      Fill: =RGBA(248, 249, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - rec_Hlavicka:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 18, 107, 1)
            Height: =72
            Width: =Parent.Width
            X: =0
            Y: =0
      - lbl_Nadpis:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            Size: =18
            Text: ="Rejstřík agend a procesů — aktivity"
            VerticalAlign: =VerticalAlign.Middle
            Width: =600
            X: =40
            Y: =16
      - btn_Nova:
          Control: Classic/Button@2.2.0
          Properties:
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Open Sans'
            Height: =40
            OnSelect: |-
              =Set(varNova, true);
              Set(varAktivita, Blank());
              Navigate(scr_Detail, ScreenTransition.Cover)
            Size: =13
            Text: ="+ Nová aktivita"
            Width: =176
            X: =Parent.Width - Self.Width - 40
            Y: =16
      - txt_Hledat:
          Control: Classic/TextInput@2.3.2
          Properties:
            Font: =Font.'Open Sans'
            Height: =40
            HintText: ="Název začíná na…"
            Size: =13
            Width: =380
            X: =40
            Y: =96
      - txt_Sekce:
          Control: Classic/TextInput@2.3.2
          Properties:
            Font: =Font.'Open Sans'
            Height: =40
            HintText: ="Sekce"
            Size: =13
            Width: =140
            X: =436
            Y: =96
      - txt_Utvar:
          Control: Classic/TextInput@2.3.2
          Properties:
            Font: =Font.'Open Sans'
            Height: =40
            HintText: ="Vykonává útvar"
            Size: =13
            Width: =200
            X: =592
            Y: =96
      - drp_Stav:
          Control: Classic/DropDown@2.3.1
          Properties:
            Font: =Font.'Open Sans'
            Height: =40
            Items: =["(vše)", "pracovní", "schváleno"]
            Size: =13
            Width: =200
            X: =808
            Y: =96
      - lbl_Pocet:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.'Open Sans'
            Height: =32
            Size: =11
            Text: |-
              ="Zobrazeno " & CountRows(gal_Aktivity.AllItems) & " aktivit"
            VerticalAlign: =VerticalAlign.Middle
            Width: =400
            X: =40
            Y: =148
      - gal_Aktivity:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Height: =Parent.Height - Self.Y - 24
            Items: |-
              =Filter(
                  Aktivity,
                  IsBlank(txt_Hledat.Text) || StartsWith(nazev_kratky, txt_Hledat.Text),
                  IsBlank(txt_Sekce.Text) || sekce = txt_Sekce.Text,
                  IsBlank(txt_Utvar.Text) || vykonava = txt_Utvar.Text,
                  drp_Stav.Selected.Value = "(vše)" || stav.Value = drp_Stav.Selected.Value
              )
            TemplateSize: =72
            Width: =Parent.Width - 80
            X: =40
            Y: =184
          Children:
            - lbl_Kod:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  OnSelect: =Select(Parent)
                  Size: =11
                  Text: =ThisItem.Title
                  Width: =160
                  X: =16
                  Y: =12
            - lbl_NazevKratky:
                Control: Label@2.5.1
                Properties:
                  Font: =Font.'Open Sans'
                  Height: =24
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: =ThisItem.nazev_kratky
                  Width: =Parent.TemplateWidth - 660
                  X: =184
                  Y: =12
            - lbl_Utvar:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(96, 94, 92, 1)
                  Font: =Font.'Open Sans'
                  Height: =20
                  OnSelect: =Select(Parent)
                  Size: =10
                  Text: |-
                    ="vykonává: " & ThisItem.vykonava & "   ·   sekce " & ThisItem.sekce
                  Width: =Parent.TemplateWidth - 660
                  X: =184
                  Y: =38
            - lbl_Stav:
                Control: Label@2.5.1
                Properties:
                  Color: =If(ThisItem.stav.Value = "schváleno", RGBA(16, 124, 16, 1), RGBA(161, 96, 0, 1))
                  Font: =Font.'Open Sans'
                  Height: =24
                  OnSelect: =Select(Parent)
                  Size: =11
                  Text: =ThisItem.stav.Value
                  Width: =120
                  X: =Parent.TemplateWidth - 200
                  Y: =24
            - ico_Detail:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =RGBA(166, 166, 166, 1)
                  Height: =40
                  Icon: =Icon.ChevronRight
                  OnSelect: |-
                    =Set(varNova, false);
                    Set(varAktivita, ThisItem);
                    Navigate(scr_Detail, ScreenTransition.Cover)
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  Width: =40
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =16
            - sep_Radek:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(237, 235, 233, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1
