# Obrazovka 1 — seznam aktivit. Všechny filtry jsou delegovatelné
# (=, StartsWith nad indexovanými sloupci Title, nazev_kratky, sekce, vykonava, stav).
#
# Rozvržení podle vzoru ze Správy notifikací (input/snimky/vzor-notifikace-2.png):
# tmavý navbar s identitou → bílá souhrnná karta s čísly a akcemi → řádek
# hledání s chipy → tabulková galerie s řaditelnou hlavičkou. Plocha je světlá,
# oddělení tenkými linkami, žádné barevné bloky.
#
# Čísla v souhrnné kartě se počítají z gal_Aktivity.AllItems, ne z listu:
# CountRows nad SharePointem se nedeleguje a nad 2 000 aktivitami by tiše lhal.
# Popisky proto říkají „zobrazeno", ne „celkem".
#
# Řazení drží varRazeni (kod / nazev / utvar) a varRazeniAsc; přepíná se klikem
# na hlavičku sloupce. Sort je uvnitř každé větve Switch zvlášť, aby dotaz
# zůstal delegovatelný — Sort s vypočítaným výrazem by delegaci shodil.
Screens:
  scr_Seznam:
    Properties:
      Fill: =stylPlocha
      LoadingSpinnerColor: =stylAkce
    Children:
      # ---------- navbar ----------
      - rec_Navbar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPrimarni
            Height: =64
            Width: =Parent.Width
            X: =0
            Y: =0
      - lbl_AppNazev:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =15
            Text: ="Procesní mapa MPSV"
            VerticalAlign: =VerticalAlign.Middle
            Width: =240
            X: =40
            Y: =0
      - lbl_Zalozka:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =13
            Text: ="Seznam aktivit"
            VerticalAlign: =VerticalAlign.Middle
            Width: =160
            X: =300
            Y: =0
      - rec_ZalozkaPodtrzeni:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =3
            Width: =160
            X: =300
            Y: =58
      - lbl_Uzivatel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =12
            Text: =User().FullName
            VerticalAlign: =VerticalAlign.Bottom
            Width: =320
            X: =Parent.Width - 360
            Y: =10
      - lbl_UzivatelMail:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(214, 220, 234, 1)
            Font: =Font.'Open Sans'
            Height: =20
            Size: =10
            Text: =User().Email
            VerticalAlign: =VerticalAlign.Top
            Width: =320
            X: =Parent.Width - 360
            Y: =34
      # ---------- souhrnná karta ----------
      - rec_Souhrn:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylKarta
            Height: =84
            Width: =Parent.Width - 80
            X: =40
            Y: =80
      - rec_SouhrnOkraj:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylOkraj
            Height: =1
            Width: =Parent.Width - 80
            X: =40
            Y: =163
      - lbl_SouhrnNadpis:
          Control: Label@2.5.1
          Properties:
            Color: =stylText
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =84
            Size: =15
            Text: ="Aktivity"
            VerticalAlign: =VerticalAlign.Middle
            Width: =180
            X: =64
            Y: =80
      - lbl_l_Zobrazeno:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =18
            Size: =10
            Text: ="Zobrazeno"
            Width: =120
            X: =264
            Y: =98
      - lbl_v_Zobrazeno:
          Control: Label@2.5.1
          Properties:
            Color: =stylText
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =15
            Text: =CountRows(gal_Aktivity.AllItems)
            VerticalAlign: =VerticalAlign.Middle
            Width: =120
            X: =264
            Y: =118
      - lbl_l_Schvaleno:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =18
            Size: =10
            Text: ="Schváleno"
            Width: =120
            X: =404
            Y: =98
      - lbl_v_Schvaleno:
          Control: Label@2.5.1
          Properties:
            Color: =stylUspech
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =15
            Text: |-
              =CountRows(Filter(gal_Aktivity.AllItems, stav.Value = "schváleno"))
            VerticalAlign: =VerticalAlign.Middle
            Width: =120
            X: =404
            Y: =118
      - lbl_l_Pracovni:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =18
            Size: =10
            Text: ="Pracovní"
            Width: =120
            X: =544
            Y: =98
      - lbl_v_Pracovni:
          Control: Label@2.5.1
          Properties:
            Color: =stylPozor
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =15
            Text: |-
              =CountRows(Filter(gal_Aktivity.AllItems, stav.Value = "pracovní"))
            VerticalAlign: =VerticalAlign.Middle
            Width: =120
            X: =544
            Y: =118
      - btn_Mapa:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =stylOkraj
            BorderThickness: =1
            Color: =stylAkce
            Fill: =stylKarta
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =40
            HoverColor: =stylAkce
            HoverFill: =stylRadekHover
            OnSelect: =Launch(varMapaUrl, {}, LaunchTarget.New)
            PressedColor: =stylAkceStisk
            PressedFill: =stylRadekVybrany
            Size: =13
            Text: ="Zobrazit v HTML"
            Tooltip: '="Otevře publikovanou procesní mapu v novém okně prohlížeče. Mapa ukazuje celý rejstřík jako strom agenda - proces - dílčí proces - aktivita a umí fulltextové hledání napříč všemi aktivitami. Data v mapě jsou k okamžiku poslední publikace, ne živá."'
            Visible: =!IsBlank(varMapaUrl)
            Width: =176
            X: =Parent.Width - 296 - Self.Width - 12
            Y: =102
      - btn_Nova:
          Control: Classic/Button@2.2.0
          Properties:
            Fill: =stylAkce
            FocusedBorderColor: =stylPrimarni
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =40
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =stylAkceHover
            OnSelect: |-
              =Set(varNova, true);
              Set(varAktivita, Blank());
              Navigate(scr_Detail, ScreenTransition.Cover)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =stylAkceStisk
            Size: =13
            Text: ="+ Nová aktivita"
            Tooltip: '="Založí novou aktivitu. Kód AA-BB-CCC-DDDD se nezadává - přidělí se sám při uložení: AA agenda, BB proces, CCC dílčí proces, DDDD pořadí aktivity v tom dílčím procesu. Aktivita dostane první volné čtyřčíslí. Jednou přidělený kód se už nikdy nemění, ani při přesunu do jiného dílčího procesu, ani když se před ní něco smaže - vazby v rejstříku i v mapě na něm stojí. Vlastník (sekce, odbor, oddělení) součástí kódu není, eviduje se zvlášť, aby organizační změny kódy nepřečíslovaly. Povinné je znění aktivity a dílčí proces, ostatní pole jde doplnit později."'
            Width: =176
            X: =Parent.Width - 296
            Y: =102
      # ---------- hledání a filtry ----------
      - lbl_f_Hledat:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =16
            Size: =9
            Text: ="Hledat v názvu"
            Width: =200
            X: =40
            Y: =180
      - txt_Hledat:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =36
            HintText: ="Název začíná na…"
            HoverBorderColor: =stylAkce
            Size: =12
            Tooltip: '="Hledá podle ZAČÁTKU názvu aktivity, ne kdekoli uvnitř. Napíšeš-li Tvorba, najde Tvorba Služebního řádu, ale ne Roční tvorba plánu. Je to daň za rychlost: takový dotaz umí vyřídit SharePoint sám i nad tisíci aktivitami. Fulltext přes celý rejstřík nabízí publikovaná HTML mapa. Prázdné pole znamená bez omezení."'
            Width: =300
            X: =40
            Y: =198
      - lbl_f_Sekce:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =16
            Size: =9
            Text: ="Sekce"
            Width: =160
            X: =352
            Y: =180
      - drp_Sekce:
          Control: Classic/DropDown@2.3.1
          Properties:
            Default: ="(vše)"
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =36
            HoverBorderColor: =stylAkce
            Items: =colSekceNabidka
            OnChange: |-
              =Set(
                  varSekceKod,
                  If(
                      drp_Sekce.Selected.Value = "(vše)",
                      "",
                      Left(drp_Sekce.Selected.Value, Find(" ·", drp_Sekce.Selected.Value & " ·") - 1)
                  )
              )
            Size: =12
            Tooltip: '="Filtruje podle sekce, pod kterou vykonávající útvar patří. Nabídka se plní z číselníku útvarů, takže je úplná bez ohledu na to, kolik aktivit v rejstříku je. Volba (vše) filtr vypne. Filtry se sčítají: sekce, útvar, stav i hledání platí najednou."'
            Width: =160
            X: =352
            Y: =198
      - lbl_f_Utvar:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =16
            Size: =9
            Text: ="Vykonává útvar"
            Width: =200
            X: =524
            Y: =180
      - drp_Utvar:
          Control: Classic/DropDown@2.3.1
          Properties:
            Default: ="(vše)"
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =36
            HoverBorderColor: =stylAkce
            Items: =colUtvarNabidka
            OnChange: |-
              =Set(
                  varUtvarKod,
                  If(
                      drp_Utvar.Selected.Value = "(vše)",
                      "",
                      Left(drp_Utvar.Selected.Value, Find(" ·", drp_Utvar.Selected.Value & " ·") - 1)
                  )
              )
            Size: =12
            Tooltip: '="Filtruje podle útvaru, který aktivitu vykonává. Nabídka je z číselníku útvarů ve tvaru kód · název a obsahuje odbory i oddělení. Chceš-li vidět všechny aktivity jednoho útvaru pro potřeby organizačního řádu, nastav sem útvar a ostatní filtry nech na (vše)."'
            Width: =200
            X: =524
            Y: =198
      - lbl_f_Stav:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =16
            Size: =9
            Text: ="Stav"
            Width: =160
            X: =736
            Y: =180
      - drp_Stav:
          Control: Classic/DropDown@2.3.1
          Properties:
            Default: ="(vše)"
            FocusedBorderColor: =stylAkce
            FocusedBorderThickness: =2
            Font: =Font.'Open Sans'
            Height: =36
            HoverBorderColor: =stylAkce
            Items: =["(vše)", "pracovní", "schváleno"]
            Size: =12
            Tooltip: '="Pracovní je rozpracovaný záznam, na kterém se ještě pracuje. Schváleno je potvrzené znění, které smí jít do organizačního řádu. Stav se přepíná v detailu aktivity; schvalovací kolečko s notifikacemi zatím není součástí řešení."'
            Width: =160
            X: =736
            Y: =198
      - rec_ChipPocet:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPlocha
            Height: =36
            Width: =200
            X: =Parent.Width - 452
            Y: =198
      - lbl_ChipPocet:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =36
            Size: =11
            Text: |-
              =CountRows(gal_Aktivity.AllItems) & " zobrazených aktivit"
            VerticalAlign: =VerticalAlign.Middle
            Width: =200
            X: =Parent.Width - 452
            Y: =198
      - rec_ChipFiltr:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylPlocha
            Height: =36
            Width: =200
            X: =Parent.Width - 240
            Y: =198
      - lbl_ChipFiltr:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            Height: =36
            Size: =11
            Text: |-
              =If(
                  IsBlank(txt_Hledat.Text) && IsBlank(varSekceKod) && IsBlank(varUtvarKod) && drp_Stav.Selected.Value = "(vše)",
                  "Bez filtru — celý rejstřík",
                  "Filtrováno"
              )
            VerticalAlign: =VerticalAlign.Middle
            Width: =200
            X: =Parent.Width - 240
            Y: =198
      # ---------- hlavička tabulky (klik = řazení) ----------
      - lbl_h_Kod:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            HoverColor: =stylAkce
            OnSelect: |-
              =Set(varRazeniAsc, If(varRazeni = "kod", !varRazeniAsc, true));
              Set(varRazeni, "kod")
            PressedColor: =stylAkceStisk
            Size: =10
            Text: |-
              ="KÓD" & If(varRazeni = "kod", If(varRazeniAsc, " ↑", " ↓"), "")
            Tooltip: '="Seřadí podle identifikačního kódu, tedy v pořadí rejstříku. Další klik obrátí směr."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =140
            X: =56
            Y: =246
      - lbl_h_Nazev:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            HoverColor: =stylAkce
            OnSelect: |-
              =Set(varRazeniAsc, If(varRazeni = "nazev", !varRazeniAsc, true));
              Set(varRazeni, "nazev")
            PressedColor: =stylAkceStisk
            Size: =10
            Text: |-
              ="AKTIVITA" & If(varRazeni = "nazev", If(varRazeniAsc, " ↑", " ↓"), "")
            Tooltip: '="Seřadí abecedně podle názvu aktivity. Další klik obrátí směr."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =300
            X: =208
            Y: =246
      - lbl_h_Utvar:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            HoverColor: =stylAkce
            OnSelect: |-
              =Set(varRazeniAsc, If(varRazeni = "utvar", !varRazeniAsc, true));
              Set(varRazeni, "utvar")
            PressedColor: =stylAkceStisk
            Size: =10
            Text: |-
              ="VYKONÁVÁ" & If(varRazeni = "utvar", If(varRazeniAsc, " ↑", " ↓"), "")
            Tooltip: '="Seskupí za sebe aktivity téhož útvaru. Další klik obrátí směr."'
            VerticalAlign: =VerticalAlign.Middle
            Width: =120
            X: =Parent.Width - 502
            Y: =246
      - lbl_h_Sekce:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =10
            Text: ="SEKCE"
            VerticalAlign: =VerticalAlign.Middle
            Width: =100
            X: =Parent.Width - 370
            Y: =246
      - lbl_h_Stav:
          Control: Label@2.5.1
          Properties:
            Color: =stylTextSlaby
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =10
            Text: ="STAV"
            VerticalAlign: =VerticalAlign.Middle
            Width: =110
            X: =Parent.Width - 258
            Y: =246
      - rec_HlavickaLinka:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =stylOkraj
            Height: =1
            Width: =Parent.Width - 80
            X: =40
            Y: =274
      # ---------- galerie ----------
      - gal_Aktivity:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Height: =Parent.Height - Self.Y - 24
            Items: |-
              =Switch(
                  varRazeni,
                  "nazev",
                  Sort(Filter(
                      Aktivity,
                      IsBlank(txt_Hledat.Text) || StartsWith(nazev_kratky, txt_Hledat.Text),
                      IsBlank(varSekceKod) || sekce = varSekceKod,
                      IsBlank(varUtvarKod) || vykonava = varUtvarKod,
                      drp_Stav.Selected.Value = "(vše)" || stav.Value = drp_Stav.Selected.Value
                  ), nazev_kratky, If(varRazeniAsc, SortOrder.Ascending, SortOrder.Descending)),
                  "utvar",
                  Sort(Filter(
                      Aktivity,
                      IsBlank(txt_Hledat.Text) || StartsWith(nazev_kratky, txt_Hledat.Text),
                      IsBlank(varSekceKod) || sekce = varSekceKod,
                      IsBlank(varUtvarKod) || vykonava = varUtvarKod,
                      drp_Stav.Selected.Value = "(vše)" || stav.Value = drp_Stav.Selected.Value
                  ), vykonava, If(varRazeniAsc, SortOrder.Ascending, SortOrder.Descending)),
                  Sort(Filter(
                      Aktivity,
                      IsBlank(txt_Hledat.Text) || StartsWith(nazev_kratky, txt_Hledat.Text),
                      IsBlank(varSekceKod) || sekce = varSekceKod,
                      IsBlank(varUtvarKod) || vykonava = varUtvarKod,
                      drp_Stav.Selected.Value = "(vše)" || stav.Value = drp_Stav.Selected.Value
                  ), Title, If(varRazeniAsc, SortOrder.Ascending, SortOrder.Descending))
              )
            TemplatePadding: =0
            TemplateSize: =56
            # Pohyb řádku při najetí myší. Bez toho galerie na hover nereaguje
            # vůbec — Transition je jediná vlastnost, která to zapíná.
            Transition: =Transition.Push
            Width: =Parent.Width - 80
            X: =40
            Y: =276
          Children:
            - rec_RadekPozadi:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(ThisItem.IsSelected, stylRadekVybrany, stylKarta)
                  Height: =Parent.TemplateHeight - 1
                  HoverFill: =stylRadekHover
                  OnSelect: |-
                    =Set(varNova, false);
                    Set(varAktivita, ThisItem);
                    Navigate(scr_Detail, ScreenTransition.Cover)
                  PressedFill: =stylRadekVybrany
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - rec_RadekLinka:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =stylOkraj
                  Height: =1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =Parent.TemplateHeight - 1
            - lbl_Kod:
                Control: Label@2.5.1
                Properties:
                  Color: =stylText
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  OnSelect: |-
                    =Set(varNova, false);
                    Set(varAktivita, ThisItem);
                    Navigate(scr_Detail, ScreenTransition.Cover)
                  Size: =11
                  Text: =ThisItem.Title
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =140
                  X: =16
                  Y: =0
            - lbl_Nazev:
                Control: Label@2.5.1
                Properties:
                  Color: =stylText
                  Font: =Font.'Open Sans'
                  FontWeight: |-
                    =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Parent.TemplateHeight - 1
                  OnSelect: |-
                    =Set(varNova, false);
                    Set(varAktivita, ThisItem);
                    Navigate(scr_Detail, ScreenTransition.Cover)
                  PaddingBottom: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.nazev_kratky
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.TemplateWidth - 638
                  X: =168
                  Y: =0
            - lbl_Utvar:
                Control: Label@2.5.1
                Properties:
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  OnSelect: |-
                    =Set(varNova, false);
                    Set(varAktivita, ThisItem);
                    Navigate(scr_Detail, ScreenTransition.Cover)
                  Size: =11
                  Text: =ThisItem.vykonava
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =120
                  X: =Parent.TemplateWidth - 462
                  Y: =0
            - lbl_Sekce:
                Control: Label@2.5.1
                Properties:
                  Color: =stylTextSlaby
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  OnSelect: |-
                    =Set(varNova, false);
                    Set(varAktivita, ThisItem);
                    Navigate(scr_Detail, ScreenTransition.Cover)
                  Size: =11
                  Text: =ThisItem.sekce
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =100
                  X: =Parent.TemplateWidth - 330
                  Y: =0
            - lbl_Stav:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(ThisItem.stav.Value = "schváleno", stylUspech, stylPozor)
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - 1
                  OnSelect: |-
                    =Set(varNova, false);
                    Set(varAktivita, ThisItem);
                    Navigate(scr_Detail, ScreenTransition.Cover)
                  Size: =11
                  Text: =ThisItem.stav.Value
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =110
                  X: =Parent.TemplateWidth - 218
                  Y: =0
            - ico_Detail:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =stylTextSlaby
                  Height: =32
                  Icon: =Icon.ChevronRight
                  PaddingBottom: =9
                  PaddingLeft: =9
                  PaddingRight: =9
                  PaddingTop: =9
                  Width: =32
                  X: =Parent.TemplateWidth - 56
                  Y: =(Parent.TemplateHeight - 1) / 2 - 16
            # Průhledná vrstva PŘES celý řádek, poslední = nejvýš.
            # Hover dostane jen control přímo pod kurzorem, a řádek je ze čtyř
            # pětin pokrytý labely — podkladový obdélník se ho proto nikdy
            # nedočkal a řádek na najetí nereagoval. Tahle vrstva hover
            # zachytí za celý řádek a zároveň dělá kliknutí kamkoli.
            # Label, ne Rectangle: jen Label umí HoverBorderColor.
            - lbl_RadekPrekryv:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderThickness: =2
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight - 1
                  HoverBorderColor: =stylAkce
                  HoverFill: =RGBA(0, 90, 181, 0.10)
                  OnSelect: |-
                    =Set(varNova, false);
                    Set(varAktivita, ThisItem);
                    Navigate(scr_Detail, ScreenTransition.Cover)
                  PressedFill: =RGBA(0, 90, 181, 0.20)
                  Text: =""
                  Tooltip: '="Otevře detail aktivity: úplné znění, vykonávající útvar, spolupráci, vnitřní předpis a zařazení do dílčích procesů. Odtud se aktivita také maže."'
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
