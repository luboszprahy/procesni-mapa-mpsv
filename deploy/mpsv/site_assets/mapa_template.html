<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procesní mapa MPSV</title>
<style>
  :root{
    /* Paleta zadaná uživatelem 07.09.2026, čtvrtá v pořadí (Adobe Color):
       #86A2E3 #52729E #332F74 #60ACEF #5B5290. Plná sytost jako plocha vrstvy,
       písmo bílé nebo tmavé podle měření — tak, jak to Adobe ukazuje i na
       svých pruzích.

       Tahle paleta se od předchozích liší tím, že se sama odstupňuje: seřazená
       podle relativní luminance dá 0,040 → 0,103 → 0,163 → 0,365, což je přesně
       čtyřstupňová řada od agendy po aktivitu. Vrstvy tedy odlišuje jak odstín,
       tak světlost.

       Bílé písmo unesou tři nejtmavší (11,67 / 6,88 / 4,93), aktivita je světlá
       a nese tmavé (6,27). Kde je bílá těsná (#52729E má 4,93), je i sekundární
       text čistě bílý — odlišuje ho velikost, ne barva, protože na světlejší
       šedou tam už kontrast nezbývá.

       `#60ACEF` je akcent vybrané karty. `--k` je ztmavená varianta #86A2E3:
       hlavička sloupce, kolečko značky a spojnice na ní potřebují bílý text
       a tenká čára potřebuje být vidět. */
    --bg:#f5f6fb; --panel:#fff; --ink:#1b2233; --muted:#4a5266; --line:#dce1ec;
    --a:#332f74; --p:#5b5290; --d:#52729e; --k:#53648d;
    --chip:#e9ebf5; --hit:#fff3bf; --akcent:#60acef;
    --shadow:0 1px 3px rgba(51,47,116,.14);
    /* PLNÁ sytost jako plocha vrstvy — od nejtmavší po nejsvětlejší.
       Platí pro OBA rozklady; řádkové zobrazení má vlastní světlou řadu níž. */
    --a-bg:#332f74; --p-bg:#5b5290; --d-bg:#52729e; --k-bg:#86a2e3;
    /* Řádkové zobrazení: tytéž barvy naředěné bílou (76 %) a všude černé písmo
       (rozhodl uživatel 07.09.2026). Řádek je úzký pruh přes celou šířku, takže
       plná sytost, která na kartách rozkladu funguje, tu dělá z každé stránky
       pruhovanou plochu. Černý text má na těchhle podkladech 10,1 až 13,0:1. */
    --a-row:#cecdde; --p-row:#d8d5e4; --d-row:#d5dde8; --k-row:#e2e9f8;
    /* písmo na té ploše */
    --a-fg:#ffffff; --p-fg:#ffffff; --d-fg:#ffffff; --k-fg:var(--ink);
    --a-fg2:#e9eef8; --p-fg2:#e9eef8; --d-fg2:#ffffff; --k-fg2:#2a3140;
    /* svislé linky u karet a řádků — plné barvy palety */
    --a-line:#332f74; --p-line:#5b5290; --d-line:#52729e; --k-line:#86a2e3;
    /* jediné místo, které řídí velikost písma celé stránky (viz #fVelikost) */
    --fs:14px;
  }
  *{box-sizing:border-box}
  html{font-size:var(--fs)}
  body{margin:0;font:1rem/1.5 "Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--a);color:#fff;padding:12px 12px}
  header h1{margin:0;font-size:1.36rem;font-weight:600}
  header .meta{margin-top:4px;font-size:.89rem;opacity:.92}
  .counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .counts b{background:rgba(255,255,255,.15);border-radius:4px;padding:3px 9px;font-weight:600;font-size:.86rem}
  .bar{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 12px;
       display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5}
  .bar input[type=search],.bar select{font:inherit;padding:6px 9px;border:1px solid var(--line);
       border-radius:5px;background:#fff;color:inherit}
  /* Užší minimum než 260 px: delší popisek „Řádkové zobrazení" jinak vytlačí
     přepínač velikosti písma na druhý řádek lišty (07.09.2026). */
  .bar input[type=search]{min-width:190px;flex:1 1 190px}
  .bar label{display:flex;align-items:center;gap:6px;font-size:.93rem;color:var(--muted);white-space:nowrap}
  .bar button{font:inherit;padding:6px 11px;border:1px solid var(--line);border-radius:5px;
       background:#fff;cursor:pointer;color:var(--a)}
  .bar button:hover{background:var(--chip)}
  .fs{display:flex;gap:0;border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .fs button{border:0;border-left:1px solid var(--line);border-radius:0;padding:6px 10px}
  .fs button:first-child{border-left:0}
  .fs button[aria-pressed=true]{background:var(--a);color:#fff}
  /* velikosti v px, ne rem — přepínač musí zůstat stejně velký po celou dobu */
  .fs button[data-fs="12"]{font-size:11px}
  .fs button[data-fs="14"]{font-size:13px}
  .fs button[data-fs="16"]{font-size:15px}
  .fs button[data-fs="19"]{font-size:18px}
  /* Úzké okraje: plocha mapy je to jediné, co na téhle stránce potřebuje
     místo — 20px po stranách a 330px panel braly přes 380 px (07.09.2026). */
  main{display:flex;gap:10px;align-items:flex-start;padding:12px 10px 28px}
  #tree{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);
        border-radius:8px;box-shadow:var(--shadow);padding:8px 10px}
  #detail{flex:0 0 248px;position:sticky;top:64px;background:var(--panel);border:1px solid var(--line);
        border-radius:8px;box-shadow:var(--shadow);padding:12px 13px;max-height:calc(100vh - 90px);overflow:auto}
  #detail h2{margin:0 0 10px;font-size:1rem;color:var(--a)}
  #detail dt{font-size:.82rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-top:10px}
  #detail dd{margin:2px 0 0}
  /* ---- rozkladový diagram ---- */
  .prep{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .prep button{border:0;border-left:1px solid var(--line);border-radius:0;padding:6px 12px}
  .prep button:first-child{border-left:0}
  .prep button[aria-pressed=true]{background:var(--a);color:#fff}
  #rozklad{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);
        border-radius:8px;box-shadow:var(--shadow);padding:0;position:relative;overflow:hidden}
  .rz-hlavicky{display:flex;border-bottom:1px solid var(--line);background:var(--chip)}
  /* Pevná čtvrtina, ne `flex:1 1 0`: při menším počtu sloupců by se zbylé
     roztáhly přes celou plochu a karty v nich s nimi (07.09.2026). Šířka
     karty tak zůstává stejná, ať je vidět jeden sloupec nebo čtyři. */
  .rz-hlavicky div{flex:0 0 25%;min-width:0;padding:9px 12px;font-size:.84rem;font-weight:700;
        letter-spacing:.06em;text-transform:uppercase;color:#fff;border-left:1px solid var(--panel)}
  /* Barvy jsou ZTMAVENÉ varianty palety (--a/--p/--d/--k), ne plné --*-line:
     bílý text má na plném tyrkysu jen 3,16:1 a na zelené 3,31:1, tedy pod
     WCAG AA. Takhle je nejtěsnější 7,28:1. */
  .rz-hlavicky div:nth-child(1){background:var(--a)}
  .rz-hlavicky div:nth-child(2){background:var(--p)}
  .rz-hlavicky div:nth-child(3){background:var(--d)}
  .rz-hlavicky div:nth-child(4){background:var(--k)}
  .rz-hlavicky div:first-child{border-left:0}
  .rz-hlavicky div[hidden]{display:none}
  .rz-sloupce{display:flex;position:relative}
  .rz-sloupec{flex:0 0 25%;min-width:0;border-left:1px solid var(--line);padding:14px 0 14px 12px;
        max-height:calc(100vh - 210px);overflow-y:auto;overflow-x:hidden}
  /* Podklad sloupce je táž barva jako karta, jen zesvětlená smícháním s bílou.
     Stupeň je tak vidět i pod hlavičkou a karta se od něj přesto odliší. */
  .rz-sloupec[data-uroven="0"]{background:#f1f0f5}
  .rz-sloupec[data-uroven="1"]{background:#f4f3f7}
  .rz-sloupec[data-uroven="2"]{background:#f3f5f8}
  .rz-sloupec[data-uroven="3"]{background:#f7f8fd}
  .rz-sloupec:first-child{border-left:0}
  /* Spojnice leží pod uzly a nesmí brát kliknutí. */
  #rzSpojnice{position:absolute;inset:0;pointer-events:none;z-index:0}
  /* Karta nezabírá celou šířku sloupce: vpravo zůstává pruh, kterým vede
     spojnice do dalšího sloupce. Bez něj se čára krčila do mezery mezi
     sloupci a byla prakticky neviditelná (07.09.2026). */
  .rz-uzel{position:relative;z-index:1;width:48%;min-width:165px;
        background:var(--panel);border:1px solid var(--line);
        border-left:4px solid var(--line);border-radius:6px;padding:6px 22px 6px 9px;margin:0 0 28px;
        cursor:pointer;display:flex;flex-direction:column;gap:2px;
        transition:box-shadow .12s,transform .12s}
  /* Výplň nese vrstvu, stejně jako ve stromu — barva řekne úroveň dřív než
     text. Odstíny jsou světlé odvozeniny palety, aby text zůstal čitelný. */
  .rz-uzel.lvl-a{background:var(--a-bg);border-left-color:var(--a-line);color:var(--a-fg)}
  .rz-uzel.lvl-p{background:var(--p-bg);border-left-color:var(--p-line);color:var(--p-fg)}
  .rz-uzel.lvl-d{background:var(--d-bg);border-left-color:var(--d-line);color:var(--d-fg)}
  .rz-uzel.lvl-k{background:var(--k-bg);border-left-color:var(--k-line);color:var(--k-fg)}
  .rz-uzel.lvl-k .rz-kod,.rz-uzel.lvl-k .rz-odznak{color:var(--k-fg2)}
  .rz-uzel.lvl-a .rz-kod,.rz-uzel.lvl-a .rz-odznak{color:var(--a-fg2)}
  .rz-uzel.lvl-p .rz-kod,.rz-uzel.lvl-p .rz-odznak{color:var(--p-fg2)}
  .rz-uzel.lvl-d .rz-kod,.rz-uzel.lvl-d .rz-odznak{color:var(--d-fg2)}
  /* Nezmapovaná položka se drží šedé `--muted` — ta má ale na sytých plochách
     málo kontrastu, takže na nich přebírá světlou/tmavou barvu své vrstvy. */
  .rz-uzel.lvl-a.unmapped .rz-nazev,.rz-uzel.lvl-p.unmapped .rz-nazev{color:var(--a-fg2)}
  .rz-uzel.lvl-d.unmapped .rz-nazev{color:var(--d-fg2)}
  .rz-uzel.lvl-k.unmapped .rz-nazev{color:var(--k-fg2)}
  .rz-uzel:hover{box-shadow:0 2px 8px rgba(51,47,116,.30);transform:translateY(-1px)}
  /* Vybraná karta se pozná rámečkem a stínem, ne jinou výplní — tu už drží
     vrstva a dvě barevné soustavy najednou by se bily. */
  .rz-uzel[aria-selected=true]{border-color:var(--akcent);border-width:2px;
        box-shadow:0 0 0 3px rgba(96,172,239,.50),0 2px 10px rgba(51,47,116,.30)}
  .rz-uzel .rz-kod{font-family:Consolas,"Courier New",monospace;font-size:.76rem;color:var(--muted)}
  .rz-uzel .rz-nazev{font-size:.87rem;line-height:1.3}
  .rz-uzel .rz-odznak{align-self:flex-start;font-size:.71rem;color:var(--muted)}
  /* Značka „jde rozpadnout níž" — jen na kartách, které mají potomky.
     Karta bez ní je konec větve, ne nedoklikaná cesta. Je to kolečko
     v barvě vrstvy, ne holá šipka: sedí přesně v bodě, ze kterého
     vycházejí spojnice, takže je vidět, že za ně může tahle karta
     (07.09.2026). */
  .rz-uzel .rz-sipka{position:absolute;right:4px;top:50%;transform:translateY(-50%);
        width:19px;height:19px;border-radius:50%;color:#fff;background:var(--muted);
        display:flex;align-items:center;justify-content:center;
        font-size:1rem;font-weight:700;line-height:1;opacity:.95;
        box-shadow:0 1px 3px rgba(51,47,116,.30)}
  /* Na syté ploše je kolečko bílé s barevnou šipkou — tmavé by v ní zmizelo. */
  .rz-uzel.lvl-a .rz-sipka{background:#fff;color:var(--a)}
  .rz-uzel.lvl-p .rz-sipka{background:#fff;color:var(--p)}
  .rz-uzel.lvl-d .rz-sipka{background:#fff;color:var(--d)}
  .rz-uzel.lvl-k .rz-sipka{background:var(--k);color:#fff}
  .rz-uzel:hover .rz-sipka{opacity:1;transform:translateY(-50%) translateX(2px)}
  .rz-uzel[aria-selected=true] .rz-sipka{opacity:1}
  .rz-uzel.unmapped .rz-nazev{color:var(--muted)}
  .rz-prazdno{color:var(--muted);font-size:.88rem;padding:6px 4px}
  /* ---- vodorovná varianta rozkladu: vrstvy jako pásy pod sebou ---- */
  /* Druhé rozvržení téhož rozkladu (zadal uživatel 07.09.2026, obě zůstávají).
     Sloupce se hodí, když má být vidět dlouhý seznam v jedné úrovni; pásy když
     má být vidět tvar větve, protože rozpad jde odshora dolů jako v org. schématu. */
  #rozkladH{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);
        border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
  .rzh-pasy{position:relative}
  .rzh-pas{display:flex;align-items:stretch;border-top:1px solid var(--line)}
  .rzh-pas:first-child{border-top:0}
  .rzh-pas[data-uroven="0"]{background:#f1f0f5}
  .rzh-pas[data-uroven="1"]{background:#f4f3f7}
  .rzh-pas[data-uroven="2"]{background:#f3f5f8}
  .rzh-pas[data-uroven="3"]{background:#f7f8fd}
  /* Hlavička je štítek, ne plocha: plný tmavý blok přes celou výšku pásu byl
     nejsytější věc na obrazovce a přebíjel karty, o které jde (07.09.2026). */
  .rzh-hlavicka{flex:0 0 84px;padding:12px 8px;font-size:.76rem;font-weight:700;
        letter-spacing:.05em;text-transform:uppercase;line-height:1.2;
        border-right:3px solid var(--line);background:transparent}
  .rzh-pas[data-uroven="0"] .rzh-hlavicka{color:var(--a);border-right-color:var(--a)}
  .rzh-pas[data-uroven="1"] .rzh-hlavicka{color:var(--p);border-right-color:var(--p)}
  .rzh-pas[data-uroven="2"] .rzh-hlavicka{color:var(--d);border-right-color:var(--d)}
  .rzh-pas[data-uroven="3"] .rzh-hlavicka{color:var(--k);border-right-color:var(--k)}
  /* Řádka roluje vodorovně — 250 dílčích procesů se vedle sebe nevejde a pás
     se kvůli nim nesmí zalomit, jinak přestane být poznat, co je jedna úroveň. */
  /* `stretch` místo `flex-start`: karty v pásu tvoří mřížku, ne schody.
     Výšku řádky přitom drží na uzdě ořez názvu níž — bez něj ji jediný
     dlouhý název natáhl na čtyři řádky a pás zabral půl obrazovky.
     Mezery jsou vzaté ze sloupcové varianty: tam karta zabírá 48 %
     šířky sloupce a zbytek je pruh, kterým vede spojnice — tady je to
     spodní odsazení řádky, do kterého se vějíř čar rozbíhá. */
  .rzh-radka{flex:1 1 auto;min-width:0;display:flex;gap:30px;padding:14px 18px 46px;
        overflow-x:auto;overflow-y:hidden;align-items:stretch}
  /* Karta má v pásu pevnou šířku (ve sloupci je to procento jeho šířky) a dole
     místo pro spojnici do dalšího pásu — obdoba pruhu vpravo u sloupců. */
  .rzh-radka .rz-uzel{flex:0 0 186px;width:186px;margin:0;padding:6px 9px 16px}
  /* Dlouhý název se ořízne na tři řádky; celý zůstává v nápovědě karty. */
  .rzh-radka .rz-nazev{display:-webkit-box;-webkit-line-clamp:3;
        -webkit-box-orient:vertical;overflow:hidden}
  .rzh-radka .rz-odznak{margin-top:auto}
  /* Rozpad vede dolů, ne doprava — značka se otočí a sedne pod text. */
  /* V pásu sedí kolečko dole uprostřed — v místě, odkud vede vějíř spojnic. */
  .rzh-radka .rz-sipka{right:auto;top:auto;left:50%;bottom:1px;
        transform:translateX(-50%) rotate(90deg)}
  .rzh-radka .rz-uzel:hover .rz-sipka{transform:translateX(-50%) rotate(90deg) translateX(2px)}
  #rzhSpojnice{position:absolute;inset:0;pointer-events:none;z-index:0}
  .node{border-radius:5px}
  /* Mezera za každým řádkem — i mezi rodičem a jeho prvním potomkem. Bez ní
     na sebe barevné pruhy vrstev navazovaly a splývaly v jednu plochu. */
  .row{display:flex;align-items:flex-start;gap:7px;padding:4px 6px;border-radius:5px;cursor:default;
       border-left:3px solid transparent;margin-bottom:4px}
  .row:hover{background:var(--chip)}
  .tw{flex:0 0 16px;width:16px;text-align:center;color:var(--muted);cursor:pointer;
      user-select:none;font-size:.79rem;line-height:1.9}
  .tw.leaf{cursor:default;opacity:.35}
  .kod{flex:0 0 auto;font-family:Consolas,"Courier New",monospace;font-size:.86rem;color:var(--muted);
       background:var(--chip);border-radius:3px;padding:1px 5px;margin-top:1px}
  body.bez-kodu .kod{display:none}
  body.bez-kodu .rz-kod{display:none}
  .nm{flex:1 1 auto;min-width:0}
  /* vrstvy se liší podkladem řádku a barvou svislé linky, ne jen barvou písma */
  .lvl-a>.row{background:var(--a-row);border-left-color:var(--a-line)}
  .lvl-p>.row{background:var(--p-row);border-left-color:var(--p-line)}
  .lvl-d>.row{background:var(--d-row);border-left-color:var(--d-line)}
  .lvl-k>.row{background:var(--k-row);border-left-color:var(--k-line)}
  /* Text je ve všech vrstvách černý; úroveň říká podklad, svislá linka
     a odsazení, ne barva písma. */
  .lvl-a>.row>.nm{font-weight:600;color:var(--ink);font-size:1.07rem}
  .lvl-p>.row>.nm{font-weight:600;color:var(--ink)}
  .lvl-d>.row>.nm{color:var(--ink)}
  .lvl-k>.row>.nm{color:var(--ink)}
  .lvl-a>.row>.kod,.lvl-p>.row>.kod,.lvl-d>.row>.kod,.lvl-k>.row>.kod{
        background:rgba(255,255,255,.65);color:var(--muted)}
  .lvl-k>.row{cursor:pointer}
  /* Odsazení stupně 32+22 px. Dvě věci, které se snadno pletou: kde strom
     ZAČÍNÁ (to řeší úzký okraj `main`) a jak velký je KROK mezi úrovněmi.
     Krok musí být výrazný, jinak hlubší úroveň vypadá zarovnaně s tou nad
     ní — přesně to se stalo 24.08.2026 při 17+9 px. Od 20:11 je 32+22 px. */
  .kids{margin-left:32px;border-left:1px solid var(--line);padding-left:22px}
  .lvl-a>.kids{border-left-color:var(--a-line)}
  .lvl-p>.kids{border-left-color:var(--p-line)}
  .lvl-d>.kids{border-left-color:var(--d-line)}
  .hide{display:none}
  .badge{flex:0 0 auto;font-size:.79rem;border-radius:9px;padding:1px 7px;background:var(--chip);
         color:var(--muted);margin-top:2px;white-space:nowrap}
  .badge.no{background:#fdecea;color:#a3352a}
  .node.unmapped > .row > .nm{opacity:.62;font-style:italic}
  /* Barevná legenda vrstev je pryč (07.09.2026): monochromatická řada
     nemá co vysvětlovat a v rozkladu úroveň říká hlavička sloupce.
     Zůstala jen vysvětlivka odznaku — a ta patří ke stromu, takže se
     v rozkladu schová celá (viz prekresli()). */
  .legend{font-size:.86rem;color:var(--muted);padding:8px 12px 0;line-height:1.7}
  .legend[hidden]{display:none}
  .legend .badge{margin:0 2px;font-weight:600}
  .badge.ut{background:#e7ecf4;color:var(--d)}
  /* `mark` dědí barvu textu — na syté ploše by to byla bílá na žluté. */
  mark{background:var(--hit);color:var(--ink);padding:0 1px}
  .empty{padding:20px;color:var(--muted);text-align:center}
  @media (max-width:900px){main{flex-direction:column}#detail{position:static;flex:1 1 auto;width:100%}}
</style>
</head>
<body>
<header>
  <h1>Procesní mapa MPSV</h1>
  <div class="meta" id="meta"></div>
  <div class="counts" id="counts"></div>
</header>

<div class="bar">
  <span class="prep" id="fZobrazeni" title="Rozklad ukazuje úrovně vedle sebe: vodorovná varianta v pásech pod sebou, svislá ve sloupcích. Řádkové zobrazení rozbaluje celou strukturu pod sebou. Obsah je ve všech třech stejný, liší se jen rozvržení.">
    <button type="button" data-zobrazeni="rozkladH" aria-pressed="true">Rozklad vodorovně</button>
    <button type="button" data-zobrazeni="rozklad">Rozklad svisle</button>
    <button type="button" data-zobrazeni="strom">Řádkové zobrazení</button>
  </span>
  <input type="search" id="q" placeholder="Hledat v agendách, procesech, dílčích procesech a aktivitách…" autocomplete="off">
  <select id="fUtvar"><option value="">Vykonává útvar: vše</option></select>
  <select id="fStav" title="Filtruje podle stavu aktivit, stejně jako přehled v aplikaci. Větev, ve které po odfiltrování žádná aktivita nezbude, se schová.">
    <option value="">Stav: vše</option>
    <option value="schváleno">Stav: schváleno</option>
    <option value="pracovní">Stav: pracovní</option>
  </select>
  <select id="fUroven" title="Ve stromu: do které vrstvy se rozbalí. V rozkladu: kolik sloupců je vidět.">
    <option value="1">Rozbalit: jen agendy</option>
    <option value="2" selected>Rozbalit: + procesy</option>
    <option value="3">Rozbalit: + dílčí procesy</option>
    <option value="4">Rozbalit: vše až po aktivity</option>
  </select>
  <label title="Skryje identifikační kódy ve stromu. Hledat podle kódu jde dál."><input type="checkbox" id="cKod" checked> Zobrazit kód</label>
  <label title="Nechá ve stromu jen položky, kterým chybí nadřazená úroveň rejstříku — visí pod uzlem Nezařazené. Jinde je nenajdeš, protože strom ukazuje jen to, co má nad sebou předka."><input type="checkbox" id="cOsirele"> Jen osiřelé</label>
  <span class="fs" id="fVelikost" title="Velikost písma celé stránky">
    <button type="button" data-fs="12">A</button>
    <button type="button" data-fs="14" aria-pressed="true">A</button>
    <button type="button" data-fs="16">A</button>
    <button type="button" data-fs="19">A</button>
  </span>
</div>

<div class="legend" id="legenda">Odznak vpravo v řádku říká, kolik aktivit je uvnitř větve.
  <b class="badge no">bez aktivit</b> = položka v rejstříku je, ale činnosti k ní zatím nikdo nepopsal.
</div>

<main>
  <div id="tree"></div>
  <div id="rozklad" hidden>
    <div class="rz-hlavicky">
      <div>Agenda</div><div>Proces</div><div>Dílčí proces</div><div>Aktivita</div>
    </div>
    <div class="rz-sloupce" id="rzSloupce">
      <svg id="rzSpojnice" aria-hidden="true"></svg>
    </div>
  </div>
  <div id="rozkladH" hidden>
    <div class="rzh-pasy" id="rzhPasy">
      <svg id="rzhSpojnice" aria-hidden="true"></svg>
    </div>
  </div>
  <aside id="detail"><h2>Detail</h2><div id="detailBody" class="empty">Klikni na aktivitu.</div></aside>
</main>

<script>
const DATA = __DATA_JSON__;

const norm = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

/* ---- sestavení stromu z plochých tabulek ---- */
function buildTree(d){
  const linksByAkt = {};
  d.vazby.forEach(v => (linksByAkt[v.aktivita_kod] = linksByAkt[v.aktivita_kod] || []).push(v.dilci_proces_kod));
  const aktByDp = {};
  d.aktivity.forEach(a => {
    const dps = linksByAkt[a.kod] || [a.dilci_proces_kod];
    dps.forEach(dp => (aktByDp[dp] = aktByDp[dp] || []).push(a));
  });
  const dpByProces = {}, procByAgenda = {};
  d.dilci_procesy.forEach(x => (dpByProces[x.proces_kod] = dpByProces[x.proces_kod] || []).push(x));
  d.procesy.forEach(x => (procByAgenda[x.agenda_kod] = procByAgenda[x.agenda_kod] || []).push(x));

  const uzelAkt = k => ({
    lvl:"k", kod:k.kod, nazev:k.nazev, utvar:k.vykonava, rec:k, kids:[]
  });
  const uzelDp = dp => ({
    lvl:"d", kod:dp.kod, nazev:dp.nazev, vlastnik:dp.vlastnik, stav:dp.stav, rec:dp,
    kids:(aktByDp[dp.kod]||[]).map(uzelAkt)
  });
  const uzelProces = p => ({
    lvl:"p", kod:p.kod, nazev:p.nazev, vlastnik:p.vlastnik, rec:p,
    kids:(dpByProces[p.kod]||[]).map(uzelDp)
  });

  const strom = d.agendy.map(a => ({
    lvl:"a", kod:a.kod, nazev:a.nazev, vlastnik:a.vlastnik, rec:a,
    kids:(procByAgenda[a.kod]||[]).map(uzelProces)
  }));

  /* Strom se skládá shora, takže co nemá živého rodiče, do něj nevstoupí —
     a z mapy by zmizelo beze stopy, včetně aktivit pod tím. Smazání položky
     číselníku je přitom běžná operace a v appce si osiřelé záznamy najdete
     přepínačem „osiřelé"; mapa o nich musí mluvit taky, jinak si čtenář
     myslí, že rejstřík je menší, než ve skutečnosti je. */
  const kodyAgend = new Set(d.agendy.map(x => x.kod));
  const kodyProcesu = new Set(d.procesy.map(x => x.kod));
  const kodyDp = new Set(d.dilci_procesy.map(x => x.kod));

  const sirotci = [
    ...d.procesy.filter(x => !kodyAgend.has(x.agenda_kod)).map(uzelProces),
    ...d.dilci_procesy.filter(x => !kodyProcesu.has(x.proces_kod)).map(uzelDp),
    ...d.aktivity
      .filter(a => !(linksByAkt[a.kod] || [a.dilci_proces_kod]).some(dp => kodyDp.has(dp)))
      .map(uzelAkt)
  ];

  if (sirotci.length) {
    strom.push({
      lvl:"a", kod:"—", sirotek:true,
      nazev:"Nezařazené — chybí nadřazená položka rejstříku",
      vlastnik:"", rec:{}, kids:sirotci
    });
  }
  return strom;
}

const TREE = buildTree(DATA);
const walk = (ns,f) => ns.forEach(n => { walk(n.kids,f); f(n); });
/* aktS = kolik aktivit ve větvi je schválených. Počítá se jednou při stavbě,
   ne při každém překreslení — filtr stavu je pak jen porovnání dvou čísel.
   Aktivita bez vyplněného stavu patří mezi pracovní: import ji plní hodnotou
   „pracovní", ale ručně založená ji mít nemusí a nikam zmizet nesmí. */
walk(TREE, n => {
  n.aktCount = n.lvl==="k" ? 1 : n.kids.reduce((s,c)=>s+(c.aktCount||0),0);
  n.aktS = n.lvl==="k" ? ((n.rec||{}).stav === "schváleno" ? 1 : 0)
                       : n.kids.reduce((s,c)=>s+(c.aktS||0),0);
  n.hay = norm(n.kod+" "+n.nazev+" "+(n.utvar||""));
});

/* ---- filtr ----
   Jediné místo, kde se rozhoduje, co filtry propustí. Používá ho strom
   i rozkladový diagram; kdyby každý filtroval po svém, rozešly by se
   a čtenář by ve dvou zobrazeních téhož rejstříku viděl jiná čísla. */
function filtruj(n, q, ut, stav, forced){
  const hit    = forced || !q || n.hay.includes(q);
  const selfUt = n.lvl !== "k" || !ut || (n.utvar||"").split(/,\s*/).includes(ut);
  // shoda na uzlu zpristupni celou jeho podstrukturu
  const kids = n.kids
    .map(c => filtruj(c, q, ut, stav, forced || (!!q && n.hay.includes(q))))
    .filter(Boolean);
  /* Stav se u aktivity čte z ní samé, u větve z počtu aktivit toho stavu
     uvnitř — jinak by se prázdné větve schovávaly i bez zapnutého filtru. */
  const stavOk = !stav ? true
    : n.lvl === "k" ? (stav === "schváleno") === ((n.rec||{}).stav === "schváleno")
    : (stav === "schváleno" ? n.aktS > 0 : n.aktCount - n.aktS > 0);
  const keepSelf = n.lvl === "k" ? hit && selfUt && stavOk : hit && !ut && stavOk;
  if (!kids.length && !keepSelf) return null;
  return Object.assign({}, n, {kids: kids});
}

/* ---- render ---- */
const TYPY = {a:"Agenda", p:"Proces", d:"Dílčí proces", k:"Aktivita"};
const sklonAkt = n => n === 1 ? "aktivitu" : n >= 2 && n <= 4 ? "aktivity" : "aktivit";
/* hloubka, do které se strom rozbaluje: 1 = jen agendy … 4 = i aktivity */
const uroven = () => +document.getElementById("fUroven").value;
const elTree = document.getElementById("tree");
function render(){
  const q = norm(document.getElementById("q").value.trim());
  const ut = document.getElementById("fUtvar").value;
  const stav = document.getElementById("fStav").value;
  const jenOsirele = document.getElementById("cOsirele").checked;
  elTree.textContent = "";

  const mk = (n, depth) => {
    const kids = (n.kids || []).map(c => mk(c, depth+1));

    const node = document.createElement("div");
    node.className = "node lvl-" + n.lvl;
    const row = document.createElement("div"); row.className = "row";

    const tw = document.createElement("span");
    tw.className = "tw" + (kids.length ? "" : " leaf");
    tw.textContent = kids.length ? "▾" : "•";
    row.appendChild(tw);

    const kod = document.createElement("span"); kod.className = "kod"; kod.textContent = n.kod;
    row.appendChild(kod);

    row.title = TYPY[n.lvl] + " " + n.kod
      + (n.nazev ? " — " + n.nazev : "")
      + (n.lvl === "k"
          ? (n.utvar ? "\nVykonává: " + n.utvar : "") + "\nKlikni pro detail"
          : "\nObsahuje " + n.aktCount + " " + sklonAkt(n.aktCount));

    const nm = document.createElement("span"); nm.className = "nm";
    nm.appendChild(hl(n.nazev, q));
    row.appendChild(nm);

    if (n.lvl === "k" && n.utvar){
      const b = document.createElement("span"); b.className="badge ut"; b.textContent = n.utvar;
      row.appendChild(b);
    } else if (n.lvl !== "k"){
      const b = document.createElement("span");
      b.className = "badge" + (n.aktCount ? "" : " no");
      b.textContent = n.aktCount ? n.aktCount + " akt." : "bez aktivit";
      /* Odznak počítá AKTIVITY, kdežto sloupec POLOŽKY v aplikaci počítá
         položky o úroveň níž. Na témž řádku tedy stojí „4" a „bez aktivit"
         a vypadá to jako spor (hlášeno 24.08.2026). Nápověda proto řekne
         obojí — kolik je uvnitř větví a kolik z nich vede k činnosti. */
      const potomku = (n.kids || []).length;
      const NIZSI = {a: ["proces", "procesy", "procesů"],
                     p: ["dílčí proces", "dílčí procesy", "dílčích procesů"],
                     d: ["aktivitu", "aktivity", "aktivit"]};
      const sklon = (p, s) => p === 1 ? s[0] : p >= 2 && p <= 4 ? s[1] : s[2];
      b.title = n.aktCount
        ? "Uvnitř této větve je " + n.aktCount + " " + sklonAkt(n.aktCount) + "."
        : (potomku
            ? "Uvnitř " + (n.lvl === "a" ? "této agendy" : n.lvl === "p" ? "tohoto procesu" : "tohoto dílčího procesu")
              + " " + (potomku === 1 ? "je" : "jsou") + " " + potomku + " "
              + sklon(potomku, NIZSI[n.lvl] || NIZSI.d) + ", ale "
            : "")
          + "činnosti k ní zatím nikdo nepopsal. Právě takhle je vidět, co ještě čeká na zmapování.";
      row.appendChild(b);
      if (!n.aktCount) node.classList.add("unmapped");
    }
    if (n.lvl === "k") row.addEventListener("click", () => detail(n));

    node.appendChild(row);
    if (kids.length){
      const box = document.createElement("div"); box.className = "kids";
      kids.forEach(k => box.appendChild(k));
      // box uzlu v hloubce d drží děti hloubky d+1; hledání rozbaluje vždy
      if (!q && uroven() < depth + 2) box.classList.add("hide"), tw.textContent = "▸";
      node.appendChild(box);
      tw.addEventListener("click", () => {
        box.classList.toggle("hide");
        tw.textContent = box.classList.contains("hide") ? "▸" : "▾";
      });
    }
    return node;
  };

  TREE.filter(n => !jenOsirele || n.sirotek)
      .map(n => filtruj(n, q, ut, stav, jenOsirele && !q))
      .filter(Boolean)
      .map(n => mk(n, 0))
      .forEach(n => elTree.appendChild(n));
  if (!elTree.children.length){
    const e = document.createElement("div"); e.className="empty";
    e.textContent = jenOsirele
      ? "Žádné osiřelé položky — každá má nad sebou svou nadřazenou úroveň."
      : "Nic neodpovídá zadanému filtru.";
    elTree.appendChild(e);
  }
}

function hl(text, q){
  const frag = document.createDocumentFragment();
  if (!q){ frag.appendChild(document.createTextNode(text)); return frag; }
  const h = norm(text); let i = 0, p;
  while ((p = h.indexOf(q, i)) !== -1){
    frag.appendChild(document.createTextNode(text.slice(i, p)));
    const m = document.createElement("mark"); m.textContent = text.slice(p, p+q.length);
    frag.appendChild(m); i = p + q.length;
  }
  frag.appendChild(document.createTextNode(text.slice(i)));
  return frag;
}

/* ---- rozkladový diagram ----
   Sloupec N+1 ukazuje děti uzlu vybraného ve sloupci N. Celý strom najednou
   se nekreslí schválně: dílčích procesů je 250 a stránka by měla přes
   10 000 px. Vybraná cesta se drží v `rzCesta` jako pole kódů, ne jako odkazy
   na uzly — filtr uzly přestaví a odkazy by ukazovaly do starého stromu. */
const rzCesta = [];
/* Zkrácení cesty MUSÍ jít přes tohle. `rzCesta.length = i` na kratším poli ho
   totiž NATÁHNE o prázdné prvky a sloupec pak tvrdí, že výběr existuje —
   chyba, která se 07.09.2026 vrátila podruhé, jen na jiném řádku. */
const rzZkrat = i => {
  if (rzCesta.length > i) rzCesta.length = i;
  // po zkrácení může na konci zůstat díra (nevybraná úroveň) — uklidit,
  // ať platí, že poslední index vždy existuje
  while (rzCesta.length && !((rzCesta.length - 1) in rzCesta)) rzCesta.length--;
};
const elRozklad = document.getElementById("rozklad");
const elSloupce = document.getElementById("rzSloupce");
const elSpojnice = document.getElementById("rzSpojnice");
/* Spojnice berou ZTMAVENÉ varianty (--a…--k), ne plné barvy linek: plná
   mátová má na bílé 1,90:1 a okrová 2,28:1, takže by tenká čára s poloviční
   průhledností zmizela (07.09.2026). */
const BARVA_VRSTVY = {a:"var(--a)", p:"var(--p)", d:"var(--d)", k:"var(--k)"};

function rzUzel(n, vybrany){
  const el = document.createElement("div");
  el.className = "rz-uzel lvl-" + n.lvl + (n.lvl !== "k" && !n.aktCount ? " unmapped" : "");
  el.setAttribute("aria-selected", vybrany ? "true" : "false");
  el.dataset.kod = n.kod;
  el.dataset.lvl = n.lvl;

  const kod = document.createElement("span");
  kod.className = "rz-kod"; kod.textContent = n.kod;
  el.appendChild(kod);
  const nm = document.createElement("span");
  nm.className = "rz-nazev";
  nm.appendChild(hl(n.nazev, norm(document.getElementById("q").value.trim())));
  el.appendChild(nm);

  const odznak = document.createElement("span");
  odznak.className = "rz-odznak";
  if (n.lvl === "k"){
    odznak.textContent = n.utvar ? "vykonává " + n.utvar : "";
  } else {
    const poc = (n.kids || []).length;
    odznak.textContent = poc
      ? poc + " " + sklonNizsi(n.lvl, poc) + " · " + n.aktCount + " " + sklonAkt(n.aktCount)
      : "bez položek";
  }
  if (odznak.textContent) el.appendChild(odznak);

  if ((n.kids || []).length){
    const sipka = document.createElement("span");
    sipka.className = "rz-sipka";
    sipka.textContent = "›";           // › jednoduchá pravá uvozovka
    sipka.setAttribute("aria-hidden", "true");
    el.appendChild(sipka);
  }

  el.title = TYPY[n.lvl] + " " + n.kod + (n.nazev ? " — " + n.nazev : "")
    + (n.lvl === "k" ? "\nKlikni pro detail" : "\nKlikni pro rozpad níž");
  return el;
}

const NIZSI_SKLON = {
  a: ["proces", "procesy", "procesů"],
  p: ["dílčí proces", "dílčí procesy", "dílčích procesů"],
  d: ["aktivita", "aktivity", "aktivit"]
};
const sklonNizsi = (lvl, p) => {
  const t = NIZSI_SKLON[lvl] || NIZSI_SKLON.d;
  return p === 1 ? t[0] : p >= 2 && p <= 4 ? t[1] : t[2];
};

/* Obsah vrstev počítá JEDNA funkce pro obě zobrazení. Kdyby si ho svislý
   a vodorovný rozklad počítal každý po svém, ukázala by dvě zobrazení téhož
   rejstříku jiná čísla — táž past, kvůli které vznikla společná `filtruj()`.
   Renderery se tedy liší jen tím, jak vrstvy vykreslí.

   Vrstva ukazuje potomky VŠECH položek v té předchozí, ne jen vybrané — tím
   vznikne stromový rozklad, ne jedna cesta (rozhodl uživatel 07.09.2026).
   Výběr slouží k zúžení: dokud nic vybráno není, jde dál celý obsah.
   Aktivita může patřit do víc dílčích procesů (M:N), takže se ve vrstvě
   objeví víckrát — jednou pod každým rodičem. Karty proto NEJDOU párovat
   podle kódu a spojnice se drží indexu rodiče. */
function rzVrstvy(pocet){
  const q = norm(document.getElementById("q").value.trim());
  const ut = document.getElementById("fUtvar").value;
  const stav = document.getElementById("fStav").value;
  const jenOsirele = document.getElementById("cOsirele").checked;

  const koren = TREE.filter(n => !jenOsirele || n.sirotek)
                    .map(n => filtruj(n, q, ut, stav, jenOsirele && !q))
                    .filter(Boolean);

  const vrstvy = [];
  let radky = koren.map(n => ({uzel: n, rodic: -1}));
  for (let i = 0; i < pocet; i++){
    // vybraný kód nemusí po změně filtru existovat
    if (rzCesta[i] && !radky.some(r => r.uzel.kod === rzCesta[i])) rzZkrat(i);
    vrstvy.push(radky);

    const zaklad = rzCesta[i] ? radky.filter(r => r.uzel.kod === rzCesta[i]) : radky;
    const dalsi = [];
    zaklad.forEach(r => {
      const poradiRodice = radky.indexOf(r);
      (r.uzel.kids || []).forEach(k => dalsi.push({uzel: k, rodic: poradiRodice}));
    });
    radky = dalsi;
  }
  return {koren: koren, vrstvy: vrstvy};
}

/* Prázdno kvůli filtru není totéž co konec větve. Bez tohohle rozlišení
   hlásí další vrstvy „konec rejstříku" i tehdy, když filtru neodpovídá nic. */
function rzPrazdno(korenu){
  const p = document.createElement("div");
  p.className = "rz-prazdno";
  p.textContent = korenu
    ? "Tady rejstřík končí — níž už nic není."
    : "Nic neodpovídá zadanému filtru.";
  return p;
}

function rzKlik(i, uzel){
  // klik na už vybranou kartu výběr zruší a vrátí do vrstvy vše
  if (rzCesta[i] === uzel.kod) rzZkrat(i);
  else { rzZkrat(i); rzCesta[i] = uzel.kod; }
  if (uzel.lvl === "k") detail(uzel);
  /* Klik v poslední viditelné vrstvě ji přidá, takže se dá větev rozkliknout
     bez sahání na volbu vlevo. */
  const vol = document.getElementById("fUroven");
  if (i === +vol.value - 1 && (uzel.kids || []).length && +vol.value < 4){
    vol.value = String(i + 2);
  }
  prekresli();
}

function rzKarta(r, i, poradi){
  const el = rzUzel(r.uzel, r.uzel.kod === rzCesta[i]);
  el.dataset.idx = String(poradi);
  el.dataset.rodic = String(r.rodic);
  el.addEventListener("click", () => rzKlik(i, r.uzel));
  return el;
}

function renderRozklad(){
  elSloupce.querySelectorAll(".rz-sloupec").forEach(el => el.remove());

  /* Volba „Rozbalit" tu neurčuje hloubku rozbalení jako ve stromu, ale kolik
     sloupců je vidět — víc než čtyři úrovně rejstřík nemá. */
  const sloupcu = uroven();
  [...document.querySelectorAll(".rz-hlavicky div")]
    .forEach((h, i) => h.hidden = i >= sloupcu);

  const {koren, vrstvy} = rzVrstvy(sloupcu);

  vrstvy.forEach((radky, i) => {
    const sloupec = document.createElement("div");
    sloupec.className = "rz-sloupec";
    sloupec.dataset.uroven = i;
    if (!radky.length) sloupec.appendChild(rzPrazdno(koren.length));
    else radky.forEach((r, poradi) => sloupec.appendChild(rzKarta(r, i, poradi)));
    elSloupce.appendChild(sloupec);
  });
  rzSpojnice();
}

/* Spojnice se počítají z pozic v DOM, ne z indexů — vrstvy mají vlastní
   scroll a uzly různou velikost, takže žádný výpočet „dopředu" by neseděl.
   Vede se čára od KAŽDÉ karty k jejím dětem (rodič se pozná podle
   `data-rodic`), takže je vidět celý rozklad, ne jen vybraná cesta.

   Jedna funkce kreslí obě zobrazení; liší se jen osou. Ve sloupcích vede
   čára doprava (z pravé hrany rodiče do levé hrany dítěte), v pásech dolů
   (ze spodní hrany do horní). Ořez „co je odscrollované, nekresli" je proto
   taky na jiné ose — a kdyby zůstal na té původní, čáry by přebíhaly přes
   celou plochu. */
function rzKresliSpojnice(ramecEl, svgEl, skupiny, dolu){
  svgEl.textContent = "";
  const ramec = ramecEl.getBoundingClientRect();
  svgEl.setAttribute("viewBox", "0 0 " + ramec.width + " " + ramec.height);
  svgEl.setAttribute("width", ramec.width);
  svgEl.setAttribute("height", ramec.height);

  skupiny.forEach((skupina, i) => {
    const dalsi = skupiny[i + 1];
    if (!dalsi) return;
    const rodice = [...skupina.querySelectorAll(".rz-uzel")];
    const mez = skupina.getBoundingClientRect();
    const mezDal = dalsi.getBoundingClientRect();
    // mimo svou skupinu odscrollovaná karta by vyrobila čáru přes celou plochu
    const venku = (r, m) => dolu
      ? (r.right < m.left || r.left > m.right)
      : (r.bottom < m.top || r.top > m.bottom);

    dalsi.querySelectorAll(".rz-uzel").forEach(cil => {
      const rodic = rodice[+cil.dataset.rodic];
      if (!rodic) return;
      const zdroj = rodic.getBoundingClientRect();
      const c = cil.getBoundingClientRect();
      if (venku(c, mezDal) || venku(zdroj, mez)) return;

      let tvar, lvl = cil.dataset.lvl;
      if (dolu){
        /* Každá spojnice vede samostatně od rodiče k dítěti. Mezistupeň
           s lomenými čarami sdílel vodorovnou sběrnice v půli mezery — vypadalo
           to jako organizační schéma, ale právě to sdílení vzalo informaci
           o tom, která karta patří pod kterou (řekl uživatel 07.09.2026).
           Vějíř samostatných křivek je proto zpět; místo, ve kterém se
           rozbíhají, dělá spodní odsazení řádky. */
        /* Všechny čáry vycházejí z JEDNOHO bodu — středu spodní hrany rodiče,
           tam, kde sedí značka rozpadu (rozhodl uživatel 07.09.2026). Vějíř
           z jednoho místa čte hierarchii líp než rozprostřené začátky: je
           vidět, že za všechny ty čáry může jedna karta. */
        const x1 = zdroj.left + zdroj.width / 2 - ramec.left, y1 = zdroj.bottom - ramec.top;
        const x2 = c.left + c.width / 2 - ramec.left,         y2 = c.top - ramec.top;
        const ohyb = (y2 - y1) / 2;
        tvar = "M" + x1 + "," + y1 + " C" + x1 + "," + (y1 + ohyb)
          + " " + x2 + "," + (y2 - ohyb) + " " + x2 + "," + y2;
      } else {
        const x1 = zdroj.right - ramec.left, y1 = zdroj.top + zdroj.height / 2 - ramec.top;
        const x2 = c.left - ramec.left,      y2 = c.top + c.height / 2 - ramec.top;
        const ohyb = (x2 - x1) / 2;
        tvar = "M" + x1 + "," + y1 + " C" + (x1 + ohyb) + "," + y1
          + " " + (x2 - ohyb) + "," + y2 + " " + x2 + "," + y2;
      }
      const cara = document.createElementNS("http://www.w3.org/2000/svg", "path");
      cara.setAttribute("d", tvar);
      cara.setAttribute("fill", "none");
      /* Barvu bere cílová vrstva, ne šedá --line: světle šedá čára na bílém
         podkladu byla v provozu prakticky neviditelná (07.09.2026). */
      cara.setAttribute("stroke", BARVA_VRSTVY[lvl] || "var(--muted)");
      cara.setAttribute("stroke-width", "1.8");
      cara.setAttribute("stroke-linecap", "round");
      cara.setAttribute("opacity", ".6");
      svgEl.appendChild(cara);
    });
  });
}

const rzSpojnice = () => rzKresliSpojnice(
  elSloupce, elSpojnice, [...elSloupce.querySelectorAll(".rz-sloupec")], false);

/* Vodorovná varianta: táž data, jen jinak rozvržená. Vrstvy počítá `rzVrstvy()`
   společná s variantou sloupcovou, karty staví `rzKarta()` — renderer řeší
   výhradně rozvržení, takže se obě zobrazení nemají čím rozejít.
   Hlavičky se tu generují (u sloupců jsou v HTML), protože pás je hlavička
   a řádka dohromady a počet pásů se mění s volbou „Rozbalit". */
const elRozkladH = document.getElementById("rozkladH");
const elPasy = document.getElementById("rzhPasy");
const elSpojniceH = document.getElementById("rzhSpojnice");
const PORADI_VRSTEV = ["a", "p", "d", "k"];

function renderRozkladH(){
  elPasy.querySelectorAll(".rzh-pas").forEach(el => el.remove());
  const pocet = uroven();
  const {koren, vrstvy} = rzVrstvy(pocet);

  vrstvy.forEach((radky, i) => {
    const pas = document.createElement("div");
    pas.className = "rzh-pas";
    pas.dataset.uroven = i;

    const hlavicka = document.createElement("div");
    hlavicka.className = "rzh-hlavicka";
    hlavicka.textContent = TYPY[PORADI_VRSTEV[i]];
    pas.appendChild(hlavicka);

    const radka = document.createElement("div");
    radka.className = "rzh-radka";
    if (!radky.length) radka.appendChild(rzPrazdno(koren.length));
    else radky.forEach((r, poradi) => radka.appendChild(rzKarta(r, i, poradi)));
    pas.appendChild(radka);

    elPasy.appendChild(pas);
  });
  rzSpojniceH();
}

const rzSpojniceH = () => rzKresliSpojnice(
  elPasy, elSpojniceH, [...elPasy.querySelectorAll(".rzh-radka")], true);

/* ---- přepínač zobrazení ---- */
const zobrazeni = () =>
  document.querySelector('#fZobrazeni button[aria-pressed=true]').dataset.zobrazeni;

function prekresli(){
  const z = zobrazeni();
  const rozklad = z === "rozklad", rozkladH = z === "rozkladH";
  elRozklad.hidden = !rozklad;
  elRozkladH.hidden = !rozkladH;
  document.getElementById("tree").hidden = rozklad || rozkladH;
  // vysvětlivka mluví o odznaku v ŘÁDKU stromu — v rozkladu nemá co popisovat
  document.getElementById("legenda").hidden = rozklad || rozkladH;
  if (rozklad) renderRozklad();
  else if (rozkladH) renderRozkladH();
  else render();
}

document.getElementById("fZobrazeni").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  [...e.currentTarget.querySelectorAll("button")]
    .forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  prekresli();
});

elSloupce.addEventListener("scroll", rzSpojnice, true);
elPasy.addEventListener("scroll", rzSpojniceH, true);
window.addEventListener("resize", () => {
  if (zobrazeni() === "rozklad") rzSpojnice();
  else if (zobrazeni() === "rozkladH") rzSpojniceH();
});

function detail(n){
  const k = n.rec, body = document.getElementById("detailBody");
  body.className = ""; body.textContent = "";
  const dl = document.createElement("dl");
  const put = (t, v) => {
    if (!v) return;
    const dt = document.createElement("dt"); dt.textContent = t;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.appendChild(dt); dl.appendChild(dd);
  };
  put("Aktivita", k.nazev);
  put("Identifikační kód", k.kod);
  const dp = DATA.dilci_procesy.find(x => x.kod === k.dilci_proces_kod);
  const pr = dp && DATA.procesy.find(x => x.kod === dp.proces_kod);
  const ag = pr && DATA.agendy.find(x => x.kod === pr.agenda_kod);
  put("Dílčí proces", dp && dp.nazev + " (" + dp.kod + ")");
  put("Proces", pr && pr.nazev + " (" + pr.kod + ")");
  put("Agenda", ag && ag.nazev + " (" + ag.kod + ")");
  put("Vykonává útvar", k.vykonava);
  put("Spolupracuje", k.spolupracuje);
  put("Vnitřní předpis", k.vnitrni_predpis);
  const vaz = DATA.vazby.filter(v => v.aktivita_kod === k.kod);
  if (vaz.length > 1) put("Další dílčí procesy", vaz.map(v => v.dilci_proces_kod).join(", "));
  put("Zdroj", "sekce " + k.sekce + ", řádek karty " + k.zdroj_radek);
  body.appendChild(dl);
}

/* ---- init ---- */
/* Jméno správce se do hlavičky nepíše — je to údaj o osobě, který v mapě
   určené celému úřadu nemá co dělat, a v generujícím flow byl navíc zapsaný
   natvrdo, takže by po rozšíření mimo sekci 3 lhal (auditní nález A-08). */
/* Sekce se do podtitulku nepíše (07.09.2026): mapa nese celý rejstřík
   (7 agend, 46 procesů), takže „Sekce 3“ z ní dělala výsek, kterým není. */
document.getElementById("meta").textContent = __GEN__;
const c = document.getElementById("counts");
[["agendy", DATA.agendy.length], ["procesy", DATA.procesy.length],
 ["dílčí procesy", DATA.dilci_procesy.length], ["aktivity", DATA.aktivity.length]]
 .forEach(([t,v]) => { const b = document.createElement("b"); b.textContent = v + " " + t; c.appendChild(b); });

const utvary = [...new Set(DATA.aktivity.flatMap(a => (a.vykonava||"").split(/,\s*/)).filter(Boolean))].sort();
const sel = document.getElementById("fUtvar");
utvary.forEach(u => { const o = document.createElement("option"); o.value = o.textContent = u; sel.appendChild(o); });

["q","fUtvar","fStav","fUroven","cOsirele"].forEach(id => document.getElementById(id)
  .addEventListener(id === "q" ? "input" : "change", () => {
    /* Sáhnout na „Rozbalit" znamená „ukaž vše až po tuhle úroveň" — a to
       platí v obou rozkladech, ne jen ve stromu. Dokud volba nechávala
       výběr být, ukázala jen jednu větev: kdo měl vybranou agendu bez
       aktivit, dostal na „vše až po aktivity" hlášku, že rejstřík končí
       (řekl uživatel 07.09.2026). Výběr se proto zahazuje a zužovat se dá
       zase klikáním. */
    if (id === "fUroven") rzCesta.length = 0;
    prekresli();
  }));

/* Bez osiřelých položek nemá přepínač co ukázat — zůstává vidět (jinak by
   nebylo poznat, že se na ně kontroluje), ale je neaktivní a řekne proč. */
const cOsirele = document.getElementById("cOsirele");
if (!TREE.some(n => n.sirotek)){
  cOsirele.disabled = true;
  cOsirele.parentElement.title = "Žádné osiřelé položky nejsou — každá má nad sebou svou nadřazenou úroveň.";
}

/* volby, které se jen přepnou třídou nebo proměnnou — strom se nepřekresluje */
const pamet = {
  read(k, kdyzNic){ try { return localStorage.getItem(k) ?? kdyzNic; } catch(e){ return kdyzNic; } },
  write(k, v){ try { localStorage.setItem(k, v); } catch(e){ /* náhled bez úložiště */ } }
};

const cKod = document.getElementById("cKod");
function pouzijKod(){
  document.body.classList.toggle("bez-kodu", !cKod.checked);
  pamet.write("mapa.kod", cKod.checked ? "1" : "0");
}
cKod.checked = pamet.read("mapa.kod", "1") === "1";
cKod.addEventListener("change", pouzijKod);
pouzijKod();

const fs = document.getElementById("fVelikost");
function pouzijVelikost(px){
  document.documentElement.style.setProperty("--fs", px + "px");
  fs.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.fs === String(px) ? "true" : "false"));
  pamet.write("mapa.fs", px);
  // uzly změní výšku, takže spojnice spočítané pro starou velikost nesedí
  if (typeof zobrazeni === "function" && zobrazeni() === "rozklad") rzSpojnice();
}
fs.addEventListener("click", e => {
  const b = e.target.closest("button[data-fs]");
  if (b) pouzijVelikost(+b.dataset.fs);
});
pouzijVelikost(+pamet.read("mapa.fs", "14") || 14);

prekresli();
</script>
